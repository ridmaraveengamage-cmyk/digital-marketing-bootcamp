{n:6,icon:"play",title:"Creative that performs: video, hooks and testing",why:"In modern advertising, the ad itself decides who sees it and what it costs.",
 intro:["Ad platforms now automate most targeting and bidding. What they can't automate is the idea, the first three seconds and the story. That's why the creative (the actual image or video) has become the biggest lever marketers control.",
  "Today you learn how high-performing short videos are built, how to read their numbers, and how professional brands test creative, using real ads you can watch in public libraries."],
 sections:[
  ["Why creative matters more than ever",[
   "In the past, advertisers chose detailed audiences: “women aged 25–34 interested in yoga”. Today Meta, TikTok and Google mostly find the audience themselves using their own data. If you give them a broad audience, they show your ad to people similar to those who respond to it.",
   "That means the ad itself acts as targeting. A video about saving money will attract price-conscious viewers; a video about luxury will attract people who respond to luxury. Different creative angles reach different people. This is why professionals say **creative is the new targeting**.",
   "It also means a weak ad gets expensive. Platforms reward ads people engage with, through lower costs, and penalise ads people skip."]],
  ["The anatomy of a short video ad",[
   "Most effective short videos (Reels, TikTok, Shorts, Stories) follow a similar structure. Lengths of 15–30 seconds are common.",
   {s:["**Hook (0–3 seconds)**: stop the scroll. A surprising visual, a bold statement, a question or the end result shown first.","**Problem**: the pain or desire the viewer recognises.","**Value or demonstration**: show the product solving it, ideally on camera rather than described.","**Proof**: reviews, numbers, before and after, a real customer.","**Call to action**: what to do now, shown on screen and said out loud."]},
   "Design for **sound off** (many people watch muted) with captions and on-screen text. Shoot **vertical (9:16)** to fill the phone screen. Make it look **native**: like content people already enjoy on that platform, not a TV commercial squeezed onto a phone."]],
  ["Hooks that stop the scroll",[
   "On short-video platforms, most viewers decide within one to three seconds whether to keep watching. Common hook types:",
   {l:["**Bold claim**: “This is the only phone case that survived a 10-metre drop.”","**Question**: “Why does your rice always stick?”","**Call out the viewer**: “If you run a small shop, watch this.”","**Show the result first**: the finished dish, the clean room, the transformation.","**Visual surprise or pattern interrupt**: unexpected movement, colour or object.","**Story opener**: “I lost my first customer because of one mistake…”"]},
   {m:"Opening with a logo, a slow establishing shot or “Hi everyone, today I want to talk about…”. Viewers have already scrolled away."}]],
  ["Formats that work",[
   {l:["**UGC-style**: a real person talking to camera on a phone, reviewing or demonstrating.","**Founder or expert video**: the person behind the brand explaining why it exists. Builds trust.","**Demonstration**: the product doing its job, close up.","**Testimonial**: customers describing results in their own words.","**Static image**: a strong offer, product photo or quote. Still effective, cheap to make.","**Carousel**: several swipeable images, good for multiple products or step-by-step stories.","**Memes and trends**: fast and native, but must fit the brand."]},
   {x:["Real world: Burger King's “Whopper Detour”","In 2018 Burger King (with the agency FCB New York) offered a Whopper for one cent through its app, but only if the customer opened the app while near a McDonald's. The app then directed them to the nearest Burger King. The idea combined a cheeky challenge to its rival with location technology and pushed huge numbers of app downloads. The creative idea itself was the targeting."]}]],
  ["Reading creative numbers",[
   "Each part of the video has its own metric, so the numbers tell you which part to fix.",
   {c:"Hook rate  = 3-second video views ÷ impressions\nHold rate  = ThruPlays (15 s or completion) ÷ 3-second views\nCTR        = clicks ÷ impressions\nCPA        = spend ÷ results"},
   {l:["**Low hook rate**: people don't stop. Change the first 1–3 seconds.","**Good hook, low hold rate**: people stop, then leave. Tighten the middle, cut slow parts.","**Good watching, low CTR**: people enjoy it but don't act. Fix the offer or the CTA.","**Good CTR, poor CPA**: people click but don't buy. The landing page or offer is the problem, not the ad."]},
   "Benchmarks vary a lot by industry and country, so compare each ad with your own account's averages rather than numbers you read online.",
   {w:"creative"}]],
  ["How professionals test creative",[
   "Professional advertisers rarely bet on one ad. They test several **concepts** (different angles or ideas), keep the winners and keep producing new ones.",
   {s:["Start with 3–6 different concepts: for example, a price angle, a quality angle, a customer story and a founder video.","Let them run long enough to get meaningful data.","Keep the winners and switch off the clear losers.","Make variations of the winners (new hooks, new people, new lengths).","Refresh regularly, because even great ads tire as frequency rises (ad fatigue)."]},
   "You can see this testing in public. In Meta Ad Library many ads say “This ad has multiple versions”, and big brands often run dozens of variations of one idea at the same time.",
   {m:"Testing tiny changes such as button colour on a small budget. The difference is too small to detect. Test big, different ideas first."}]]],
 live:[
  {t:"Study top-performing ads with real metrics",url:L.ttTop,mins:12,steps:["Open TikTok Creative Center's Top Ads (free, no ad account needed).","Filter by a region and an industry that interests you (for example e-commerce or apps). Sort by a performance metric such as CTR.","Watch 3 top ads. For each, write the hook in the first 3 seconds and the structure (hook, problem, value, proof, CTA)."],notice:"Top ads look native to the platform and get to the point immediately."},
  {t:"Find a brand testing many versions",url:L.adlib,mins:10,steps:["In Meta Ad Library, search for a large e-commerce or app brand.","Open an ad that says it has multiple versions and click through the versions.","What changes between versions: the hook, the image, the text, the offer? What stays the same?"],notice:"Brands test one variable at a time on top of a proven idea."},
  {t:"Watch the Whopper Detour case study",url:L.ytBK,mins:6,steps:["Watch the 2-minute case study video.","Write down the single idea in one sentence, and how technology carried the creative."],notice:"The best creative ideas are simple to explain in one sentence."}],
 recap:["With automated targeting, the creative decides who sees the ad and how cheaply.","Short video structure: hook, problem, value, proof, CTA. Vertical, captioned, native.","Most viewers decide in 1–3 seconds whether to keep watching.","Hook rate, hold rate, CTR and CPA each point to a different part to fix.","Test different concepts, scale winners, refresh before fatigue."],
 quiz:[["Why is creative called “the new targeting”?",["Automated platforms show each ad to people similar to those who respond to it","Creative files contain location data","Platforms no longer allow audience selection at all"],0,"Different angles attract different audiences."],
  ["Within how long do most viewers decide whether to keep watching a short video?",["1–3 seconds","30 seconds","2 minutes"],0,"That's why the hook is critical."],
  ["High hook rate but low hold rate. What should you fix?",["The middle of the video","The first second","The landing page"],0,"People stopped, then lost interest."],
  ["Lots of clicks but few purchases. Where is the problem most likely?",["The landing page or offer","The hook","The thumbnail"],0,"The ad did its job; the next step didn't."],
  ["What made the Whopper Detour work?",["A one-cent Whopper unlocked only near McDonald's via the app","A celebrity endorsement","A TV-only campaign"],0,"The creative idea and location technology worked together."],
  ["What should you test first on a small budget?",["Big, different concepts","Button colours","Font sizes"],0,"Small changes need huge amounts of data to detect."]],
 terms:[["Creative","The actual ad: image, video and text."],["Hook","The first 1–3 seconds that stop the scroll."],["Hook rate","3-second views ÷ impressions."],["Hold rate","ThruPlays ÷ 3-second views."],["Native content","Content that looks like it belongs on the platform."],["Ad fatigue","Falling performance as people see an ad too often."],["Concept test","Testing different creative ideas against each other."]]},

{n:7,icon:"megaphone",title:"How online advertising works",why:"Before learning Meta and Google, understand the machine they share.",
 intro:["All the big ad platforms work in a similar way. They sell attention through instant auctions, use data to decide who sees which ad, and measure results with tracking code. Today explains that machinery in plain terms.",
  "Once you understand it, Meta Ads (Day 8) and Google Ads (Day 9) will feel like two versions of the same system."],
 sections:[
  ["Pricing models: how you pay",[
   "Advertisers can be charged in different ways. Each model shifts the risk between the advertiser and the platform.",
   {l:["**CPM** (cost per thousand impressions): you pay to be shown, whether or not anyone clicks. Common on Meta, TikTok and YouTube for reach.","**CPC** (cost per click): you pay only when someone clicks. Standard for Google Search ads.","**CPV** (cost per view): you pay when someone watches a video for a set time. Used on YouTube.","**CPA** (cost per acquisition): you pay per sale or lead. Common for affiliates."]},
   "Even when you are charged by impression, the platform optimises for the result you choose (for example purchases), so you should judge every campaign by cost per result, not by the price of an impression."]],
  ["The ad auction",[
   "Each time a page or feed loads, an auction runs in a fraction of a second. The winner is **not simply the highest bidder**. Platforms combine your bid with how good and relevant your ad is, because showing irrelevant ads would drive users away.",
   {l:["**Google Ads**: Ad Rank is based on your bid, the ad's quality (expected click-through rate, ad relevance, landing page experience), and other factors such as context and assets.","**Meta**: the ad with the highest “total value” wins, combining your bid, the estimated chance the person takes the action you want, and ad quality."]},
   "A simplified teaching model makes the idea clear: **Ad Rank = bid × quality**. A better ad can beat a higher bid and pay less per click. Try it below: change the bids and Quality Scores and watch positions and prices change.",
   {w:"auction"},
   {m:"Thinking the answer to poor results is always a higher bid. Improving relevance and the landing page often lowers costs more than raising bids."}]],
  ["Targeting: how platforms know who to show",[
   "Platforms decide who sees an ad using several kinds of information.",
   {l:["**Platform data**: what people do on the platform (pages liked, videos watched, searches made). This powers interest and behaviour targeting.","**Your own data** (first-party data): customer lists and website visitors you share with the platform for retargeting or to find similar people (lookalikes).","**Contextual targeting**: showing ads based on the content being viewed or searched (a search for “running shoes”, a YouTube video about cooking).","**Algorithmic or broad targeting**: you set only basics (country, age), and the platform's software finds people likely to act, based on who responds to the ad."]},
   "The trend is clear: platforms are moving from manual audience selection towards automation, which makes good conversion data and good creative the advertiser's main tools."]],
  ["Tracking and attribution in brief",[
   "To optimise, platforms need to know what happened after someone saw or clicked an ad. Websites install a small piece of code (a **pixel** or **tag**) that reports actions such as purchases back to the platform. Day 10 explains this in detail.",
   "**Attribution** is deciding which ad or channel gets credit for a sale. Each platform counts the conversions it believes it caused, using its own rules (called an **attribution window**, for example “within 7 days of a click”). Because a customer may have seen a Meta ad and clicked a Google ad, both platforms may claim the same sale. Adding up platform reports often gives more sales than the business actually made.",
   {m:"Adding up the conversions reported by each platform and believing the total. Always compare with the sales the business actually recorded."}]],
  ["Privacy changes and what they mean",[
   "Over recent years, privacy rules and technology changes have limited how much tracking is possible.",
   {l:["**Apple's App Tracking Transparency (2021)**: iPhone apps must ask permission to track users across other companies' apps and websites. Many users decline, so platforms see less data.","**Browser cookie restrictions**: Safari and Firefox restrict third-party cookies (tracking files set by other companies) by default. Google decided in 2024–2025 to keep third-party cookies in Chrome rather than remove them, but the industry has still shifted towards first-party data.","**Privacy laws**: GDPR in Europe and Sri Lanka's Personal Data Protection Act No. 9 of 2022 set rules on collecting and using personal data, including consent."]},
   "The response has been to rely more on **first-party data** (information customers give you directly), server-to-server tracking (such as Meta's Conversions API), consent tools and statistical modelling."]],
  ["Does advertising actually work? Incrementality",[
   "The most important question in advertising is **incrementality**: how many sales happened because of the ad that would not have happened without it? Platform reports can't answer this alone, because they also credit people who would have bought anyway.",
   {x:["Real world: eBay's search ad experiment","Economists working with eBay (Blake, Nosko and Tadelis, published in Econometrica in 2015) ran large experiments switching search ads on and off. Ads on eBay's own brand name showed no measurable short-term benefit: people searching “eBay” simply clicked the free result instead. Ads on other keywords did help new and infrequent users, but most of the spending went on frequent eBay shoppers who would have bought anyway, so average returns were negative."]},
   "This doesn't mean ads don't work. It means you must test what truly adds sales, for example by switching ads off in some regions or for some time periods and comparing (Day 11). Uber's 2017 discovery (Day 3) is another example of the same lesson."]]],
 live:[
  {t:"Dissect a real search results page",url:L.gsearch("laptop price in sri lanka"),mins:10,steps:["Open the search. Find every result labelled “Sponsored”: these are paid ads.","For each ad, note the headline, the extra links underneath (sitelinks) and whether it shows prices or ratings.","Count how many ads appear before the first free (organic) result. Then try a second search, such as “car insurance sri lanka”."],notice:"Commercial searches attract many advertisers because the searchers are close to buying."},
  {t:"See an advertiser's history in Google's library",url:L.adstr,mins:8,steps:["Open the Ads Transparency Center and search for a large advertiser.","Open an ad and look at the date range it was shown and the regions it ran in.","Compare text ads with video ads from the same advertiser."],notice:"Transparency libraries let anyone study any advertiser's real ads for free."},
  {t:"Read the eBay research summary",url:L.ebay,mins:7,steps:["Read the abstract of the eBay paper.","Find the result for brand keywords and for non-brand keywords.","Think about it: who are the customers an ad truly changes?"],notice:"Ads matter most for people who weren't going to buy anyway, such as new and infrequent customers."}],
 recap:["CPM, CPC, CPV and CPA are pricing models; judge everything by cost per result.","Auctions combine bid and quality, so a better ad can win while paying less.","Targeting is shifting from manual audiences to automation driven by conversion data and creative.","Platforms each claim credit, so reported totals often exceed real sales.","Incrementality (what the ad truly caused) is the real test, as eBay and Uber found."],
 quiz:[["How are Google Search ads usually charged?",["Per click (CPC)","Per 1,000 impressions only","Per sale only"],0,"You pay when someone clicks."],
  ["Who wins an ad auction?",["The best combination of bid and ad quality","Always the highest bidder","The advertiser with most followers"],0,"Quality lets a better ad win at a lower price."],
  ["Why might adding up all platforms' reported sales give a wrong total?",["Several platforms can claim the same sale","Platforms never report sales","Sales are only counted on Tuesdays"],0,"Each uses its own attribution rules."],
  ["What did Apple's App Tracking Transparency (2021) change?",["Apps must ask permission to track users across other apps and sites","iPhones stopped showing ads","Ads became free"],0,"Many users decline, reducing data for advertisers."],
  ["What did the eBay experiment find about brand-name search ads?",["No measurable short-term benefit","They doubled sales","They were the most profitable ads"],0,"Searchers clicked the free result instead."],
  ["What is incrementality?",["Sales that happened because of the ad and wouldn't have otherwise","Increasing the budget every day","The number of ad versions"],0,"It separates real impact from people who'd buy anyway."]],
 terms:[["CPM","Cost per 1,000 impressions."],["Ad auction","The instant process that decides which ad is shown."],["Ad Rank","Google's score combining bid, quality and other factors."],["First-party data","Data customers give a business directly."],["Attribution","Deciding which ad or channel gets credit for a result."],["Attribution window","How long after a click or view a conversion is credited."],["Incrementality","Results caused by marketing that wouldn't have happened otherwise."]]}
];

const DAYS2=[
{n:8,icon:"megaphone",title:"Meta Ads in depth",why:"Facebook and Instagram ads are the most common paid channel for businesses in Sri Lanka.",
 intro:["Meta's advertising system places ads across Facebook, Instagram, Messenger, WhatsApp-linked ads and partner apps. It's used by everyone from home businesses to global brands, and it's the paid skill employers ask for most often.",
  "Today walks through how a Meta account is structured, what every setting does and how professionals read the results. You can look around Ads Manager for free without spending anything."],
 sections:[
  ["How a Meta ad account is organised",[
   "Everything sits inside a **business portfolio** (managed in Meta Business Suite). The portfolio owns the business's assets and controls who can access them.",
   {l:["**Facebook Page and Instagram account**: the identities ads run from.","**Ad account**: where campaigns live and where billing is attached.","**Dataset (Meta Pixel)**: receives events from the website and server, such as purchases and leads.","**People and partners**: employees and agencies given specific permissions."]},
   "Professionals give agencies **partner access** rather than sharing passwords, verify the business's website domain, and use two-factor authentication, because a hacked ad account can spend money and lose the page."]],
  ["Campaign, ad set and ad",[
   "Every Meta campaign has three levels. Knowing what each level controls is the foundation of everything else.",
   {l:["**Campaign**: the objective. Meta offers six: **Awareness, Traffic, Engagement, Leads, App promotion and Sales**. The objective tells the system what result to look for.","**Ad set**: who, where, when and how much. Audience, placements, schedule, budget and the **optimisation event** (for example purchases or leads).","**Ad**: what people see. Image or video, primary text, headline, call-to-action button and destination (website, WhatsApp, form)."]},
   "Budget can be set per ad set, or at campaign level so Meta moves money to the best-performing ad sets automatically (Advantage+ campaign budget).",
   {m:"Choosing the Traffic objective when the goal is sales. Meta will find people who click cheaply, who are often not buyers. Choose the objective that matches the result you actually want."}]],
  ["Audiences",[
   {l:["**Core audiences**: location, age, gender, language, interests and behaviours.","**Custom audiences**: people who already interacted with you: website visitors, video viewers, Instagram engagers, customer lists (with consent).","**Lookalike audiences**: new people similar to a source audience such as past buyers.","**Advantage+ audience**: you give suggestions, and Meta's system searches more widely for people likely to convert."]},
   "Modern practice is usually **broad targeting plus strong creative** for finding new customers, and **custom audiences** for retargeting people who visited but didn't buy. Exclusions (for example recent buyers) stop you paying to reach people who already converted."]],
  ["Placements and formats",[
   "Ads can appear in Facebook and Instagram Feeds, Stories, Reels, Messenger, search results and partner apps (Audience Network). **Advantage+ placements** lets Meta choose where results are cheapest.",
   {l:["**Feed**: square (1:1) or vertical (4:5) images and videos.","**Stories and Reels**: full-screen vertical (9:16). Keep text away from the top and bottom edges where the interface sits.","**Carousel**: up to 10 swipeable cards.","**Collection and catalogue ads**: products pulled from a product catalogue."]},
   "Supplying the right size for each placement matters, because a feed video stretched into a Story looks careless and performs worse."]],
  ["Delivery and the learning phase",[
   "When a new ad set starts, Meta's delivery system explores to learn who responds. This is the **learning phase**. Meta says an ad set generally needs about **50 optimisation events within 7 days** to exit it. Until then, results are less stable and costs are often higher.",
   "Significant edits, such as changing the audience, the creative or the budget by a large amount, can restart learning. That's why professionals avoid editing every day, and why splitting a small budget into many tiny ad sets usually performs badly: none of them gets enough events to learn.",
   {m:"Optimising for purchases when the budget can only produce a few purchases a week. The ad set may never leave learning. A higher-volume event earlier in the funnel (such as add to cart or a lead) can help small accounts."}]],
  ["Signals: Pixel and Conversions API",[
   "Meta optimises using events your website sends back. Two methods work together:",
   {l:["**Meta Pixel**: code in the visitor's browser that reports events such as PageView, AddToCart and Purchase.","**Conversions API (CAPI)**: your server sends the same events directly to Meta. Fewer events are lost to ad blockers, browser restrictions and connection problems."]},
   "When both send the same purchase, a shared **event ID** lets Meta count it once (deduplication). Sending securely hashed customer details such as email improves **Event Match Quality**, which helps Meta connect events to the right people and optimise better."]],
  ["Reading results and diagnosing problems",[
   "Meta reports conversions using an **attribution setting**, by default within 7 days of a click or 1 day of viewing the ad. Read results from the top of the funnel down, because each metric points to a different cause.",
   {s:["**CPM** high? The audience is competitive or seasonal (for example before Christmas), or ad quality is low.","**CTR** low? The creative isn't grabbing attention: test new hooks and angles.","**Landing page views** much lower than clicks? The page is slow or broken.","**Conversion rate** low? The offer, price or page isn't convincing.","**CPA versus your maximum**, and **ROAS versus break-even ROAS** (Day 3): is the campaign actually profitable?","**Frequency** rising while results fall? Ad fatigue: refresh the creative."]},
   "Try the diagnostic tool with the example numbers, then change them to see how each metric shifts.",
   {w:"meta"}]]],
 live:[
  {t:"See real targeting and reach data in Meta's EU library",url:L.adlib,mins:12,steps:["Open Meta Ad Library. Set the country to a European Union country such as France or Germany.","Search for a global brand (for example Nike or Spotify) and open an ad's details.","Because of EU law (the Digital Services Act), you can see extra information: the ad's reach in the EU and the targeting used (locations, age range, gender)."],notice:"This is real targeting data from real campaigns, which normally only the advertiser can see."},
  {t:"Tour Ads Manager without spending",url:L.adsmgr,mins:12,steps:["Log in with your Facebook account and open Ads Manager. (If it asks you to set up an ad account, you can do that without adding a payment method or publishing anything.)","Click Create and look at the six objectives. Choose Sales and step through the ad set screen: budget, audience, placements, optimisation event.","Read the help text next to each setting, then close without publishing."],notice:"Seeing the real screens makes every concept from today concrete."},
  {t:"Take a free Meta lesson",url:L.blueprint,mins:6,steps:["Open Meta Blueprint's free courses.","Find a beginner course on Ads Manager or campaign objectives and bookmark it for after the bootcamp."],notice:"Meta's own courses explain each setting with official screenshots."}],
 recap:["A business portfolio owns the Page, Instagram, ad account and dataset.","Campaign = objective; ad set = who, where, budget and optimisation; ad = what people see.","Broad targeting plus strong creative finds new customers; custom audiences retarget.","The learning phase needs about 50 optimisation events in 7 days; avoid constant edits.","Pixel plus Conversions API, deduplicated with an event ID, gives Meta better signals."],
 quiz:[["Which level of a Meta campaign sets the audience and budget?",["Ad set","Campaign","Ad"],0,"The campaign sets the objective; the ad holds the creative."],
  ["How many campaign objectives does Meta offer?",["Six","Two","Twelve"],0,"Awareness, Traffic, Engagement, Leads, App promotion, Sales."],
  ["About how many optimisation events does an ad set need to exit learning?",["About 50 in 7 days","About 5 in 7 days","About 5,000 in a day"],0,"That's why consolidating budget helps."],
  ["Clicks are high but landing page views are much lower. What is the likely problem?",["A slow or broken landing page","Weak creative","Too low a budget"],0,"People click but leave before the page loads."],
  ["What does the Conversions API do?",["Sends events from your server directly to Meta","Designs ads automatically","Blocks competitors' ads"],0,"It reduces events lost in the browser."],
  ["You want sales. Which objective should you choose?",["Sales","Traffic","Engagement"],0,"Meta optimises for the result the objective names."]],
 terms:[["Business portfolio","Meta's container for a business's pages, ad accounts and datasets."],["Ad set","The level that controls audience, placements, budget and optimisation."],["Custom audience","People who already interacted with your business."],["Lookalike audience","New people similar to a source audience."],["Learning phase","The period when Meta's delivery is still learning."],["Conversions API","Server-to-server event sending to Meta."],["Event Match Quality","How well Meta can match your events to people."]]},

{n:9,icon:"searchad",title:"Google Ads in depth",why:"Search ads reach people at the exact moment they look for something.",
 intro:["Google Ads places ads on Google Search, YouTube, Gmail, Discover, Maps, Google Shopping and millions of partner websites and apps. It's the main tool for reaching people who are actively searching.",
  "Today explains how Search campaigns work in detail, then the automated and visual campaign types such as Performance Max, Demand Gen, YouTube and Shopping."],
 sections:[
  ["Google's networks and campaign types",[
   "Google offers several campaign types, each built for a different goal.",
   {l:["**Search**: text ads on Google results when people search chosen keywords. Captures existing demand.","**Performance Max**: one campaign that runs across all Google channels (Search, YouTube, Display, Discover, Gmail, Maps, Shopping), driven by your goal and assets.","**Demand Gen**: visual ads on YouTube, Shorts, Discover and Gmail, built to create demand.","**Video**: YouTube ads for reach, views and awareness.","**Display**: image ads on websites and apps, mainly for reach and retargeting.","**Shopping**: product ads with photo and price, powered by a product feed from Google Merchant Center.","**App**: promotes mobile app installs and actions."]}]],
  ["Search campaigns: keywords and match types",[
   "A Search campaign is organised as campaign → **ad groups** (each a tight theme) → **keywords** plus ads. When someone searches, Google checks whether the search matches your keywords.",
   {l:["**Exact match** [running shoes]: searches with the same meaning.","**Phrase match** \"running shoes\": searches that include the meaning of the phrase, such as “best running shoes for women”.","**Broad match**: searches related to the keyword's meaning, guided by Google's AI and your conversion data. Works best combined with Smart Bidding."]},
   "The **search terms report** shows the actual searches that triggered your ads. Professionals read it every week and add **negative keywords** to block irrelevant searches, such as “free”, “jobs”, “second hand” or “how to make”.",
   "Many advertisers separate **brand** campaigns (people searching the company's own name) from **non-brand** campaigns, because brand clicks are cheap and convert well and can hide poor non-brand results when mixed together. Remember the eBay research from Day 7: brand ads may add little if nobody else is bidding on your name.",
   {x:["Real world: AI Max for Search (2026)","Google is adding more automation to Search. In April 2026 it announced that Dynamic Search Ads (which built ads from a website's content) would be replaced by **AI Max for Search**, which can match ads to searches beyond your keywords and customise ad text. From September 2026 advertisers could no longer create new Dynamic Search Ads campaigns, and remaining ones were upgraded to AI Max."]}]],
  ["Quality Score and Ad Rank in practice",[
   "Google gives each keyword a **Quality Score** from 1 to 10. It is a diagnostic tool built from three parts:",
   {l:["**Expected click-through rate**: how likely people are to click your ad for that search.","**Ad relevance**: how closely the ad matches the searcher's intent.","**Landing page experience**: how useful, relevant and fast the page is after the click."]},
   "Higher quality improves your Ad Rank, which means a better position, often at a lower cost per click (remember the auction simulator on Day 7). Ways to improve it: keep ad groups tightly themed, use the searcher's words in headlines, and send people to a page that matches the search exactly."]],
  ["Ads and assets",[
   "Search ads are **responsive search ads (RSAs)**. You provide up to **15 headlines (30 characters each)** and **4 descriptions (90 characters each)**, and Google tests combinations to show the best one for each search. **Ad strength** rates how varied and relevant your inputs are.",
   "**Assets** (previously called extensions) add extra information and space:",
   {l:["**Sitelinks**: extra links to specific pages.","**Callouts**: short phrases such as “Free delivery” or “24/7 support”.","**Structured snippets**: lists such as brands or services.","**Call, location, image and price assets**."]},
   "Assets make ads larger and more useful, which usually raises click-through rate."]],
  ["Bidding strategies",[
   {l:["**Manual CPC**: you set a maximum price per click for each keyword. Full control, more work.","**Maximise clicks**: Google gets as many clicks as possible within budget. Useful only when clicks are the goal.","**Maximise conversions**: Google bids to get the most conversions within budget.","**Target CPA**: Google aims for an average cost per conversion you set.","**Maximise conversion value / Target ROAS**: Google bids for revenue, aiming at a return you set."]},
   "The automated strategies are called **Smart Bidding**. They use signals such as device, location, time and the searcher's context for each auction. They need accurate conversion tracking and enough conversions to learn, often around 30 or more a month, so many advertisers start with Maximise conversions and move to target CPA or target ROAS once data builds up."]],
  ["Performance Max, Demand Gen, YouTube and Shopping",[
   "**Performance Max** uses **asset groups** (headlines, descriptions, images, videos, logos) and **audience signals** (customer lists, website visitors, interests) to find conversions across all of Google. Signals are hints, not limits. Advertisers can add brand exclusions and negative keywords and can see which channels and searches drove results.",
   "**Shopping** ads need a **product feed** in Google Merchant Center: titles, images, prices and stock for every product. Better titles and images mean better Shopping performance. Merchant Center also offers free product listings.",
   "**Demand Gen** and **YouTube** ads create interest among people who weren't searching. Judge them by reach, view rate, engaged views and increases in brand searches, not only last-click sales, because their job is to start the journey.",
   {w:"campaign"}]]],

{n:10,icon:"code",title:"Tracking and analytics foundations",why:"Without accurate data, ads can't optimise and you can't tell what works.",
 intro:["Every number you have studied so far (clicks, conversions, CPA, ROAS) depends on tracking. Tracking is the technical layer that records what visitors do and sends it to analytics and ad platforms.",
  "Today explains how it works in plain language, and you'll look at the tracking on real websites using free tools anyone can use."],
 sections:[
  ["Why tracking matters",[
   "Tracking closes the loop between an ad and a result. Without it, Meta and Google can't tell which ads bring customers, so their automated bidding can't learn, and you can't calculate CPA or ROAS.",
   "Good tracking answers three questions: **where** did visitors come from, **what** did they do on the site, and **which** of them became customers?",
   {m:"Launching ads before tracking is tested. If purchases aren't recorded, the platform optimises blindly and reports are wrong from day one."}]],
  ["Cookies, pixels and tags",[
   {l:["A **cookie** is a small text file a website stores in your browser to remember you: your login, your cart, or that you visited before.","**First-party cookies** are set by the site you're visiting. **Third-party cookies** are set by other companies (such as ad networks) to follow people across sites. Safari and Firefox restrict third-party cookies by default.","A **pixel** or **tag** is a small snippet of JavaScript code on a website that sends information (like “a purchase of LKR 5,000 happened”) to a platform such as GA4 or Meta."]},
   "A typical online shop might have tags for Google Analytics, Meta, Google Ads and TikTok all on the same page."]],
  ["Google Tag Manager and the data layer",[
   "Adding every tag directly into a website's code gets messy. **Google Tag Manager (GTM)** is a free tool that holds all the tags in one container, so marketers can add and change tracking without asking developers to edit the site every time.",
   {l:["**Tags**: what to fire (for example a GA4 purchase event).","**Triggers**: when to fire it (for example when the thank-you page loads).","**Variables**: values the tag needs (for example the order value)."]},
   "The website passes information to GTM through the **data layer**, a JavaScript list where the site describes what just happened. You'll see a real one in today's live section.",
   {c:"window.dataLayer.push({\n  event: 'purchase',\n  value: 5000,\n  currency: 'LKR',\n  transaction_id: 'T12345'\n});"}]],
  ["How Google Analytics 4 records data",[
   "**Google Analytics 4 (GA4)** is Google's free analytics tool. It replaced Universal Analytics, which stopped processing data on 1 July 2023. GA4 records everything as **events**, each with **parameters** that describe it.",
   {l:["**Automatically collected events**: page_view, session_start, first_visit.","**Enhanced measurement**: scrolls, outbound clicks, site search, video plays and file downloads, switched on with one setting.","**Recommended events**: names Google defines for common actions, such as generate_lead, add_to_cart, begin_checkout and purchase.","**Custom events**: anything else you define."]},
   "Events that matter most to the business are marked as **key events** (Google renamed “conversions” to key events in 2024). GA4 also groups activity into **users** (people, or more precisely browsers and devices) and **sessions** (visits)."]],
  ["UTM parameters and channel groups",[
   "When someone arrives from an ad, email or social post, GA4 needs to know where they came from. **UTM parameters** are tags added to the end of a link that tell it.",
   {c:"https://example.com/sale?utm_source=facebook&utm_medium=paid_social&utm_campaign=november_sale\n\nutm_source    where:  facebook, google, newsletter\nutm_medium    type:   paid_social, cpc, email\nutm_campaign  which:  november_sale"},
   "GA4 then sorts traffic into **default channel groups** such as Organic Search, Paid Search, Organic Social, Paid Social, Email, Referral and Direct, based on these values. Consistent lowercase naming matters: “Facebook” and “facebook” appear as two separate sources.",
   {m:"Adding UTM tags to links within your own website. It overwrites the visitor's real original source and corrupts your reports."}]],
  ["Consent, privacy and server-side tracking",[
   "Privacy laws require websites to ask permission before some tracking, which is why many sites show cookie banners. Google's **Consent Mode v2** passes visitors' choices to Google tags, including whether data may be used for advertising (ad_user_data, ad_personalization). It has been required for traffic from the European Economic Area since March 2024.",
   "Because browsers, ad blockers and phones block more browser-based tracking, many businesses add **server-side tracking**: their own server sends key events directly to platforms (for example Meta's Conversions API, Day 8). Platforms also use statistical **modelling** to estimate conversions they can't observe directly."]]],
 live:[
  {t:"Find the tracking on a real website",url:"https://www.daraz.lk/",mins:12,steps:["Open a large e-commerce site such as daraz.lk on a computer.","Right-click → View page source. Press Ctrl+F (Cmd+F on Mac) and search for “GTM-” and “gtag”. A GTM container ID looks like GTM-XXXXXXX.","Back on the page, press F12 to open Developer Tools, go to the Console tab, type dataLayer and press Enter. Expand the list to see the events the site has pushed."],notice:"Real sites push events and details into the data layer for their tags to use. Some sites name things differently or hide it, so try two or three sites."},
  {t:"Watch tags fire with Tag Assistant",url:L.tagasst,mins:10,steps:["Open Google Tag Assistant (free) and click Add domain. Enter a website that uses Google tags.","A new window opens the site. Click around, then return to the Tag Assistant tab.","Look at the list of tags that fired and the events sent (such as page_view)."],notice:"This is the same tool professionals use to test tracking before launching campaigns."},
  {t:"Explore real data in the GA4 demo account",url:L.gademo,mins:12,steps:["Open the demo account (Google Merchandise Store, GA4).","Go to Reports → Realtime to see visitors on Google's store right now.","Go to Reports → Engagement → Events. Find page_view, view_item, add_to_cart and purchase.","Go to Reports → Acquisition → Traffic acquisition and see sessions by channel group."],notice:"This is Google's real shop data, the same reports you would read at a job."}],
 recap:["Tracking connects ads to results and lets platforms optimise.","Cookies remember visitors; pixels and tags send events to platforms.","GTM manages tags with tags, triggers and variables; the data layer passes details to it.","GA4 records everything as events; important ones are key events.","UTMs tell GA4 where visitors came from; keep naming consistent."],
 quiz:[["In Google Tag Manager, what decides WHEN a tag fires?",["The trigger","The variable","The container"],0,"Triggers set conditions; variables supply values."],
  ["When did Universal Analytics stop processing data?",["1 July 2023","1 January 2020","It still works"],0,"GA4 replaced it."],
  ["What does GA4 call the events you mark as most important?",["Key events","Goals","Hits"],0,"Google renamed conversions to key events in 2024."],
  ["In a UTM link, what does utm_medium describe?",["The type of channel, such as email or paid_social","The campaign name","The product price"],0,"utm_source is where; utm_medium is the type."],
  ["Why shouldn't you add UTM tags to links within your own site?",["They overwrite visitors' real original source","They slow the site down","Google penalises them"],0,"Internal UTMs corrupt attribution."],
  ["What is the data layer?",["A JavaScript list where a site describes events for GTM","A type of cookie","A Google Ads report"],0,"Tags read details from it."]],
 terms:[["Cookie","A small file a site stores in your browser to remember you."],["Pixel / tag","Code that sends visitor events to a platform."],["Google Tag Manager","A free tool for managing tracking tags."],["Data layer","A JavaScript list that passes event details to GTM."],["GA4","Google Analytics 4, Google's event-based analytics tool."],["Key event","A GA4 event marked as important for the business."],["UTM parameters","Link tags that identify a visitor's source, medium and campaign."],["Consent Mode","Google's way of passing visitors' consent choices to tags."]]},

{n:11,icon:"chart",title:"Analytics, attribution and experiments",why:"Reading data correctly is what turns activity into decisions.",
 intro:["Yesterday you learned how data is collected. Today you learn to read it: which reports answer which questions, how credit is shared between channels, how to prove what truly works, and how to present findings.",
  "The examples use Google's real demo data, published research and one of the most famous A/B tests in history."],
 sections:[
  ["Reading GA4's standard reports",[
   "GA4's reports follow the customer's path. Learn which section answers which question.",
   {l:["**Acquisition**: where do visitors come from? (channels, source/medium, campaigns)","**Engagement**: what do they do? (pages, events, engagement time)","**Monetization**: what do they buy? (revenue, products, purchases)","**Retention**: do they come back?"]},
   "Key metrics: **users** (people, approximately), **sessions** (visits), **engaged sessions** (visits lasting over 10 seconds, with a key event, or with 2+ page views), **engagement rate**, **key events** and **revenue**.",
   "Always compare a number against something: last month, the same month last year, or the target. A number alone means little."]],
  ["Explorations: going deeper",[
   "**Explorations** are GA4's advanced analysis tools for questions the standard reports can't answer.",
   {l:["**Free-form**: build any table or chart from any dimensions and metrics.","**Funnel exploration**: shows how many people complete each step (for example view product → add to cart → checkout → purchase) and where they drop off.","**Path exploration**: shows what people do before or after a chosen event.","**Cohort exploration**: groups users by when they first arrived and shows how many come back in later weeks.","**Segment overlap**: compares groups, such as mobile users who also bought."]},
   "By default GA4 keeps detailed user-level data for explorations for only **2 months**. Analysts change this to **14 months** in Admin → Data retention on the first day of setting up a property."]],
  ["Attribution models",[
   "A customer might see a Facebook ad, search the brand on Google a week later, read an email, then click a Google ad and buy. Which channel gets the credit? **Attribution models** are the rules that decide.",
   {l:["**Last click**: all credit to the final click before purchase.","**First click**: all credit to the first touch.","**Linear**: equal credit to every touchpoint.","**Time decay**: more credit to touches closer to the purchase.","**Position-based**: 40% to the first touch, 40% to the last, 20% spread across the middle.","**Data-driven**: a model trained on the account's own conversion paths decides."]},
   "In 2023 Google removed first click, linear, time decay and position-based from GA4 and Google Ads. They now offer **data-driven** and **last click**. The older models are still useful for understanding each channel's role, as the comparison below shows.",
   {w:"attrib"}]],
  ["Incrementality and marketing mix modelling",[
   "Attribution only shares credit among tracked clicks. It can't tell you whether a sale would have happened without the ad. Three real cases from this course show why that matters: **eBay** found its brand search ads added no measurable short-term sales; **Uber** turned off about US$100 million of ads with no change in installs; **Airbnb** kept about 95% of traffic after cutting most paid marketing.",
   {l:["**Incrementality tests** compare a group that sees ads with a similar group that doesn't, for example by switching ads off in some regions (a geo holdout) or using platforms' conversion lift studies.","**Marketing mix modelling (MMM)** uses statistics on several years of weekly sales and spend data to estimate each channel's effect, including offline factors such as seasons and prices. Google's open-source **Meridian** and Meta's open-source **Robyn** are free MMM tools."]}]],
  ["A/B testing and conversion rate optimisation",[
   "An **A/B test** shows two versions of something (a page, a headline, an email) to randomly split groups of people, then compares results. Because the only difference is the change being tested, the test shows cause and effect.",
   {x:["Real world: Obama's 2008 campaign","In December 2007, Barack Obama's campaign tested its website sign-up page: 4 button texts × 6 images and videos = 24 combinations. The winning combination, a “Learn More” button with a family photo, converted 11.6% of visitors versus 8.26% for the original, a 40.6% improvement. The team estimated it brought about 2.88 million extra email sign-ups and roughly US$60 million in extra donations."]},
   "Rules for valid tests: decide the sample size **before** starting, run for whole weeks, don't stop early when one version looks ahead (random swings look like wins), and call a winner only at about **95% confidence**. Small sites should test big changes, because small differences need very large traffic to detect.",
   {w:"ab"}]],
  ["Dashboards and writing insights",[
   "**Looker Studio** is Google's free dashboard tool. It connects to GA4, Google Ads, Search Console and Google Sheets, so all key numbers can be seen on one page that updates automatically.",
   "A good dashboard starts with a summary (key numbers against targets), then shows channels, then funnels. But numbers aren't insights. Every insight should answer four questions:",
   {s:["**What happened?** (number versus target or last period)","**Why?** (the cause you found in the data)","**So what?** (impact on the business)","**Now what?** (the action, who will do it, by when)"]}]]],
 live:[
  {t:"Build a funnel with Google's real store data",url:L.gademo,mins:15,steps:["Open the GA4 demo account (Google Merchandise Store). Go to Explore → Funnel exploration.","Set the steps to view_item → add_to_cart → begin_checkout → purchase (the template may already show a similar funnel).","Find the biggest drop-off between steps. Change the breakdown to Device category: is the drop worse on mobile?"],notice:"Finding the biggest drop-off tells a team exactly where to focus improvement work."},
  {t:"Look at professional dashboards",url:L.looker,mins:8,steps:["Open the Looker Studio template gallery.","Open a Google Analytics or marketing template and look at how the page is organised: summary first, then detail.","Change the date range control and watch every chart update."],notice:"Good dashboards answer the most important question at the top."},
  {t:"Read the Obama A/B test story",url:L.obama,mins:8,steps:["Read the article and look at the images of the variations tested.","Note why the team was surprised: the videos they expected to win performed worse than a simple photo."],notice:"Tests beat opinions; even experts guess wrong."}],
 recap:["Acquisition, Engagement, Monetization, Retention: each answers one question.","Explorations (funnel, path, cohort) find where and why people drop off; set retention to 14 months.","GA4 now offers data-driven and last-click attribution; other models help you think.","Incrementality tests and MMM measure what marketing truly causes.","A/B tests need a planned sample size and about 95% confidence; insights answer what, why, so what, now what."],
 quiz:[["Which GA4 report section shows where visitors come from?",["Acquisition","Monetization","Retention"],0,"Acquisition covers channels, sources and campaigns."],
  ["Which exploration shows where people drop out between steps?",["Funnel exploration","Cohort exploration","Free-form"],0,"It shows completion and drop-off for each step."],
  ["Which attribution models do GA4 and Google Ads now offer?",["Data-driven and last click","Only linear","All six rule-based models"],0,"Google removed the other rule-based models in 2023."],
  ["What was the improvement in Obama's 2008 sign-up test?",["40.6%","4%","400%"],0,"11.6% versus 8.26%."],
  ["What measures what ads truly caused?",["Incrementality tests with a control group","Last-click reports","Follower growth"],0,"A control group shows what would have happened without ads."],
  ["Why not stop an A/B test as soon as B looks better?",["Early random swings often look like wins","It costs extra","Google forbids it"],0,"Commit to the planned sample size."]],
 terms:[["Engaged session","A visit over 10 seconds, with a key event, or with 2+ page views."],["Exploration","GA4's advanced analysis workspace."],["Attribution model","Rules for sharing conversion credit between touchpoints."],["Data-driven attribution","Credit assigned by a model trained on your data."],["Incrementality test","An experiment comparing exposed and unexposed groups."],["MMM","Marketing mix modelling: statistical estimates of channel impact."],["A/B test","A randomised comparison of two versions."],["Looker Studio","Google's free dashboard tool."]]},

{n:12,icon:"mail",title:"Email, CRM and marketing automation",why:"Keeping customers is cheaper than finding new ones.",
 intro:["Most of this course has been about reaching new people. Today is about keeping them: the channels you own (email, WhatsApp, app notifications), the systems that store customer information (CRM), and automation that sends the right message at the right time.",
  "You'll see real examples from companies whose messages you may already receive, and you'll learn to check the technical security of real emails in your own inbox."],
 sections:[
  ["Why owned channels matter",[
   "Social media reach can drop overnight when an algorithm changes, and ad costs rise every season. An email list or WhatsApp list belongs to the business: no algorithm decides whether subscribers see a message, and each message costs almost nothing to send.",
   "Retention is also where much of the profit is. A returning customer doesn't need to be won again, already trusts the brand and often spends more. That's why LTV (Day 3) improves when retention improves."]],
  ["CRM and the customer lifecycle",[
   "A **CRM** (customer relationship management system) stores every contact and their history: what they bought, which emails they opened, what they asked support. Examples include HubSpot (which has a free CRM), Salesforce and Zoho.",
   "Contacts move through **lifecycle stages**, for example in HubSpot:",
   {s:["**Subscriber**: joined the list.","**Lead**: showed interest, such as downloading a guide.","**MQL** (marketing-qualified lead): fits the target and is engaged enough for sales.","**SQL** (sales-qualified lead): sales has accepted and is working on it.","**Opportunity**, then **Customer**, then **Evangelist** (recommends you)."]},
   "**Lead scoring** gives points for fit (right location, budget) and behaviour (visited the pricing page, opened emails) so sales teams know whom to call first."]],
  ["Segmentation and personalisation",[
   "Sending the same message to everyone is easy but weak. **Segmentation** splits contacts into groups that should receive different messages.",
   {l:["**Behaviour**: what they browsed, bought or clicked.","**Lifecycle stage**: new subscriber versus loyal customer.","**RFM**: Recency (how recently they bought), Frequency (how often) and Monetary value (how much). Recent, frequent, high spenders are your best customers; customers who used to buy often but stopped are win-back targets."]},
   {x:["Real world: Amazon and Grammarly","Amazon's emails and pages recommend products based on what you browsed and bought (“Customers who bought this also bought…”). Grammarly sends users a weekly report of their own writing statistics. Both make each message personal to the reader, using data the company already has, which is why people open them."]}]],
  ["Automation flows",[
   "Automation sends messages when a customer does something (or stops doing something), without anyone pressing send. Every flow follows the same shape: **trigger → wait → condition → action**.",
   {l:["**Welcome series**: introduces the brand to new subscribers and delivers any promised offer.","**Abandoned cart**: reminds people who added items but didn't buy, often within hours.","**Post-purchase**: delivery updates, how-to tips, a review request, then related products.","**Win-back**: reaches customers who haven't bought for a set time.","**Birthday or anniversary**: a personal message, often with a small gift."]},
   {x:["Real world: Duolingo's reminders","Duolingo sends reminders when a user is about to lose their learning “streak”, and is famous for slightly guilt-tripping messages from its owl. If users ignore them for a while, a message may say the reminders don't seem to be working and that it will stop sending them for now, which often brings people back. The brand's voice (Day 4) runs through its automated messages too."]}]],
  ["Deliverability: reaching the inbox",[
   "An email that lands in spam earns nothing. Inbox providers check whether a sender is genuine using three DNS records on the sender's domain:",
   {l:["**SPF**: a list of servers allowed to send email for the domain (like a guest list).","**DKIM**: a digital signature proving the email wasn't changed on the way (like a tamper seal).","**DMARC**: tells inboxes what to do if SPF or DKIM fail (monitor, send to spam or reject), and sends reports to the domain owner."]},
   "Since February 2024, Gmail and Yahoo require bulk senders (for Gmail, those sending about 5,000 or more messages a day) to authenticate with SPF, DKIM and DMARC, offer **one-click unsubscribe**, and keep spam complaint rates below **0.3%**. Sending only to people who opted in, and removing inactive contacts, keeps a sender's reputation healthy.",
   {m:"Buying email lists. The people never agreed to hear from you, complaints rise, and the domain's reputation can be damaged for everyone in the business. It also breaks data protection laws."}]],
  ["WhatsApp and messaging",[
   "In Sri Lanka, many customers would rather message a business on WhatsApp than fill in a form.",
   {l:["**WhatsApp Business app** (free): business profile, product catalogue, quick replies, labels, greeting and away messages. Suits small businesses.","**WhatsApp Business Platform** (the API, paid per message): automation, chatbots and many agents using one number, through providers such as Twilio or Meta's own cloud API.","**Click-to-WhatsApp ads**: Meta ads with a button that opens a WhatsApp chat with the business, popular for businesses that close sales in conversation."]},
   "Messaging rules are strict: businesses need customers' permission (opt-in) to send promotional messages, and the Platform requires pre-approved message templates for messages sent outside an active conversation."]]],
 live:[
  {t:"Check the security of a real marketing email",url:"https://mail.google.com/",mins:10,steps:["Open Gmail and find a newsletter or promotional email from a large brand.","Click the three-dot menu (⋮) next to Reply and choose “Show original”.","At the top, look for SPF, DKIM and DMARC. Each should say PASS. Scroll down to find the List-Unsubscribe header."],notice:"Every professional sender passes these checks; it's what keeps their emails out of spam."},
  {t:"Browse real automated emails",url:L.rge,mins:12,steps:["Open Really Good Emails, a free gallery of real emails from real brands.","Browse the categories for welcome emails and abandoned cart emails. Open 3 of each.","For each, note the subject line, the single main CTA and how it is personalised."],notice:"Great lifecycle emails are short, personal and have one clear next step."},
  {t:"Watch a real welcome series",url:L.gsearch("newsletter sign up"),mins:5,steps:["Sign up to the newsletter of a brand you genuinely like (any brand, any country).","Over the next week, note each email you get: timing, subject line, content and offer. This shows you a real automation flow from the inside."],notice:"Studying real flows as a subscriber is how many email marketers learn."}],
 recap:["Owned channels are cheap, reliable and drive retention and LTV.","A CRM stores contacts and their lifecycle stage; lead scoring prioritises them.","Segment by behaviour, lifecycle and RFM; personalise using data you already have.","Automation flows follow trigger → wait → condition → action.","SPF, DKIM and DMARC plus permission-based lists keep emails out of spam."],
 quiz:[["Why are email and WhatsApp lists valuable?",["The business owns them and no algorithm limits who sees messages","They are always free of rules","They replace the need for a website"],0,"They're owned media."],
  ["What does an MQL stand for?",["Marketing-qualified lead","Main quality list","Monthly query log"],0,"An engaged lead that fits the target."],
  ["What does RFM measure?",["Recency, frequency and monetary value of purchases","Reach, followers and mentions","Revenue, fees and margin"],0,"It ranks customers by buying behaviour."],
  ["What triggers an abandoned cart flow?",["Items added to the cart without a purchase","A new subscriber","A product review"],0,"It reminds shoppers who were close to buying."],
  ["What spam complaint rate must Gmail and Yahoo bulk senders stay under?",["0.3%","10%","There is no limit"],0,"Since February 2024."],
  ["Which record acts like a tamper seal on email?",["DKIM","SPF","MX"],0,"It's a digital signature."]],
 terms:[["CRM","Customer relationship management system."],["Lifecycle stage","Where a contact is in the journey, from subscriber to evangelist."],["Lead scoring","Points for fit and behaviour to prioritise leads."],["RFM","Recency, frequency, monetary segmentation."],["Automation flow","Messages triggered by customer behaviour."],["SPF","DNS record listing servers allowed to send a domain's email."],["DKIM","Signature proving an email wasn't altered."],["DMARC","Policy telling inboxes how to handle failed checks."]]},

{n:13,icon:"search",title:"SEO essentials",why:"Free search traffic compounds over years once you understand how it works.",
 intro:["SEO (search engine optimisation) is how a website earns free visits from Google and other search engines. It's slower than ads but keeps working without paying for every click.",
  "This is an introduction to the essentials, so you understand how search works and can talk to specialists. After the bootcamp you can study it in more depth with the free courses listed in “After Day 14”."],
 sections:[
  ["How search engines work",[
   "Google's job is to show the most useful result for every search. It does that in three steps.",
   {s:["**Crawling**: Google's software (Googlebot) follows links and sitemaps to discover pages.","**Indexing**: it reads and stores each page so it can be found later. Not every page gets indexed.","**Ranking**: for each search, it orders indexed pages by how relevant and useful they are likely to be, using many signals."]},
   "A problem at any step stops the steps after it: a page Google can't crawl can't be indexed, and a page that isn't indexed can't rank."]],
  ["Search intent and keywords",[
   "Every search has an **intent**, a reason behind it. Google ranks the type of page that best matches that intent.",
   {l:["**Informational**: wants to learn (“how to remove a coffee stain”).","**Navigational**: wants a specific site (“daraz login”).","**Commercial**: comparing before buying (“best phones under 100,000”).","**Transactional**: ready to act (“buy iPhone 16 colombo”)."]},
   "Search results pages (SERPs) now include much more than ten blue links: ads, Shopping results, maps with local businesses, videos, “People also ask” boxes and, since 2024, **AI Overviews** (AI-written summaries at the top for some searches). Many searches end without a click because the answer appears on the page. SEO today means appearing in these features as well as in the classic results."]],
  ["On-page SEO",[
   "On-page SEO is making each page clearly answer the search it targets.",
   {l:["**Title tag**: the clickable blue headline in results; about 50–60 characters, with the main keyword near the start.","**Meta description**: the text under it; about 150–160 characters, giving a reason to click. Google may rewrite it.","**Headings**: one main heading (H1) and clear subheadings (H2) that follow the reader's questions.","**Content quality**: answer the question fully and early, with original information, examples, photos and expertise.","**Internal links**: link related pages on the same site with descriptive words.","**Images**: descriptive file names and alt text, compressed so pages load fast."]},
   {m:"Repeating the keyword over and over (keyword stuffing). Google understands meaning and synonyms; repetition makes pages worse to read and can hurt rankings."}]],
  ["Technical SEO basics",[
   {l:["**Mobile-first**: Google mainly uses the mobile version of a site for indexing and ranking.","**Speed and Core Web Vitals**: LCP (main content loads within 2.5 seconds), INP (responds to taps within 200 milliseconds), CLS (layout shift below 0.1).","**HTTPS**: a secure connection is expected.","**XML sitemap**: a file listing the pages you want indexed.","**robots.txt**: tells crawlers which areas not to crawl.","**Canonical tags**: tell Google which version of duplicate pages is the main one.","**Structured data**: code (usually JSON-LD) describing things like products, recipes, events and businesses, which can earn rich results such as star ratings."]},
   "**Google Search Console** is the free tool that shows which searches a site appears for, which pages are indexed, and any technical problems."]],
  ["Authority: links and trust",[
   "Google also judges whether a page and site are trustworthy. Links from other reputable sites (**backlinks**) act like recommendations. Google's quality guidelines describe **E-E-A-T**: Experience, Expertise, Authoritativeness and Trustworthiness.",
   {x:["Real world: how big sites win search","Wikipedia ranks for millions of topics because of strong internal linking between articles, huge numbers of backlinks and constantly updated content. Zapier built thousands of pages for specific app combinations (such as one app connected to another), each answering a precise search. HubSpot's free marketing articles and templates earn links from other sites because they're genuinely useful."]},
   {m:"Buying links or swapping links in bulk. Google treats manipulative links as spam and can ignore them or penalise the site."}]],
  ["Local SEO",[
   "For shops, restaurants, clinics and services, the most valuable search results are often the **map results** (the local pack). Google says local rankings depend mainly on **relevance** (how well the listing matches the search), **distance** (how far the business is from the searcher or the searched location) and **prominence** (how well known it is, including reviews and links).",
   {l:["A complete **Google Business Profile**: correct category, hours, photos, services, website and phone.","Many genuine **reviews**, with replies from the owner.","Consistent **NAP** (name, address, phone) everywhere online."]},
   {x:["Real world: try it yourself","Search “restaurants in Colombo” on Google Maps. The places at the top usually have complete profiles, many recent reviews, lots of photos and owners who reply. These are the visible signals of local SEO."]}]]],
 live:[
  {t:"Read a search results page like an SEO",url:L.gsearch("best phones under 100000 sri lanka"),mins:10,steps:["Open the search. List every feature on the page: ads, AI Overview, videos, “People also ask”, Shopping, organic results.","Click into the first two organic results. What kind of page are they: a comparison article, a shop category, a video?","Try an informational search (for example “how to make kottu roti”) and compare which features appear."],notice:"Intent decides the format. To rank, a page must match the format Google already rewards."},
  {t:"See a real page's title and description",url:L.gsearch("site:wikipedia.org digital marketing"),mins:8,steps:["Open the Wikipedia result for digital marketing.","Right-click → View page source. Search (Ctrl+F) for <title> and for description.","Compare them with how the result appeared in Google."],notice:"Titles and descriptions are written for searchers, not just for the page."},
  {t:"Test structured data on a real recipe page",url:L.rrt,mins:8,steps:["Search Google for any recipe and copy the address of a recipe page that shows star ratings or cooking time in the results.","Paste it into Google's Rich Results Test and run it.","Look at the detected items (Recipe, Review). That code is why the result shows extra details."],notice:"Structured data turns plain results into richer, more clickable ones."},
  {t:"Study a top local business profile",url:L.gmaps,mins:6,steps:["Open the Google Maps search for restaurants in Colombo.","Open the top 3 results. Compare number of reviews, photos, categories and whether the owner replies to reviews."],notice:"Local rankings reward complete, active, well-reviewed profiles."}],
 recap:["Search works in three steps: crawl, index, rank.","Match the page to the search intent and the format Google already shows.","On-page: clear title, description, headings and genuinely useful content.","Technical: mobile-first, fast, secure, sitemap, canonicals, structured data.","Authority comes from trusted links and E-E-A-T; local SEO from relevance, distance and prominence."],
 quiz:[["What are the three steps Google uses?",["Crawl, index, rank","Click, share, buy","Post, boost, report"],0,"A page must be crawled and indexed before it can rank."],
  ["“Best phones under 100,000” has which intent?",["Commercial","Navigational","Informational only"],0,"The searcher is comparing before buying."],
  ["What is a sensible title tag length?",["About 50–60 characters","About 300 characters","About 5 characters"],0,"Longer titles get cut off."],
  ["What does a canonical tag do?",["Names the main version of duplicate pages","Speeds up the page","Adds star ratings"],0,"It consolidates signals onto one URL."],
  ["What are Google's three local ranking factors?",["Relevance, distance and prominence","Likes, shares and comments","CPC, CTR and CPM"],0,"From Google's own help pages."],
  ["What does E-E-A-T stand for?",["Experience, Expertise, Authoritativeness, Trustworthiness","Email, Engagement, Ads, Traffic","Easy, Effective, Accurate, Timely"],0,"Signals of quality and trust."]],
 terms:[["SEO","Search engine optimisation: earning free visits from search."],["Crawling","Search engines discovering pages."],["Indexing","Storing pages so they can appear in results."],["Search intent","The reason behind a search."],["Title tag","The headline shown in search results."],["Backlink","A link from another site to yours."],["E-E-A-T","Experience, Expertise, Authoritativeness, Trustworthiness."],["Local pack","The map results for local searches."]]},

{n:14,icon:"target",title:"Putting it together: strategy, budgets and your career",why:"Bring every part together the way a digital marketing manager does.",
 intro:["You now understand each part of digital marketing. Today shows how professionals combine them into one plan: choosing channels for each stage of the funnel, setting and forecasting budgets, reporting, using AI responsibly, and staying within the law.",
  "It ends with the career side: the roles available, what employers ask for, and how to keep learning for free."],
 sections:[
  ["The integrated marketing plan",[
   "A marketing plan ties everything you've learned into one document. Most professional plans contain the same parts:",
   {s:["**Situation**: the market, customers, competitors and current results (Days 1–3).","**Objectives**: the business goal, marketing objectives and KPIs (Days 2–3).","**Audience and positioning**: who you're targeting and the one idea you want to own (Day 2).","**Channel plan by funnel stage**: which channels create demand, which capture it and which keep customers (Days 4–13).","**Budget and forecast**: how much, where, and what results to expect.","**Measurement**: tracking, dashboards and how success will be judged (Days 10–11).","**Timeline and tests**: what launches when, and which experiments will run."]},
   {x:["Real world: Airbnb's full funnel","After 2020 Airbnb described its marketing as a full funnel: public relations and big brand campaigns at the top to build fame, its app and website for owned engagement, and performance marketing used more selectively at the bottom. Each channel had a clear job."]}]],
  ["Setting and splitting the budget",[
   "Businesses often set marketing budgets as a percentage of revenue. It varies widely by industry and growth stage: Airbnb's fell from 23.7% of revenue in 2019 to 14.2% in 2020 (Day 3). Fast-growing startups often spend far more; established businesses with strong brands less.",
   "Two rules of thumb guide how the budget is split:",
   {l:["**Brand and activation**: Binet and Field's average of roughly 60% brand building and 40% sales activation (Day 1), adjusted by category.","**70-20-10 for testing**: about 70% on proven channels and tactics, 20% on promising expansions, 10% on new experiments."]},
   "Professionals also watch **diminishing returns**: the first rupees in a channel are usually the most efficient, and each additional rupee buys a little less. When one channel's cost per result rises sharply as spending grows, money often works harder elsewhere."]],
  ["Forecasting from a target",[
   "Managers plan backwards from a goal using the funnel maths from Day 3, then check the plan is profitable.",
   {c:"Customers needed = Revenue target ÷ AOV\nLeads needed     = Customers ÷ Lead-to-customer rate\nClicks needed    = Leads ÷ Landing page conversion rate\nBudget           = Clicks × CPC\nCheck: planned ROAS (target ÷ budget) vs break-even ROAS (1 ÷ margin)"},
   "Use the forecaster with the illustrative numbers, then change one assumption at a time to see which one moves the budget most. Usually it's the conversion rate.",
   {w:"forecast"}]],
  ["Reporting rhythm",[
   {l:["**Daily**: spend, tracking health and anything broken.","**Weekly**: channel performance, tests and creative fatigue.","**Monthly**: results against targets, insights and budget changes.","**Quarterly**: strategy, positioning and objectives."]},
   "Reports for managers lead with the conclusion, then the evidence, then the recommended action. Use the what / why / so what / now what structure from Day 11."]],
  ["Using AI well and staying within the rules",[
   "AI tools now help with research summaries, ideas, first drafts of copy, image and video creation, data analysis and reports. Ad platforms build AI into targeting, bidding and creative (Advantage+, Performance Max, AI Max).",
   {l:["Give AI clear context: role, audience, goal, constraints and the format you want.","Always check facts, numbers and claims yourself. AI can produce confident but wrong information.","Don't paste customers' personal data into public AI tools.","Edit outputs so they sound like the brand, not like everyone else using the same tool."]},
   "Rules every marketer must follow: platform **advertising policies** (health, finance, misleading claims), **consumer protection** (no fake reviews or false urgency), **disclosure** of paid partnerships, and **data protection** law, in Sri Lanka the Personal Data Protection Act No. 9 of 2022, and GDPR when reaching people in the EU."]],
  ["Your career path",[
   "Common entry routes are digital marketing executive, social media executive, marketing assistant at an agency, or junior paid media or SEO roles. After a year or two, most people specialise: performance marketing, SEO, content, CRM and automation, or analytics.",
   "Employers look for three things: **understanding** (can you explain why, not just how?), **tool familiarity** (Meta Ads Manager, Google Ads, GA4, GTM) and **proof** (certificates and examples of work).",
   "Many marketers aim to be **T-shaped**: broad knowledge across all channels (which this course gives you) and deep expertise in one. The free certificates in “After Day 14” are the next step."]]],
 live:[
  {t:"Read real job ads and map them to this course",url:L.jobs,mins:12,steps:["Open LinkedIn Jobs for digital marketing roles in Sri Lanka.","Read 3 job ads. List the skills and tools each asks for.","Next to each skill, write the day of this course that covers it. Circle any you want to study more deeply."],notice:"Job ads show exactly which skills the market pays for right now."},
  {t:"Hear a CMO explain brand versus performance",url:L.airbnbCmo,mins:10,steps:["Read the interview with Airbnb's chief marketing officer about moving from performance marketing to brand campaigns.","Note how they decide what each channel's job is."],notice:"Senior marketers think in terms of each channel's role in the whole funnel."},
  {t:"Choose your first free certificate",url:L.skillshop,mins:8,steps:["Look at Google Skillshop (Google Ads, Google Analytics) and HubSpot Academy (digital marketing, content, social, email).","Pick the one that matches the role you circled in the job ads, and plan to start it next."],notice:"A free certificate in the skill you want is the quickest proof for employers."}],
 recap:["A marketing plan covers situation, objectives, positioning, channels by stage, budget, measurement and tests.","Budgets are often a percentage of revenue; split by brand versus activation and 70-20-10.","Forecast backwards from the target and check against break-even ROAS.","Use AI for speed, but verify, protect data and keep the brand voice.","Be T-shaped: broad across channels, deep in one specialism."],
 quiz:[["What does a marketing plan's channel section organise channels by?",["Funnel stage","Alphabetical order","Cost only"],0,"Each channel gets a job in the funnel."],
  ["What does 70-20-10 describe?",["70% proven, 20% promising, 10% new experiments","70% Meta, 20% Google, 10% email","70% brand, 20% sales, 10% PR"],0,"It balances reliability with learning."],
  ["Revenue target LKR 1,000,000 at an AOV of LKR 5,000. How many customers are needed?",["200","2,000","20"],0,"1,000,000 ÷ 5,000 = 200."],
  ["What is “diminishing returns” in budgeting?",["Each extra rupee in a channel tends to buy a little less","Returns increase forever","Budgets shrink every year"],0,"That's why money is moved between channels."],
  ["What must you always do with AI-written marketing content?",["Check facts and claims, and edit for brand voice","Publish it unchanged","Never use AI"],0,"You are responsible for accuracy."],
  ["Sri Lanka's data protection law is…",["The Personal Data Protection Act No. 9 of 2022","GDPR only","There is none"],0,"It governs collecting and using personal data."]],
 terms:[["Marketing plan","A document tying objectives, audience, channels, budget and measurement together."],["Diminishing returns","Each extra unit of spend producing less result."],["70-20-10","A budget split between proven, promising and new tactics."],["Forecast","A prediction of results from budget and funnel rates."],["T-shaped marketer","Broad knowledge across channels plus deep expertise in one."]]}
];
