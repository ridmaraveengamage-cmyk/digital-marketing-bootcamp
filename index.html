<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>14-Day Digital Marketing Bootcamp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a reading-first course. Sticky top bar; home with a phase funnel and 14-day map; day pages with a long-form lesson column (≈70ch) and a sticky sidebar holding contents, session progress and the AI teacher. Real-world callouts and live walkthroughs are the visual anchors. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EEE8; --ink:#14201B; --ink-2:#4F5C56; --line:#D3DBD4;
  --accent:#2347EE; --accent-ink:#FFFFFF; --mark:#F4E46C; --code-bg:#1B2621; --code-ink:#E4EDE7;
  --p1:#2347EE; --p2:#0D8A5F; --p3:#CF5520; --p4:#8434CC; --p5:#0B7A8A; --p6:#B42A5E; --p7:#8A6A00; --p8:#3F4A5A;
  --good:#0D8A5F; --warn:#B7791F; --bad:#C2352B; --real:#0D8A5F;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 0 rgba(20,32,27,.04), 0 8px 24px -16px rgba(20,32,27,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2924; --ink:#E7EDE9; --ink-2:#9BA9A2; --line:#2B3732;
    --accent:#7B92FF; --accent-ink:#0B1020; --mark:#6A5D12; --code-bg:#0A0F0D; --code-ink:#DCE6E0;
    --p1:#7B92FF; --p2:#3DC491; --p3:#F08A55; --p4:#BA8BF2; --p5:#4CC3D1; --p6:#F07AA6; --p7:#E0B84A; --p8:#A9B4C4;
    --good:#3DC491; --warn:#E3B04B; --bad:#F2716A; --real:#3DC491;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 28px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2924; --ink:#E7EDE9; --ink-2:#9BA9A2; --line:#2B3732;
  --accent:#7B92FF; --accent-ink:#0B1020; --mark:#6A5D12; --code-bg:#0A0F0D; --code-ink:#DCE6E0;
  --p1:#7B92FF; --p2:#3DC491; --p3:#F08A55; --p4:#BA8BF2; --p5:#4CC3D1; --p6:#F07AA6; --p7:#E0B84A; --p8:#A9B4C4;
  --good:#3DC491; --warn:#E3B04B; --bad:#F2716A; --real:#3DC491;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 28px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
mark{background:linear-gradient(transparent 40%, var(--mark) 40%, var(--mark) 88%, transparent 88%);color:inherit;padding:0 .1em}
b,strong{font-weight:650}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);border-radius:5px;padding:.08em .35em;word-break:break-word}
pre.code{font-family:var(--font-mono);font-size:13px;line-height:1.6;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:14px 16px;margin:0;overflow-x:auto;white-space:pre}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2);font-size:13.5px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill .bar{width:64px;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.pill .bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
@media (max-width:700px){ .pill .bar{display:none} .brand span{display:none} }
main{padding-block:28px 140px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .12s, background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;padding:6px 10px;color:var(--accent)}
.btn.ghost:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ai-only{display:none!important}
body.has-ai .ai-only{display:revert!important}
body.has-ai .no-ai{display:none!important}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:36px}
.hero h1{font-size:clamp(34px,5vw,54px);font-weight:800;letter-spacing:-.025em;margin:10px 0 14px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:17px;color:var(--ink-2);max-width:58ch}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stats{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:24px}
.stat b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
.funnel-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 20px 14px;box-shadow:var(--shadow)}
.funnel-card svg{width:100%;height:auto;display:block}
.funnel-card .cap{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:6px}
@media (max-width:820px){ .hero{grid-template-columns:1fr} }
.sec{margin-top:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:clamp(22px,3vw,28px);font-weight:700}
.sec-head p{color:var(--ink-2);font-size:14px}
.hour{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.hour div{padding:12px 12px 10px;min-width:0;border-right:1px solid var(--line)}
.hour div:last-child{border-right:0}
.hour b{display:block;font-family:var(--font-display);font-size:15px}
.hour span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.hour .m{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.hour .practice{background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
@media (max-width:640px){ .hour{flex-direction:column} .hour div{flex:auto!important;border-right:0;border-bottom:1px solid var(--line)} .hour div:last-child{border-bottom:0} }
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){ .method{grid-template-columns:1fr} }
.method div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.method b{display:block;font-family:var(--font-display);font-size:16px;margin-bottom:4px}
.method span{font-size:14px;color:var(--ink-2)}

.parthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
.parthead:first-of-type{border-top:0;padding-top:0;margin-top:0}
.parthead h3{font-size:20px;font-weight:800}
.parthead p{font-size:14px;color:var(--ink-2);max-width:60ch}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){ .phases{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .phases{grid-template-columns:1fr} }
.phase{--c:var(--p1);background:color-mix(in srgb, var(--c) 7%, var(--surface));border:1px solid color-mix(in srgb, var(--c) 22%, var(--line));border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.phase-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phase-h h3{font-size:16px;color:var(--c)}
.phase-h span{font-size:12px;color:var(--ink-2);font-family:var(--font-mono);white-space:nowrap}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .15s, border-color .15s}
.tile:hover{transform:translateY(-1px);border-color:var(--c)}
.tile .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb, var(--c) 14%, var(--surface));color:var(--c)}
.tile .t{font-weight:600;font-size:14px;line-height:1.3}
.tile .d{font-size:12px;color:var(--ink-2)}
.tile .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.tile.done .st{background:var(--c);border-color:var(--c);color:var(--surface)}
.tile.part .st{border-color:var(--c);background:conic-gradient(var(--c) var(--pct), transparent 0)}
.tile.next{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent)}
.tag-next{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}

.day-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
@media (max-width:1000px){ .day-grid{grid-template-columns:1fr} }
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.crumbs a{color:var(--ink-2);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--ink)}
.day-head{--c:var(--p1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:22px;border-radius:20px;background:color-mix(in srgb, var(--c) 9%, var(--surface));border:1px solid color-mix(in srgb, var(--c) 25%, var(--line))}
.day-num{width:84px;height:84px;border-radius:22px;background:var(--c);color:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.day-num small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.day-num b{display:block;font-family:var(--font-display);font-size:38px;font-weight:800}
.day-head h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:4px 0 6px}
.day-head .goal{color:var(--ink-2)}
.day-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
@media (max-width:520px){ .day-head{grid-template-columns:1fr} .day-num{width:64px;height:64px} .day-num b{font-size:28px} }

.part-h{display:flex;align-items:center;gap:12px;margin:44px 0 6px;flex-wrap:wrap}
.part-h .n{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.part-h h2{font-size:26px;font-weight:800;width:100%}
.reading{max-width:72ch}
.reading p,.reading li{font-size:16.5px;line-height:1.72}
.startbox{margin-top:22px;padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:12px}
.startbox .eyebrow{color:var(--accent)}
.lsec{margin-top:34px;scroll-margin-top:90px}
.lsec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lsec-h .k{font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
.lsec-h h3{font-size:22px;font-weight:700;flex:1;min-width:0}
.lbody{display:grid;gap:14px}
.lbody ol,.lbody ul{margin:0;padding-left:22px;display:grid;gap:8px}
.lbody ol li::marker{font-family:var(--font-mono);font-weight:600;color:var(--ink-2)}
.callout{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.callout .lab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.callout.real{background:color-mix(in srgb, var(--real) 9%, var(--surface));border:1px solid color-mix(in srgb, var(--real) 30%, var(--line))}
.callout.real .lab{color:var(--real)}
.callout.real b.t{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.callout.miss{background:color-mix(in srgb, var(--warn) 10%, var(--surface));border:1px solid color-mix(in srgb, var(--warn) 32%, var(--line))}
.callout.miss .lab{color:var(--warn)}
.callout p{font-size:15.5px!important;line-height:1.65!important}
.explain{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.feedback{margin-top:10px;padding:14px 16px;border-radius:12px;border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));background:color-mix(in srgb, var(--accent) 6%, var(--surface));white-space:pre-wrap;font-size:15px;line-height:1.65}
.feedback:empty{display:none}
.feedback .who{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.recap{margin-top:34px;padding:18px 20px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.recap h3{font-size:18px;margin-bottom:10px}
.recap ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.readbox{margin-top:16px;display:flex;align-items:center;gap:10px;font-weight:600}
.readbox input{width:20px;height:20px;accent-color:var(--good)}

.widget{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;max-width:none}
.widget .wh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.widget .wq{font-weight:600;margin-bottom:12px;font-size:15px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px}
@media (max-width:720px){ .calc{grid-template-columns:1fr} }
.fields{display:grid;gap:10px;align-content:start;min-width:0}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields h4{grid-column:1/-1;margin:6px 0 0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.results{display:grid;gap:10px;align-content:start;min-width:0}
.resgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{padding:12px 14px;border-radius:12px;background:var(--surface-2);min-width:0}
.res span{font-size:12.5px;color:var(--ink-2);display:block}
.res b{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-word}
.res em{font-style:normal;font-size:12.5px;color:var(--ink-2);display:block}
.res.good{background:color-mix(in srgb, var(--good) 13%, var(--surface))}
.res.warn{background:color-mix(in srgb, var(--warn) 15%, var(--surface))}
.res.bad{background:color-mix(in srgb, var(--bad) 12%, var(--surface))}
.diag{list-style:none!important;margin:0;padding:0!important;display:grid;gap:6px;font-size:14px}
.diag li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font-size:14px!important;line-height:1.5!important}
.diag li i{font-style:normal;font-weight:700;font-family:var(--font-mono)}
.diag li.ok i{color:var(--good)} .diag li.no i{color:var(--bad)} .diag li.mid i{color:var(--warn)}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:26px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:flex;align-items:center;height:100%;padding-left:8px;font-style:normal;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--surface);white-space:nowrap;min-width:fit-content;transition:width .3s}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .mini{height:5px;border-radius:4px;background:var(--accent);margin-top:4px;opacity:.75}
tr.you td{background:color-mix(in srgb, var(--accent) 8%, var(--surface))}
.auct input{width:90px}
.sort-row{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.sort-row:first-of-type{border-top:0}
.sort-row .item{font-weight:600;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.opt:hover{border-color:var(--ink-2)}
.opt.right{background:color-mix(in srgb, var(--good) 16%, var(--surface));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb, var(--bad) 13%, var(--surface));border-color:var(--bad);text-decoration:line-through}
.why{font-size:13.5px;color:var(--ink-2)}
.why b{color:var(--good)} .why b.no{color:var(--bad)}
.score{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}

.lives{display:grid;gap:14px;margin-top:16px}
.live{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:grid;gap:10px}
.live.on{border-color:color-mix(in srgb, var(--good) 45%, var(--line));background:color-mix(in srgb, var(--good) 5%, var(--surface))}

const DAYS1=[
{n:1,icon:"compass",title:"How digital marketing works",why:"See the whole map before you study any single part of it.",
 intro:["Marketing is everything a business does so that the right people know it, want it, choose it and come back. Digital marketing is the same job done through screens: search engines, social apps, websites, email and messaging apps.",
  "The big difference from traditional marketing (TV, radio, newspapers, billboards) is **feedback**. Online, almost every view, click and purchase can be counted, often within minutes. Marketers can see what works, stop what doesn't and move money quickly. That is why the job mixes creativity with numbers.",
  "Today you get the whole map. Every later day zooms into one part of it, so don't worry if some words are new. Each one is explained properly later."],
 sections:[
  ["The customer journey and the funnel",[
   "Almost nobody buys the first time they see a brand. People move through stages, and marketers draw those stages as a **funnel**: wide at the top because many people hear about you, narrow at the bottom because only some buy.",
   {s:["**Awareness**: the person learns the brand exists. For example, a Reel from a phone shop appears in their Instagram feed.","**Consideration**: they compare options, read reviews, ask friends, check prices on other sites.","**Conversion**: they act. They buy, book, call or sign up.","**Loyalty**: they buy again and recommend it. A loyal customer brings more profit and costs less to keep."]},
   "Each stage needs a different message. An awareness ad introduces the brand and what it stands for. A consideration ad answers doubts with reviews, comparisons or demonstrations. A conversion ad gives a reason to act now, such as free delivery that ends tonight. A loyalty message thanks the customer and gives them a reason to return.",
   {x:["Real world: Google's “messy middle”","Google's own research team studied how people actually shop and found the path is not a straight line. People loop back and forth between exploring options and evaluating them, across search, YouTube, social media and review sites, many times before buying. Treat the funnel as a map that helps you plan messages, not as a literal path every customer follows."]},
   {m:"Putting all the money into the bottom of the funnel (people ready to buy right now) because it shows quick results. If nobody new hears about the brand, the bottom of the funnel slowly runs dry and costs go up."}]],
  ["Owned, earned and paid media",[
   "Every place a brand appears online falls into one of three groups. Knowing which group you are working in tells you what it costs, how fast it works and how much people trust it.",
   {l:["**Owned media** is what the business controls: its website, app, email list, WhatsApp list and social media profiles. It costs time rather than money, and it keeps working for years.","**Earned media** is attention other people give you for free: customer reviews, shares, news articles, word of mouth, creators who mention you without being paid. It is the most trusted, but you can't control it.","**Paid media** is attention you buy: ads on Google, Facebook, Instagram, TikTok and YouTube, and paid creator posts. It is fast and can scale, but it stops the moment you stop paying."]},
   "Good marketing connects the three. A paid ad brings someone to the website (owned). They join the email list (owned). They have a great experience and leave a review (earned). That review persuades the next person, who may never need to see an ad at all.",
   {x:["Real world: Airbnb, 2020","When travel collapsed in 2020, Airbnb cut its total marketing spend from US$1.14 billion in 2019 to US$482 million in 2020, mostly by cutting paid performance ads. CEO Brian Chesky said the company could “take marketing down to zero and still have 95% of the same traffic as the year before”. In the last quarter of 2020, more than 90% of its traffic was direct or unpaid. Years of brand building, press coverage and an app people already had (owned and earned media) meant most customers came without ads."]}]],
  ["The main channels",[
   "A **channel** is a route by which a business reaches people. You will study each of these in later days; for now, learn what each one is for.",
   {l:["**Search** (Google, YouTube search, Maps): people type what they want. Free results come from SEO (Day 13); paid results are search ads (Day 9).","**Social media** (Facebook, Instagram, TikTok, LinkedIn, YouTube): people scroll for entertainment and connection. Brands post content and run ads (Days 5, 6 and 8).","**Content** (articles, videos, guides, podcasts): useful or entertaining material that earns attention and trust (Day 4).","**Email and messaging** (newsletters, WhatsApp, SMS): direct contact with people who already know you (Day 12).","**Display and video ads**: banners on websites and apps, and video ads on YouTube, mostly for reach and reminders (Day 9).","**Creators and influencers**: people with an audience who recommend products, lending their trust to the brand (Day 5).","**Affiliates**: partners paid a commission for each sale they send."]},
   "Channels split into two families. **Demand capture** channels reach people who already want something, mainly search. **Demand creation** channels show people something they didn't know they wanted, mainly social media and video. Search can only capture demand that already exists, so most growing businesses need both."]],
  ["How the platforms make money",[
   "Google, Facebook, Instagram, TikTok and YouTube are free for users because **advertisers pay**. What these companies sell is attention: billions of people scrolling, watching and searching every day.",
   "Ad space is sold in **auctions** that run in milliseconds. Each time a feed or results page loads, the platform decides which ad to show by comparing what each advertiser is willing to pay with how relevant and useful each ad is likely to be for that particular person. Relevance matters because a platform full of annoying ads would lose its users. Day 7 explains the auction in detail.",
   "Platforms also learn from what people search, watch, like and buy. That data lets an advertiser reach, for example, people aged 25–34 in Colombo who are interested in fitness, and it lets the platform's software find likely buyers automatically.",
   {x:["Real world: the value of data","In 2021 Apple let iPhone users block apps from tracking them across other companies' apps and websites (App Tracking Transparency), and many users chose to block it. Meta said the change would cost it about US$10 billion in revenue in 2022, because its ads became harder to target and measure. That figure shows how much modern advertising depends on data, and why tracking (Day 10) is now a technical skill."]}]],
  ["Brand building and performance marketing",[
   "There are two broad kinds of marketing work, and you need to understand both.",
   {l:["**Performance marketing** aims at an immediate, measurable action: a click, a lead, a sale. Results show within days, so it's easy to prove.","**Brand building** aims to make a brand familiar, trusted and liked, so that people choose it later, often without searching or comparing. Results build slowly over months and years, so it's harder to measure."]},
   "Because performance is easy to measure, many companies put almost everything into it. Research suggests that is a mistake over the long term. Les Binet and Peter Field studied hundreds of advertising effectiveness cases for the UK's Institute of Practitioners in Advertising (published as **The Long and the Short of It**, 2013). They found that, on average, the most effective balance was roughly **60% brand building and 40% sales activation**, with variation by category.",
   {x:["Real world: Airbnb's shift to brand","After cutting paid performance ads in 2020, Airbnb said it would not go back to its old spending levels. In early 2021 it launched “Made possible by hosts”, its biggest brand campaign in five years. Its leaders said they now see public relations at the top of the funnel and brand marketing next, with performance ads as one lever among several rather than the main engine."]},
   {m:"Judging every activity by short-term sales. A brand video may not produce sales this week, yet it makes every future search ad and social ad work better because people already recognise the brand."}]],
  ["Who does what in the industry",[
   "Digital marketing is a team sport. Knowing the roles helps you understand job advertisements and choose a direction later.",
   {l:["**Digital marketing executive**: a generalist who runs social, email, basic ads and reporting. Common first job.","**Social media manager**: plans content, manages communities and works with creators.","**Content creator or copywriter**: writes and produces posts, videos, articles and ads.","**Performance marketer** (paid media specialist): runs Meta, Google and TikTok ads and manages budgets.","**SEO specialist**: improves free search visibility.","**Email or CRM specialist**: manages customer lists, automation and retention.","**Marketing analyst**: tracking, dashboards and insights.","**Digital marketing manager**: sets strategy and budget and leads the team."]},
   "People work **in-house** (inside one company's marketing team), at an **agency** (serving many client companies) or as **freelancers**. Agencies teach quickly because you see many businesses; in-house roles teach depth in one business."]]],
 live:[
  {t:"See what a real brand is advertising today",url:L.adlibDaraz,mins:10,steps:["Open the link. It shows ads currently running in Sri Lanka that match “Daraz”, from Meta's public Ad Library.","Open 3 different ads. For each, note the “Started running on” date, the platforms it runs on (Facebook, Instagram, Messenger) and whether it says it has multiple versions.","For each ad, decide which funnel stage it targets: is it introducing the brand, helping people compare, or pushing an immediate sale with a discount or deadline?"],notice:"Large brands run many ads at once, each aimed at a different stage of the funnel and a different audience."},
  {t:"The same kind of brand on Google",url:L.adstr,mins:10,steps:["Open the Google Ads Transparency Center (Sri Lanka region selected).","Search for a large Sri Lankan advertiser, for example Dialog, Keells or Daraz.","Switch between the formats: text (search ads), image and video (YouTube). Compare the messages with what you saw on Meta."],notice:"Search ads are short and answer a need someone already has; social and video ads tell a story to people who were not looking."},
  {t:"Read how Airbnb rethought its marketing",url:L.airbnb,mins:10,steps:["Read the article about Airbnb's 2020 decision.","Find three numbers: 2019 marketing spend, 2020 marketing spend, and the share of traffic that was direct or unpaid.","Ask yourself: what had Airbnb built over the years that let it cut paid ads without losing most of its customers?"],notice:"Owned and earned media are slow to build but make a business far less dependent on paying for every visitor."}],
 recap:["The funnel (awareness, consideration, conversion, loyalty) helps you match messages to where people are.","Owned media you control, earned media others give you, paid media you buy. Strong brands connect all three.","Search captures existing demand; social and video create new demand.","Platforms sell attention through auctions and use data to target ads.","Effective marketing balances brand building with performance marketing, roughly 60/40 on average."],
 quiz:[["What is the usual order of the marketing funnel?",["Awareness, consideration, conversion, loyalty","Conversion, awareness, loyalty, consideration","Consideration, awareness, conversion, loyalty"],0,"People discover a brand, compare it, buy, then (ideally) come back."],
  ["A customer's 5-star Google review is which kind of media?",["Earned","Owned","Paid"],0,"You didn't create it or pay for it. Someone gave it to you."],

{n:2,icon:"person",title:"How people buy: customers, brands and strategy",why:"Strategy decides who you talk to and what you say. Tools come later.",
 intro:["Before any ad or post, a marketer has to answer three questions: who are we trying to reach, what do we want them to think or do, and why would they choose us over every other option?",
  "Today explains how people actually make buying decisions, which is less logical than most people expect, and how brands use that knowledge to plan a strategy. Every example is a real brand you can look up."],
 sections:[
  ["How people really decide",[
   "Psychologist Daniel Kahneman described two modes of thinking. **System 1** is fast, automatic and emotional: you recognise a face or pick your usual soap without thinking. **System 2** is slow and deliberate: you compare two laptops' specifications line by line.",
   "Most everyday purchases (food, toiletries, mobile data, snacks, clothing) are made mostly with System 1. People don't research; they pick what feels familiar, easy and trustworthy at that moment. Even big purchases usually start with a shortlist of brands people already know.",
   "This has a big implication for marketers: being **easy to remember and easy to find** often matters more than having the cleverest argument. A brand that comes to mind first, at the moment someone needs the category, wins far more often.",
   {x:["Real world: why famous brands keep advertising","Almost everyone already knows Coca-Cola, yet it keeps advertising year after year. The goal isn't to explain what Coke is; it's to stay the first drink that comes to mind when someone is thirsty, celebrating or eating out. Stop reminding people, and competitors fill that space in their memory."]}]],
  ["Mental and physical availability",[
   "Professor Byron Sharp and the Ehrenberg-Bass Institute studied buying data across many categories and countries and published their findings in **How Brands Grow** (2010). Two ideas from that work are now used by marketers everywhere.",
   {l:["**Mental availability**: how easily your brand comes to mind in buying situations. These situations are called **category entry points**, for example “something quick for dinner”, “a gift for my mother”, “my phone screen cracked”. A brand linked to more entry points gets chosen more often.","**Physical availability**: how easy the brand is to find and buy: in shops, on Daraz, on delivery apps, on Google Maps, with a working website and simple payment."]},
   "Their research also found that most of a brand's sales come from a large number of **light buyers** who buy occasionally, not from a small group of loyal fans. So growth usually comes from reaching more people, not only from talking to existing customers.",
   "Brands build mental availability with **distinctive assets**: colours, logos, characters, sounds and slogans that people instantly link to the brand.",
   {x:["Real world: distinctive assets","Duolingo's green owl, McDonald's golden arches and Coca-Cola's red and white script are recognised even without the brand name. Duolingo's owl appears in its app, notifications, TikToks and merchandise, so every appearance strengthens the same memory."]},
   {m:"Changing colours, logo and style every few months to look fresh. Each change throws away memory structures customers have built and makes the brand harder to recognise."}]],
  ["Segmentation, targeting and positioning",[
   "**STP** is the classic process for choosing who to serve and how to be seen.",
   {s:["**Segment**: divide the market into groups with similar needs or behaviour. You can segment by demographics (age, income), geography (Colombo vs rural areas), behaviour (first-time vs repeat buyers) or needs (price-focused vs quality-focused).","**Target**: choose the segment or segments you can serve better and more profitably than competitors.","**Position**: decide the place you want to own in that segment's mind, usually one clear idea."]},
   "A positioning statement puts this into one sentence that guides every ad, post and product decision.",
   {c:"For [target customer] who [need],\n[brand] is the [category] that [key benefit].\nUnlike [main alternative], we [proof]."},
   {x:["Real world: Volvo and safety","For decades Volvo has positioned itself on one idea: safety. Its engineers introduced the modern three-point seatbelt in 1959 and Volvo opened the patent for other car makers to use. Ask people what Volvo stands for and most will say “safe”. One clear position, repeated consistently for decades, is worth more than ten clever slogans."]},
   {x:["Real world: Dove's Real Beauty","Since 2004 Dove has positioned itself around real, everyday beauty rather than unrealistic ideals. Its 2013 “Real Beauty Sketches” film, where an FBI-trained sketch artist drew women first from their own descriptions and then from strangers' descriptions, became one of the most widely shared video ads of its time. The idea worked because it expressed the brand's position, not just a product feature."]}]],
  ["Value proposition and differentiation",[
   "A **value proposition** is the main reason a customer should choose you. **Differentiation** is how you are meaningfully different from the alternatives, including the option of doing nothing.",
   {l:["**Price**: cheaper for the same quality.","**Quality**: better product or service.","**Convenience**: faster, closer, easier to buy.","**Experience**: friendlier, more enjoyable, more personal.","**Identity**: says something about the buyer (sustainable, premium, local, rebellious)."]},
   {x:["Real world: Dollar Shave Club","In 2012 Dollar Shave Club launched with a low-budget, very funny video from its founder. Its value proposition was simple: good razors delivered to your door for a few dollars a month, instead of paying high prices in shops for features you don't need. The video spread widely and the company reportedly received around 12,000 orders in its first two days. Unilever bought the company in 2016 for about US$1 billion."]},
   {x:["Real world: Apple's “Shot on iPhone”","Since 2015 Apple has run “Shot on iPhone” campaigns using real photos taken by iPhone users on billboards and social media. Instead of claiming “our camera is great”, Apple shows the proof, and every photo was taken by an ordinary customer. Differentiation is more believable when you demonstrate it."]}]],
  ["Strategy versus tactics",[
   "Beginners often jump straight to tactics: “let's post Reels” or “let's run a boost”. Professionals start with strategy, which is a set of choices. Tactics are the actions that carry those choices out.",
   {c:"Business goal → Marketing objective → Strategy → Tactics → KPIs\n\nGoal:      grow revenue 20% this year\nObjective: win 2,000 new customers aged 25–34\nStrategy:  position as the fastest delivery option; focus on\n           Instagram for awareness and Google Search for buyers\nTactics:   Reels showing real delivery times, search ads on\n           “same day delivery” keywords, a first-order offer\nKPIs:      new customers per month, cost per new customer"},
   "When something fails, this chain tells you where to look. If the tactics were done well but sales didn't grow, the strategy may have been wrong (perhaps customers don't care about speed). If the strategy was right but the posts weren't seen, the tactics need work."]],
  ["Researching a market with free tools",[
   "You can learn a lot about any market without paid software. Professionals use these free sources all the time.",
   {l:["**Google Trends**: shows how search interest changes over time and by region. Use it to spot seasons (such as the November–December sale period) and compare brands.","**Meta Ad Library**: every active Facebook and Instagram ad from any advertiser. Ads that have run for months are usually profitable, because few advertisers keep paying for ads that lose money.","**Google Ads Transparency Center**: a brand's Search, YouTube and display ads.","**Reviews** on Google Maps, Daraz and Facebook: customers' complaints about competitors are your opportunities, and their exact words make the best ad copy.","**Communities** such as Facebook groups and Reddit: how people describe their problems in their own language."]},
   {m:"Asking only friends and family what they think. They want to be supportive. Look at what real customers do and say in public instead."}]]],
 live:[
  {t:"Find seasons and compare brands in Google Trends",url:L.trends,mins:10,steps:["Open the link: it compares search interest in Daraz and Kapruka in Sri Lanka over 5 years.","Look for repeating peaks. When do searches rise each year? Hover over the peaks to see the dates.","Change the terms to two brands in a category you know (for example two banks or two telcos) and compare."],notice:"Demand follows seasons, and marketing budgets usually rise just before those peaks."},
  {t:"Compare how two competitors position themselves",url:L.adlib,mins:10,steps:["In Meta Ad Library, set the country to Sri Lanka and search for one brand, then its main competitor (for example two supermarket chains or two telecom companies).","For each brand, read 5 active ads. Are they selling on price, quality, convenience, experience or identity?","Note how long their longest-running ads have been active."],notice:"Competitors often fight for the same position. The brand with one clear, repeated idea is easier to remember."},
  {t:"Watch Dove's Real Beauty Sketches",url:L.ytDove,mins:8,steps:["Watch the 3-minute film.","Ask yourself: which product feature is mentioned? (Almost none.)","Write the positioning idea behind it in one sentence."],notice:"Great brand work expresses what the brand stands for, which makes people remember it when they shop."}],
 recap:["Most buying decisions are fast and habitual, so being easy to remember and find matters enormously.","Mental availability (coming to mind) and physical availability (easy to buy) drive growth.","STP: segment the market, target where you can win, position on one clear idea.","A value proposition is believable when you show proof, like Apple's real iPhone photos.","Strategy is a set of choices; tactics carry them out; KPIs measure them."],
 quiz:[["Which kind of thinking drives most everyday purchases?",["Fast, automatic System 1","Slow, careful System 2","Spreadsheet analysis"],0,"People usually choose what feels familiar and easy."],
  ["What is “mental availability”?",["How easily a brand comes to mind in buying situations","How many products are in stock","How many followers a brand has"],0,"It's about memory at the moment of need."],
  ["What does the P in STP stand for?",["Positioning","Pricing","Promotion"],0,"Segment, target, position."],
  ["What made Apple's “Shot on iPhone” persuasive?",["It showed real customers' photos as proof","It listed camera specifications","It offered a discount"],0,"Proof beats claims."],
  ["Which is a strategy rather than a tactic?",["Positioning as the fastest delivery option for young professionals","Posting a Reel on Friday","Changing a button colour"],0,"Strategy is a choice about who and why; tactics are actions."],
  ["Why study a competitor's ads that have run for months?",["Long-running ads are likely profitable","They were cheap to make","Meta forces them to run"],0,"Advertisers rarely keep paying for ads that lose money."]],
 terms:[["System 1","Fast, automatic, intuitive thinking."],["Mental availability","How easily a brand comes to mind when people need the category."],["Physical availability","How easy a brand is to find and buy."],["Category entry point","A situation or need that triggers a purchase, like “gift for mum”."],["Distinctive assets","Colours, logos, characters or sounds people link to a brand."],["STP","Segmentation, targeting, positioning."],["Value proposition","The main reason a customer should choose you."]]},

{n:3,icon:"calc",title:"Marketing maths: the numbers that matter",why:"Every decision in digital marketing is judged with a handful of formulas.",
 intro:["Digital marketing produces a lot of numbers. Some matter; many are distractions. Today you learn what each important metric means, how to calculate it, and how to tell a business number from a vanity number.",
  "Every formula is worked through step by step. Where the numbers are illustrative they are labelled, and the real examples use published figures from Airbnb, Uber and Google's own demo store."],
 sections:[
  ["Vanity metrics and business metrics",[
   "A **vanity metric** looks good but doesn't tell you whether the business is better off: likes, follower counts, impressions on their own. A **business metric** connects to money or customers: leads, sales, cost per customer, profit.",
   "Vanity metrics aren't useless. Reach and engagement show whether content is being seen and enjoyed. But they're early signals, not results. Always ask: if this number doubled, would the business earn more?",
   {x:["Real world: Uber's US$100 million lesson","In 2017 Kevin Frisch, Uber's head of performance marketing, noticed that some reported numbers looked too good. He turned off about US$100 million of Uber's roughly US$150 million yearly spend on rider-acquisition ads, about two-thirds of it. Rider app installs basically didn't change. Fraudulent ad networks had been claiming credit for installs that would have happened anyway. Uber then sued its agency and the agency countersued. The numbers in the dashboard said the ads worked; the real test showed they mostly didn't."]},
   {m:"Trusting a platform's reported results without asking “would this have happened without the ad?” Day 11 covers how professionals answer that question."}]],
  ["Reach, impressions and frequency",[
   "These three describe how many people saw an ad or post, and how often.",
   {l:["**Impressions**: the number of times content was shown. One person seeing it three times counts as three impressions.","**Reach**: the number of different people who saw it at least once.","**Frequency**: the average number of times each person saw it."]},
   {c:"Frequency = Impressions ÷ Reach\n\nIllustrative: 25,000 impressions ÷ 10,000 people = 2.5\n(each person saw the ad 2.5 times on average)"},
   "Some repetition helps people remember. Too much creates **ad fatigue**: people get bored or annoyed, stop responding, and the cost of each result rises. When frequency climbs and results drop, it's usually time for new creative."]],
  ["Clicks, costs and conversions",[
   "These metrics follow a person from seeing an ad to acting on it. Here is one illustrative campaign, worked step by step.",
   {c:"Spend LKR 50,000 · Impressions 100,000 · Clicks 1,000 · Purchases 30\n\nCPM (cost per 1,000 impressions) = 50,000 ÷ 100,000 × 1,000 = LKR 500\nCTR (click-through rate)         = 1,000 ÷ 100,000 × 100   = 1.0%\nCPC (cost per click)             = 50,000 ÷ 1,000          = LKR 50\nCVR (conversion rate)            = 30 ÷ 1,000 × 100        = 3.0%\nCPA (cost per acquisition)       = 50,000 ÷ 30             = LKR 1,667"},
   {l:["**CPM** tells you how expensive it is to be seen. It rises when many advertisers compete for the same audience, for example during the end-of-year sale season.","**CTR** tells you how well the ad grabs attention and makes people curious.","**CPC** combines both: high CPM or low CTR both make clicks expensive.","**CVR** tells you how well the landing page and the offer convince people who arrive.","**CPA** is the cost of each result (a sale, a lead, an app install). It's usually the number a business cares about most."]},
   "Notice how the metrics connect. If you doubled CVR from 3% to 6% with a better landing page, CPA would halve to about LKR 833 without spending more on ads. That's why marketers improve each stage instead of only increasing budget."]],
  ["Revenue, ROAS and profit",[
   "Sales numbers bring money into the picture.",
   {c:"AOV (average order value) = Revenue ÷ Orders\nROAS (return on ad spend)  = Revenue ÷ Ad spend\n\nIllustrative: 30 orders × AOV LKR 5,000 = LKR 150,000 revenue\nROAS = 150,000 ÷ 50,000 = 3.0  (LKR 3 back for every LKR 1 spent)"},
   "A ROAS of 3 sounds profitable, but ROAS ignores the cost of the products. If the **gross margin** (what's left after the cost of goods) is 40%, the 150,000 revenue leaves 60,000 gross profit. Take away the 50,000 ad spend and only 10,000 remains, before staff, rent and delivery.",
   {c:"Break-even ROAS = 1 ÷ Gross margin\n\n40% margin → 1 ÷ 0.40 = 2.5\nBelow ROAS 2.5, each sale loses money on the first order."},
   {m:"Comparing ROAS across businesses with different margins. A ROAS of 2 is a loss for a 30%-margin electronics shop but very profitable for a 70%-margin online course."}]],
  ["Lifetime value and customer acquisition cost",[
   "Many customers buy more than once, so judging marketing only on the first order can be misleading.",
   {l:["**LTV** (customer lifetime value): the gross profit a customer brings over their whole relationship with the business.","**CAC** (customer acquisition cost): total marketing and sales cost divided by the number of new customers won."]},
   {c:"LTV = AOV × Gross margin × Purchases per year × Years as a customer\nCAC = Marketing cost ÷ New customers\n\nIllustrative: AOV 5,000 × 40% × 4 per year × 2 years = LKR 16,000 LTV\nCAC = 200,000 ÷ 50 new customers = LKR 4,000\nLTV : CAC = 16,000 : 4,000 = 4 : 1"},
   "A common rule of thumb is that **LTV : CAC should be at least 3 : 1**, leaving room for other costs and profit. Subscription businesses such as streaming services, gyms and software can pay a lot to win a customer because each customer pays every month for a long time.",
   {w:"unit"}]],
  ["Funnel maths and forecasting",[
   "Because each stage of the funnel has a rate, you can multiply the rates to predict results, or work backwards from a target.",
   {c:"Customers = Impressions × CTR × Conversion rate\n\nIllustrative: 200,000 × 1.2% × 2.5% = 60 customers\n\nWorking backwards for 100 customers at 2.5% conversion:\nClicks needed = 100 ÷ 0.025 = 4,000\nBudget at LKR 40 per click = 4,000 × 40 = LKR 160,000"},
   "This is how marketing budgets are planned in real companies. It also shows where to focus: find the weakest rate in the chain and fix that first, because improving a weak stage usually helps more than buying more traffic."]]],
 live:[
  {t:"Work with Airbnb's real numbers",url:L.airbnb,mins:10,steps:["Read the article and note: marketing spend 2019 US$1.14bn (23.7% of revenue) and 2020 US$482m (14.2% of revenue).","Work out each year's revenue from those figures: revenue = spend ÷ percentage. (2019: 1.14 ÷ 0.237 ≈ US$4.8bn; 2020: 0.482 ÷ 0.142 ≈ US$3.4bn.)","Revenue fell about 30% but marketing fell about 58%. What does that tell you about how much Airbnb's revenue depended on paid marketing?"],notice:"Marketing as a percentage of revenue is one of the first numbers executives look at."},
  {t:"Read the Uber ad fraud story",url:L.uber,mins:10,steps:["Read how Uber discovered the problem.","Find which metric looked healthy in the dashboard and which real-world number didn't move.","Think about how a business could test whether an ad channel truly adds customers."],notice:"Reported numbers can be wrong. Testing by switching spend off (or on) in a controlled way reveals the truth."},
  {t:"Find real e-commerce numbers in Google's demo store",url:L.gademo,mins:12,steps:["Open the help page and use “Access the demo account”. Choose the Google Merchandise Store GA4 property (real data from Google's own online shop).","Go to Reports → Monetization → Ecommerce purchases (or the Monetization overview). Note total revenue and number of purchases for the last 28 days.","Calculate AOV yourself: revenue ÷ purchases. Then check whether the report shows average purchase revenue, and compare."],notice:"Professionals constantly turn raw totals into ratios like AOV, CVR and CPA."}],
 recap:["Ask of every metric: if it doubled, would the business earn more?","Frequency = impressions ÷ reach. Too much frequency causes fatigue.","CTR, CPC, CVR and CPA connect; improving conversion rate lowers CPA without more budget.","ROAS ignores product costs; compare it with break-even ROAS = 1 ÷ margin.","LTV : CAC of 3 : 1 or better is a common healthy target."],
 quiz:[["An ad got 30,000 impressions and reached 12,000 people. What is the frequency?",["2.5","0.4","42,000"],0,"30,000 ÷ 12,000 = 2.5."],
  ["Spend LKR 20,000 for 400 clicks. What is the CPC?",["LKR 50","LKR 8,000","LKR 0.02"],0,"20,000 ÷ 400 = 50."],
  ["Gross margin is 25%. What is the break-even ROAS?",["4.0","2.5","0.25"],0,"1 ÷ 0.25 = 4."],
  ["Conversion rate doubles while CPC stays the same. What happens to CPA?",["It roughly halves","It doubles","It stays the same"],0,"Each click now produces twice as many results."],
  ["What did Uber find when it turned off about US$100 million of ads?",["Rider app installs barely changed","Installs fell by two-thirds","Installs doubled"],0,"Fraudulent networks had claimed credit for organic installs."],
  ["Which is a vanity metric when viewed alone?",["Follower count","Cost per new customer","Profit per order"],0,"Followers don't tell you whether the business earns more."]],
 terms:[["Impressions","Times content was shown, including repeats."],["Reach","Number of different people who saw content."],["Frequency","Impressions ÷ reach."],["CTR","Click-through rate: clicks ÷ impressions."],["CPC","Cost per click: spend ÷ clicks."],["CPM","Cost per 1,000 impressions."],["CVR","Conversion rate: conversions ÷ clicks or visits."],["CPA","Cost per acquisition: spend ÷ conversions."],["ROAS","Return on ad spend: revenue ÷ ad spend."],["LTV","Gross profit a customer brings over their lifetime."],["CAC","Marketing cost ÷ new customers."]]},

{n:4,icon:"pen",title:"Content and copywriting",why:"Words and ideas decide whether anyone stops, reads and acts.",
 intro:["Every ad, post, email and web page is made of words and ideas. Copywriting is writing that makes people take an action. Content marketing is creating material people actually want to watch or read, so they come to trust the brand.",
  "Today you learn how persuasion works and the formulas professionals use, illustrated with famous real campaigns you can watch."],
 sections:[
  ["What content marketing is",[
   "Traditional advertising **interrupts** people: an ad appears in the middle of what they were doing. Content marketing **earns** attention by being useful, entertaining or inspiring enough that people choose to spend time with it.",
   {l:["**Educational**: how-to guides, tutorials, explainers. They build trust and help people find you in search.","**Entertaining**: humour, stories, challenges. They spread on social media.","**Inspirational**: customer stories, behind the scenes, big ideas. They build emotional connection.","**Promotional**: offers and launches. Necessary, but they work best when the other types have built trust first."]},
   {x:["Real world: Red Bull as a media company","In 2012 Red Bull's “Stratos” project live-streamed skydiver Felix Baumgartner jumping from a balloon at the edge of space, watched live by millions around the world. Red Bull also runs magazines, a film studio and sports teams. It sells an energy drink, but its marketing is mostly content that people seek out because it's thrilling."]},
   {x:["Real world: HubSpot's blog","HubSpot sells marketing software, yet it's best known for free articles, templates and courses that teach marketing. People find the content in Google searches, trust the brand and eventually some become customers. The free courses you'll use after this bootcamp are part of that strategy."]}]],
  ["How persuasion works",[
   "Psychologist Robert Cialdini identified principles that make people more likely to say yes. You'll see them in almost every good ad.",
   {l:["**Social proof**: people follow what others do. “10,000 customers”, reviews, ratings, testimonials.","**Scarcity**: things seem more valuable when limited. “Only 3 left”, “Offer ends Sunday”.","**Authority**: people trust experts. Doctors, certifications, awards, “as featured in”.","**Reciprocity**: people want to return a favour. Free samples, free guides, free trials.","**Liking**: people buy from people and brands they like and relate to.","**Commitment and consistency**: a small first step (a free sign-up) makes a bigger step (a purchase) more likely."]},
   {x:["Real world: hotel booking sites","Travel sites such as Booking.com have long shown messages like “Booked 12 times today” (social proof) and “Only 2 rooms left at this price” (scarcity) next to listings. These cues are effective, which is why regulators in some countries have pushed sites to make sure such claims are true."]},
   {m:"Inventing urgency or fake reviews. It may work once, but it destroys trust, can break consumer law, and ad platforms reject or ban misleading ads."}]],
  ["Copywriting formulas",[
   "Formulas aren't rules; they're proven structures that keep writing clear and persuasive. Three are used everywhere.",
   {l:["**AIDA**: Attention (a hook) → Interest (why it matters to them) → Desire (make them want the result) → Action (tell them exactly what to do).","**PAS**: Problem (name a pain the reader feels) → Agitate (make the pain vivid) → Solution (your offer). Excellent for short ads.","**Before–After–Bridge**: show life before (the problem), life after (the result), then the product as the bridge between them."]},
   {x:["Real world: Dollar Shave Club follows PAS","The 2012 launch video names the problem (paying too much for razors with gadgets you don't need), agitates it with jokes about expensive “shave tech”, then delivers the solution: good blades delivered for about a dollar a month. Watch it in today's live section and spot each stage."]}]],
  ["Features, benefits and the value proposition",[
   "A **feature** is what a product has or does. A **benefit** is what the customer gets from it. People buy benefits, so good copy translates every feature into a benefit.",
   {c:"Feature:  5,000 mAh battery\nBenefit:  your phone lasts all day, even with heavy video use\n\nFeature:  delivery riders in every town\nBenefit:  your order arrives the same day"},
   {x:["Real world: “1,000 songs in your pocket”","When Apple launched the first iPod in 2001, the specification was a 5 GB hard drive. Apple's message was “1,000 songs in your pocket”. Nobody needed to understand gigabytes to understand the benefit, and that line is still used as a textbook example of turning a feature into a benefit."]},
   "Use the “so what?” test. Read each sentence of your copy and ask “so what?” as the customer would. Keep asking until the answer is something the customer actually cares about."]],
  ["Headlines, hooks and calls to action",[
   "Most people read only the headline or the first line. If that fails, nothing else gets read. Strong headlines are usually specific and about the reader.",
   {l:["**Specific numbers**: “Save 3 hours a week on accounts” beats “Save time”.","**Direct benefit**: “Clear skin in 30 days”.","**Curiosity**: “The mistake most new shop owners make with Facebook ads”.","**Call out the audience**: “Colombo parents: school shoes delivered tomorrow”.","**A question they're already asking**: “Which laptop is best for university?”"]},
   "A **call to action (CTA)** tells people exactly what to do next: “Order on WhatsApp”, “Book a free trial class”, “Get the guide”. One piece of content should have one main CTA. Two or three choices split attention and fewer people act."]],
  ["Brand voice and tone",[
   "**Voice** is a brand's consistent personality: playful, serious, warm, expert. **Tone** adjusts that voice to the situation. A playful brand still answers a complaint calmly.",
   {x:["Real world: Old Spice, 2010","Old Spice's “The Man Your Man Could Smell Like” ad, created by the agency Wieden+Kennedy, used absurd, confident humour delivered in one continuous shot. The team then filmed short personal video replies to comments from fans and celebrities on social media within days. A consistent, distinctive voice helped modernise an old brand for a younger audience."]},
   {x:["Real world: Duolingo","Duolingo's voice is cheeky and self-aware, built around its owl, which jokingly “threatens” users who skip lessons. The same voice appears in app notifications, social posts and ads, so the brand feels like one character everywhere."]}]]],
 live:[
  {t:"Watch two famous ads and find the formula",url:L.ytDSC,mins:12,steps:["Watch the Dollar Shave Club launch video (about 90 seconds). Mark where the problem, agitation and solution appear.","Then watch Old Spice's “The Man Your Man Could Smell Like”.","For each, write the main benefit and the call to action in one line."],notice:"Both make a simple product memorable with a strong voice and a clear benefit."},
  {t:"Break down real ads in Meta Ad Library",url:L.adlib,mins:10,steps:["Search for any brand you buy from, set to Sri Lanka.","Open 5 ads. For each, write: the hook (first line), the benefit, the persuasion principle used (social proof, scarcity, authority…) and the CTA button.","Which ad would make you click? Why?"],notice:"Once you know the patterns, you'll see them in every ad you scroll past."},
  {t:"Browse award-winning campaigns",url:L.aotw,mins:8,steps:["Open Ads of the World and browse recent campaigns.","Pick 2 and identify: the target audience, the single idea, and the channel it was made for."],notice:"Great campaigns usually have one simple idea, expressed in a way that suits the channel."}],
 recap:["Content earns attention; ads interrupt. Brands need both.","Cialdini's principles (social proof, scarcity, authority, reciprocity, liking, commitment) appear in most good ads, but must be honest.","AIDA, PAS and Before–After–Bridge give copy a clear structure.","Turn features into benefits with the “so what?” test.","One clear CTA per piece; a consistent voice everywhere."],
 quiz:[["What does content marketing do differently from traditional ads?",["Earns attention by being useful or entertaining","Always costs more","Only works on TV"],0,"People choose to spend time with good content."],
  ["“Only 2 rooms left at this price” uses which principle?",["Scarcity","Authority","Reciprocity"],0,"Limited availability makes things seem more valuable."],
  ["What is the order of PAS?",["Problem, Agitate, Solution","Price, Action, Sale","Promise, Ask, Share"],0,"Name the pain, intensify it, then solve it."],
  ["“1,000 songs in your pocket” is an example of…",["A benefit instead of a feature","A call to action","Social proof"],0,"It describes what the customer gets, not the hard drive size."],
  ["How many main calls to action should one ad have?",["One","Three","As many as possible"],0,"More choices split attention."],
  ["What's the difference between voice and tone?",["Voice is the consistent personality; tone adapts to the situation","They are the same","Tone is the logo; voice is the colour"],0,"A playful brand still responds calmly to a complaint."]],
 terms:[["Content marketing","Creating useful or entertaining material that earns attention."],["Copywriting","Writing designed to make people take an action."],["Social proof","Showing that others use or approve of something."],["AIDA","Attention, Interest, Desire, Action."],["PAS","Problem, Agitate, Solution."],["Benefit","What the customer gains from a feature."],["CTA","Call to action: the one thing you ask people to do."],["Brand voice","A brand's consistent personality in words."]]},

{n:5,icon:"phone",title:"Social media: platforms and algorithms",why:"Understanding how feeds decide what to show is the key to organic reach.",
 intro:["Social media is where most people in Sri Lanka spend much of their screen time: Facebook, WhatsApp, YouTube, Instagram and TikTok. For brands, it's both a free channel (organic posts) and an advertising channel (paid ads, covered on Day 8).",
  "Today explains how social platforms decide who sees what, how they differ, and how famous brands have used them."],
 sections:[
  ["From friends' feeds to interest feeds",[
   "Early social networks showed you posts from friends and pages you chose to follow, in time order. This is called the **social graph**: your connections decided your feed.",
   "TikTok changed the model. Its “For You” feed shows videos from accounts you don't follow, chosen by predicting what will keep you watching. This is the **interest graph**: your behaviour, not your connections, decides your feed. Instagram Reels, Facebook Reels and YouTube Shorts now work in a similar way.",
   "For brands this is a big shift. A small account can reach thousands of people with one strong video, while a big account with a dull post can reach almost nobody. Follower count matters less; **content quality and retention** matter more."]],
  ["How ranking algorithms work",[
   "A feed algorithm is software that predicts which posts you are most likely to enjoy and interact with, then ranks them. The process is roughly the same on every platform.",
   {s:["**Gather candidates**: all the posts that could be shown to you.","**Read signals**: information about the post (who made it, format, topic, how others reacted) and about you (what you watch, like, share and skip).","**Predict**: estimate the chance you'll watch to the end, like, comment, share or send it to a friend.","**Rank**: show the posts with the highest predicted value first."]},
   "Platforms rarely explain their ranking signals in detail, but they do sometimes share the main ones.",
   {x:["Real world: what Instagram says matters","In January 2025, Instagram's head Adam Mosseri said the three signals that matter most for ranking are **watch time, likes and sends** (people sharing a post by direct message). He added that likes matter slightly more for content shown to your followers, while sends matter slightly more for content shown to people who don't follow you. So for reaching new people, content worth sending to a friend is especially powerful."]},
   {m:"Chasing tricks such as the perfect hashtag or posting time while the content itself is average. Algorithms reward what real people watch, share and save."}]],
  ["Platform by platform",[
   "Each platform has its own culture, audience and formats. Content that works on one often fails on another.",
   {l:["**Facebook**: very broad audience, strong in Sri Lanka, groups and local communities, Marketplace. Good for local businesses and older audiences.","**Instagram**: visual, lifestyle, fashion, food, beauty; Reels, Stories and carousels. Younger audiences.","**TikTok**: short, entertaining, trend-driven video; strong discovery even for new accounts.","**YouTube**: the second-largest search engine; long-form tutorials and reviews plus Shorts. People search it to learn.","**LinkedIn**: professionals and business-to-business (B2B) marketing, hiring and thought leadership.","**WhatsApp**: private messaging, Business profiles, catalogues and Channels; central to how many Sri Lankan businesses take orders."]},
   "Professionals choose platforms by where the target audience spends time and what kind of content the brand can realistically produce well, not by trying to be everywhere."]],
  ["Organic social and paid social",[
   "**Organic** posts are free; the algorithm decides how many people see them. **Paid** social means paying to show content to chosen audiences.",
   "Organic reach for brand pages, especially on Facebook, fell sharply over the past decade as feeds filled up and platforms prioritised friends and paid content. Today organic social is mainly used to build a community, test which content people like, and give credibility (people check a brand's profile before buying). Paid social is used to reach new people at scale.",
   "Many brands use organic posts as a free testing ground: the posts that perform best organically are often turned into paid ads, because they've already proved that people find them interesting."]],
  ["Community, creators and influencers",[
   "**Community management** means replying to comments and messages, joining conversations and making followers feel heard. Fast, human replies build loyalty and also signal to algorithms that a post is generating conversation.",
   "**Creators** (influencers) have audiences that trust them. Common size labels:",
   {l:["**Nano**: under about 10,000 followers. Very close, trusting audiences.","**Micro**: about 10,000–100,000. Often the best balance of trust and reach.","**Macro**: about 100,000–1 million.","**Mega**: over 1 million, usually celebrities."]},
   "**User-generated content (UGC)** is content made by customers or creators rather than the brand's studio: reviews, unboxings, tutorials filmed on a phone. It often outperforms polished content because it feels real. Paid partnerships should always be disclosed with labels like “Paid partnership” or #ad; platforms and consumer laws require it."]],
  ["Brands that understood each platform",[
   {x:["Real world: Duolingo on TikTok","From 2021 Duolingo turned its owl mascot into a chaotic, funny TikTok character that jumped on trends, joked about its own push notifications and replied to comments. It rarely talked about language features. The content was made for TikTok's culture rather than adapted from TV ads, and it made a learning app feel like entertainment."]},
   {x:["Real world: Spotify Wrapped","Every December, Spotify gives each user a personalised summary of their year: top artists, songs and listening minutes, designed as shareable story cards. Millions of users post their Wrapped on Instagram and other platforms. The users become the content, and every share is free advertising for Spotify."]},
   {x:["Real world: Ryanair","The European budget airline Ryanair uses TikTok to make fun of itself and its customers' complaints, often using a plane with a face edited onto it. A brand people love to criticise turned the criticism into entertainment and a large following."]},
   "The lesson from all three: they behave like **native creators** on the platform, with a clear personality, instead of posting ads that look like ads."]]],

  {t:"See what's trending right now",url:L.ttTrends,mins:10,steps:["Open TikTok Creative Center's trends page (free).","Set the region to Sri Lanka (or a nearby region if not listed) and look at trending hashtags and songs.","Open one trend and look at the example videos: what format are people using?"],notice:"Trends change weekly. Brands that join relevant trends quickly gain reach."},
