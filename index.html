{n:15,icon:"loop",title:"Growth models: funnels, loops and retention",why:"Advanced marketers model how a business grows, not just which ads to run.",
 intro:["Part 1 treated marketing mostly as a funnel: attract people at the top, convert some at the bottom. Part 2 starts by zooming out. The fastest-growing companies think in **systems**: how new users arrive, how many stay, and how existing users bring in the next ones.",
  "Today covers the frameworks growth teams use at companies like Dropbox and Duolingo, with their real published numbers. It builds on Day 1 (the funnel) and Day 3 (LTV and CAC)."],
 sections:[
  ["The AARRR framework",[
   "In 2007 investor Dave McClure proposed a simple way to see a whole business on one page. He called it **AARRR** (often nicknamed “pirate metrics”):",
   {s:["**Acquisition**: how people find you (ads, search, referrals).","**Activation**: the first moment they get real value, for example completing a first lesson or receiving a first order.","**Retention**: whether they come back.","**Referral**: whether they bring others.","**Revenue**: whether and how much they pay."]},
   "The power of AARRR is that each stage has its own metric and its own team's attention. A company with great acquisition but weak activation is pouring money into a leaky bucket; fixing activation is cheaper than buying more traffic.",
   {m:"Measuring only acquisition (downloads, sign-ups) because it grows fastest and looks best. A sign-up who never activates is a cost, not a customer."}]],
  ["Retention is the foundation",[
   "Retention means the share of people who keep using or buying over time. It's measured with **cohorts**: groups of users who started in the same week or month, tracked separately.",
   {c:"Cohort: 1,000 people who signed up in January\nStill active in month 1: 400  (40%)\nStill active in month 3: 250  (25%)\nStill active in month 6: 220  (22%)\nStill active in month 12: 210 (21%)"},
   "Plot those numbers and you get a **retention curve**. If the curve keeps falling towards zero, the product hasn't found lasting value for anyone, and every marketing rupee leaks away. If it **flattens** (as above, around 21%), a core group has found lasting value, and growth spending will compound.",
   "Growth expert Sean Ellis popularised a quick test for product–market fit: ask users how they'd feel if they could no longer use the product. If at least **40%** answer “very disappointed”, the product has a strong base to grow from.",
   {x:["Real world: why retention matters more than acquisition","Picture two shops each winning 100 new customers a month. Shop A keeps 20% of them; Shop B keeps 60%. After a year, Shop B has three times the loyal base, and every new campaign adds to a bigger, sturdier foundation. Most fast-growing consumer companies treat retention as their first growth problem, not their last."]}]],
  ["Growth loops and why they beat funnels",[
   "A funnel is linear: money goes in at the top, customers come out at the bottom, and it stops when spending stops. A **growth loop** is circular: the output of one cycle becomes the input of the next.",
   {l:["**Viral loop**: users invite other users (referral programs, shared content).","**Content loop**: users create content that ranks in search or spreads on social, bringing new users who create more content.","**Paid loop**: revenue from customers is reinvested in ads that bring more customers. Works when LTV comfortably exceeds CAC.","**Sales loop**: happy customers become case studies and references that help close the next deals."]},
   {x:["Real world: Dropbox's referral loop","Dropbox founder Drew Houston shared the numbers in a 2010 talk. Paid search had failed: it cost US$233–388 to acquire a customer for a US$99 product. Dropbox then built a **two-sided referral program** that gave both the inviter and the new user extra free storage. The referral program “permanently increased signups by 60%”, referrals made up 35% of daily sign-ups, and in the 30 days to April 2010 users sent 2.8 million invitations. Registered users grew from 100,000 in September 2008 to 4 million by January 2010."]},
   {x:["Real world: Hotmail's signature","When Hotmail launched free web email in 1996, every email sent by a user ended with a short line inviting the recipient to get their own free Hotmail account. Every message became an advertisement, and it's still one of the most cited examples of a viral loop built into the product itself."]}]],
  ["The viral coefficient",[
   "Viral growth can be measured with the **viral coefficient**, usually called **K**.",
   {c:"K = invitations sent per user × conversion rate of an invitation\n\nExample: each user invites 3 people, 15% of them join\nK = 3 × 0.15 = 0.45"},
   "If **K is above 1**, every user brings more than one new user and growth feeds itself. That's rare and usually temporary. If **K is below 1** (most products), virality doesn't replace marketing but it **amplifies** it: with K = 0.45, every 100 users you acquire eventually become about 180. The **cycle time** (how long it takes for an invited person to join and invite others) matters too: a short cycle compounds faster.",
   {w:"viral"}]],
  ["North Star metrics and growth models",[
   "A **North Star metric** (Day 2) focuses a whole company on the number that best reflects lasting value. A **growth model** breaks that number into the rates that drive it, so teams know which lever matters most.",
   {x:["Real world: how Duolingo found its lever","Duolingo's former product leader Jorge Mazal described how the company re-ignited growth. It split every user into mutually exclusive groups each day (new, current, reactivated, resurrected and several inactive groups), with the rates of moving between them as levers. Simulating small improvements in each rate showed that **Current User Retention Rate** (CURR: the chance an active user stays active) had about **5 times** more impact on daily active users than the next-best lever. CURR became the North Star, a retention team was formed, and features such as leaderboards (which raised learning time by 17% and tripled the number of highly engaged learners) followed. Over four years CURR rose 21% and daily active users grew **4.5 times**."]},
   "The lesson: don't guess which metric matters most. Build a simple model, change each input by the same small amount, and see which one moves the outcome most. That's where effort should go."]],
  ["Product-led growth and network effects",[
   "In **product-led growth (PLG)**, the product itself does much of the marketing. People can use a free version, get value quickly and invite colleagues; marketing and sales then focus on converting engaged users. Canva, Zoom and Slack all grew largely this way.",
   "**Network effects** happen when a product becomes more valuable as more people use it. WhatsApp is useful because your contacts are on it. Marketplaces such as Daraz, PickMe and Uber have **two-sided** network effects: more buyers attract more sellers (or riders attract drivers), which attracts more buyers.",
   "Two-sided businesses face a **chicken-and-egg problem** at launch: nobody joins an empty marketplace. They usually subsidise one side first, launch city by city, or start with a small, dense community.",
   {m:"Copying a growth tactic (a referral program, a free tier) without the conditions that made it work. Dropbox's referral program worked because storage was cheap for Dropbox to give and valuable to users, and because sharing files naturally involved other people."}]]],
 live:[
  {t:"Read how Duolingo re-ignited growth",url:L.lenny,mins:12,steps:["Read the article by Duolingo's former product leader (the free preview covers the main model).","Find the diagram of user groups. Which arrows did Duolingo decide mattered most, and why?","Note the results of leaderboards and streaks."],notice:"A model of the business, not intuition, decided where the team spent its effort."},
  {t:"See Dropbox's original growth slides",url:L.dropbox,mins:10,steps:["Open Drew Houston's 2010 “Startup Lessons Learned” slides.","Find the slide where paid search failed and the cost per acquisition figures.","Find the referral program results (60%, 35%, 2.8 million invites)."],notice:"The channel that works depends on the product's economics and how people naturally use it."},
  {t:"Look at real retention curves",url:L.gademo,mins:10,steps:["Open the GA4 demo account and go to Explore → Cohort exploration (or create one).","Look at weekly cohorts and how many users return in weeks 1, 2, 3 and beyond.","Does the curve flatten or keep falling towards zero?"],notice:"For an online shop, most users don't return weekly; that's normal. What matters is the shape compared with similar businesses."}],
 recap:["AARRR: acquisition, activation, retention, referral, revenue. Find the weakest stage.","Retention curves that flatten are the foundation of profitable growth.","Loops (viral, content, paid, sales) compound; funnels stop when spending stops.","Viral coefficient K = invites × conversion; below 1 it still amplifies acquisition.","Model the business to find the biggest lever, as Duolingo did with CURR."],
 quiz:[["What does the second A in AARRR stand for?",["Activation","Advertising","Awareness"],0,"Acquisition, Activation, Retention, Referral, Revenue."],
  ["What does a retention curve that flattens tell you?",["A core group has found lasting value","The product is failing","Ads have stopped"],0,"A flat curve means a stable base to grow from."],
  ["What did Dropbox find about paid search?",["It cost US$233–388 per customer for a US$99 product","It was its best channel","It was free"],0,"So it built a referral loop instead."],
  ["Each user invites 4 people and 10% join. What is K?",["0.4","4","40"],0,"4 × 0.10 = 0.4."],
  ["Which metric did Duolingo choose as its North Star?",["Current User Retention Rate","Total downloads","Revenue per user"],0,"Its model showed CURR had about 5x the impact of the next lever."],
  ["Which is a two-sided network effect?",["More riders attract more drivers, which attracts more riders","More ads lower costs","A bigger logo"],0,"Marketplaces like PickMe and Uber work this way."]],
 terms:[["AARRR","Acquisition, Activation, Retention, Referral, Revenue."],["Activation","The first moment a user gets real value."],["Cohort","A group of users who started at the same time."],["Retention curve","How a cohort's active share changes over time."],["Growth loop","A cycle where outputs become new inputs, compounding growth."],["Viral coefficient (K)","New users each user brings: invites × conversion."],["Product-led growth","Growth driven mainly by the product's own use and sharing."],["Network effect","A product becoming more valuable as more people use it."]]},

{n:16,icon:"tag",title:"Behavioural economics, pricing and offers",why:"How a price and an offer are presented can matter as much as the number itself.",
 intro:["Day 2 showed that people mostly decide quickly and intuitively. Behavioural economics studies the predictable ways those quick decisions depart from pure logic, and it's now central to pricing pages, offers and checkout design.",
  "Today explains the main effects with famous real experiments, then shows how professionals design prices and offers, and where persuasion becomes manipulation."],
 sections:[
  ["Why shoppers aren't perfectly rational",[
   "Classic economics assumed people weigh every option carefully. Psychologists Daniel Kahneman and Amos Tversky showed in the 1970s that people use mental shortcuts (**heuristics**) that cause predictable biases. Kahneman received the Nobel Prize in economics in 2002, and economist Richard Thaler received it in 2017 for bringing these ideas into mainstream economics.",
   "For marketers, the key insight is that **context changes choices**. The same product at the same price can sell very differently depending on what it's shown next to, how the price is phrased, and what the customer feels they might lose."]],
  ["Anchoring and the decoy effect",[
   "**Anchoring**: the first number people see becomes a reference point for judging the next ones. A “was LKR 9,999, now LKR 6,999” label makes 6,999 feel cheap, because 9,999 is the anchor. Showing the most expensive plan first makes the middle plan seem reasonable.",
   "The **decoy effect**: adding an option that few people want can change which of the other options they choose.",
   {x:["Real world: The Economist's subscription test","Behavioural economist Dan Ariely described a real Economist subscription offer in his book Predictably Irrational (2008): web-only for US$59, print-only for US$125, and print plus web for US$125. When he tested it with students, 84% chose print plus web and 16% web-only; nobody chose print-only. When he removed the print-only option, which nobody had picked, 68% chose web-only and only 32% chose print plus web. The useless option made the bundle look like a bargain."]},
   {m:"Inventing a fake “original price” to anchor against. In many countries that's illegal, and customers who notice stop trusting the brand."}]],
  ["Loss aversion, framing and ownership",[
   "Kahneman and Tversky's research found that losses feel roughly **twice as strong** as equivalent gains. People work harder to avoid losing LKR 1,000 than to gain LKR 1,000. This is **loss aversion**.",
   {l:["**Framing**: “Don't lose your 30% discount” often beats “Get 30% off”, though both describe the same offer.","**Endowment effect**: people value things more once they feel they own them. Free trials, saved carts and “your plan” wording all create a sense of ownership.","**Default effect**: most people keep whatever option is pre-selected, so defaults are powerful (and must be fair)."]},
   {x:["Real world: Duolingo streaks","Duolingo's streak counts the consecutive days a learner has practised. Missing a day means losing the streak, and the app reminds people when their streak is at risk. Duolingo reported that the share of daily users with a streak of 7+ days nearly tripled to more than half after it invested in streak features. Loss aversion keeps people practising."]}]],
  ["Pricing strategies",[
   {l:["**Cost-plus**: cost plus a fixed margin. Simple, but ignores what customers would pay.","**Competitor-based**: priced against rivals. Common in crowded markets.","**Value-based**: priced on the value to the customer. Usually the most profitable, but needs customer research.","**Tiered (good–better–best)**: several packages so customers pick their level; the middle tier is often designed to be the main seller.","**Freemium**: a free version with paid upgrades, as with Spotify.","**Subscription**: recurring payments, which raise lifetime value when retention is high.","**Charm pricing**: prices like 999 instead of 1,000, which the eye reads from the left as “9-hundred-something”."]},
   {x:["Real world: tiers on streaming services","Netflix introduced a cheaper plan with ads in November 2022 alongside its ad-free plans, and Spotify offers a free tier with ads plus several paid plans (individual, duo, family, student). Each tier targets a different willingness to pay, while the free or cheapest tier lowers the barrier to starting."]}]],
  ["Designing offers that make money",[
   "Discounts are easy to launch and easy to lose money on. Before running one, work out how many extra sales it needs just to stand still.",
   {c:"Extra sales needed to keep the same gross profit\n= Discount ÷ (Margin − Discount)\n\n40% margin, 20% discount: 20 ÷ (40 − 20) = 100% more sales\n40% margin, 10% discount: 10 ÷ (40 − 10) = 33% more sales"},
   "Alternatives often protect margin better: **value-adds** (a free gift or service), **bundles** (combining products so the total feels like a deal), **free delivery thresholds** (“free delivery over LKR 5,000” raises average order value), **guarantees** (risk reversal makes the first purchase feel safe), and **limited editions**.",
   {w:"discount"}]],
  ["Persuasion versus manipulation",[
   "The line between persuasion and manipulation is honesty and the customer's interest. **Dark patterns** are designs that trick people: fake countdown timers, false “only 1 left” claims, hidden fees added at checkout (drip pricing), pre-ticked add-ons and making cancellation deliberately hard.",
   {x:["Real world: regulators step in","In 2019 the UK's Competition and Markets Authority secured commitments from major hotel booking sites to stop misleading pressure-selling claims, such as giving a false impression of how many people were viewing a room or how limited availability was. Similar consumer-protection actions have followed in many countries."]},
   "Use these principles to make honest offers clearer and easier to accept, never to deceive. Apart from the legal risk, tricks raise refunds, complaints and churn.",
   {w:"bias"}]]],
 live:[
  {t:"Hear the decoy effect explained",url:L.ytAriely,mins:10,steps:["Search result: find Dan Ariely's talk or a clip explaining The Economist subscription example.","Write down the three options and how the choices changed when the decoy was removed."],notice:"An option nobody chooses can still change what everyone else chooses."},
  {t:"Study a real pricing page",url:L.spotifyPrem,mins:10,steps:["Open Spotify's Premium page (for your country).","Note how many plans there are, which one is highlighted, and how the price per person differs between individual, duo and family.","Spot any free-trial or introductory offer and how it is framed."],notice:"Tier design, highlighting and trials guide most people to one intended choice."},
  {t:"Audit a real flash sale",url:L.darazFlash,mins:10,steps:["Open Daraz and find a flash sale or deals section.","List every persuasion cue: crossed-out prices, countdowns, stock bars, ratings, badges.","For each cue, ask: does it give real, honest information, or could it mislead?"],notice:"The same tools can inform or manipulate; honesty is the difference."}],
 recap:["People use mental shortcuts; context changes choices.","Anchoring and decoys shape how prices are judged (The Economist: 84% vs 32%).","Losses feel about twice as strong as gains; framing and defaults matter.","Check how many extra sales a discount needs: discount ÷ (margin − discount).","Dark patterns are risky and unethical; persuade honestly."],
 quiz:[["In The Economist example, what happened when the print-only option was removed?",["Most people switched to web-only","Everyone chose print plus web","Nobody subscribed"],0,"Without the decoy, 68% chose web-only."],
  ["Loss aversion means…",["Losses feel stronger than equal gains","People avoid all purchases","Prices always go down"],0,"Roughly twice as strong, according to Kahneman and Tversky."],
  ["Margin 40%, discount 20%. How many extra sales are needed to keep the same gross profit?",["100% more","20% more","50% more"],0,"20 ÷ (40 − 20) = 1, so double."],
  ["Which pricing approach is based on what customers gain?",["Value-based","Cost-plus","Competitor-based"],0,"It needs customer research but is usually most profitable."],
  ["A countdown timer that resets every time you reload the page is…",["A dark pattern","Charm pricing","Value-based pricing"],0,"Fake urgency deceives customers."],
  ["Why do free-delivery thresholds work?",["They encourage people to add items to reach the minimum, raising order value","They make delivery free for the business","They are required by law"],0,"Customers top up their cart to avoid paying delivery."]],
 terms:[["Behavioural economics","The study of predictable departures from rational choice."],["Anchoring","Judging prices against the first number seen."],["Decoy effect","An unattractive option shifting choices between others."],["Loss aversion","Losses feel about twice as strong as equal gains."],["Framing","Presenting the same facts in different ways to change perception."],["Value-based pricing","Setting prices by the value customers receive."],["Dark pattern","A design that tricks users into actions they didn't intend."]]},

{n:17,icon:"person",title:"Advanced customer research and positioning",why:"Deep customer insight is the hardest advantage for competitors to copy.",
 intro:["Day 2 introduced customers, STP and positioning. Today goes deeper into the research methods professionals use to discover why people really buy, and the positioning frameworks used by strategists.",
  "The examples include one of the most famous research stories in business, Clayton Christensen's milkshake study, and a brand that repositioned itself completely."],
 sections:[
  ["Jobs to be done in depth",[
   "Harvard professor Clayton Christensen argued that customers don't buy products; they **hire** them to do a job in a particular situation. Understanding the job reveals your real competitors and what to improve.",
   {x:["Real world: the milkshake","Christensen described work for a fast-food chain that wanted to sell more milkshakes. Asking customers how to improve the milkshake (thicker? more flavours?) changed nothing. Researchers then watched who bought milkshakes and when. Many were bought early in the morning by commuters alone in their cars. Their job was to make a long, boring drive more interesting and keep them full until lunch. A thick milkshake that lasted the whole drive beat bananas, bagels and doughnuts at that job. The real competitors weren't other milkshakes."]},
   "Bob Moesta, who worked with Christensen, describes four **forces of progress** acting on every switch decision:",
   {l:["**Push** of the current situation (frustration with the old way).","**Pull** of the new solution (the better life it promises).","**Anxiety** about the new solution (will it work? is it worth the money?).","**Habit** of the present (“what I have is good enough”)."]},
   "Marketing that only shouts about the pull often fails. Reducing anxiety (guarantees, reviews, free trials) and addressing habit can matter just as much."]],
  ["Customer interviews that reveal the truth",[
   "People are poor at predicting what they'll do and too polite to say they dislike an idea. Rob Fitzpatrick's book **The Mom Test** (2013) gives simple rules for interviews that produce honest answers:",
   {l:["Ask about **past behaviour**, not opinions or the future. “When did you last buy this? What happened?” not “Would you buy this?”","Talk about **their life**, not your idea.","Look for **specifics** and actions taken (money spent, time spent, workarounds built).","Listen far more than you talk."]},
   "A **switch interview** reconstructs the timeline of one real purchase: when they first thought about it, what they tried, what nearly stopped them and what finally made them act. Ten good switch interviews often reveal more than a survey of a thousand people."]],
  ["Surveys and quantitative research",[
   "Surveys measure how common something is once interviews have shown what to ask about. Good surveys use neutral wording, one question at a time and a representative sample.",
   {l:["**Net Promoter Score (NPS)**: “How likely are you to recommend us to a friend?” on 0–10. Introduced by Fred Reichheld in Harvard Business Review in 2003. NPS = % promoters (9–10) − % detractors (0–6).","**Customer satisfaction (CSAT)**: satisfaction with a specific interaction.","**Product–market fit survey**: Sean Ellis's “very disappointed” question (Day 15).","**Attribution survey**: “How did you hear about us?” at checkout, a simple cross-check on what tracking reports."]},
   {m:"Leading questions such as “How much do you love our fast delivery?” They produce flattering numbers that mean nothing."}]],
  ["Positioning in depth",[
   "Positioning expert April Dunford, in her book **Obviously Awesome** (2019), breaks positioning into five connected parts:",
   {s:["**Competitive alternatives**: what customers would do if you didn't exist (often a spreadsheet, a manual process or doing nothing).","**Unique attributes**: what you have that the alternatives don't.","**Value**: what those attributes enable for customers, with proof.","**Target customers**: who cares most about that value.","**Market category**: the frame you present yourself in, which sets customers' expectations."]},
   {x:["Real world: Lucozade's repositioning","For decades the British drink Lucozade was positioned as something to help sick people recover. In the 1980s it was repositioned as a sports energy drink, with advertising featuring Olympic decathlete Daley Thompson. The product changed little; the target customers, the category and the meaning changed completely, and so did its sales potential."]}]],
  ["Segments and personas done properly",[
   "Weak personas are invented characters (“Busy Ben, 32, likes coffee”). Strong segments come from research and are defined by **needs, situations and behaviours**, because those predict buying better than age or gender.",
   {l:["**Needs-based segments**: groups wanting different jobs done (speed, price, status, safety).","**Behavioural segments**: first-time vs repeat buyers, heavy vs light users.","**Ideal customer profile (ICP)** in business-to-business: the type of company that gets the most value and stays longest."]},
   "Each segment should be big enough to matter, reachable through some channel, and different enough to need a different message or offer."]],
  ["Mining the voice of the customer",[
   "Customers describe their problems in their own words online every day. **Voice of customer (VoC)** research collects that language and uses it in ads, pages and product decisions.",
   {l:["**App store and Google reviews**: what delights and what frustrates.","**Competitors' reviews**: especially 3-star reviews, which tend to explain what's missing.","**Reddit, Facebook groups and forums**: unfiltered discussions of problems and alternatives.","**Support tickets and sales calls**: the questions and objections that come up repeatedly."]},
   "Professionals sort what they find into themes (jobs, pains, objections, desired outcomes) and copy exact phrases, because customers respond to their own words more than to marketing language."]]],
 live:[
  {t:"Watch the milkshake story",url:L.ytMilkshake,mins:8,steps:["Watch Clayton Christensen explain the milkshake study (several versions exist; any is fine).","Write the job the commuters were hiring the milkshake for, and list its real competitors."],notice:"Understanding the job reveals competitors you'd never find by looking at your own category."},
  {t:"Mine real reviews for jobs and pains",url:L.playPickme,mins:12,steps:["Open the PickMe app's Google Play page and read the most recent reviews (sort by newest if possible).","Group what you read into themes: jobs people use it for, frustrations, praise.","Note 3 exact phrases that could appear in an ad or a product decision."],notice:"Real customer language is specific in a way marketers rarely invent."},
  {t:"Read an unfiltered community discussion",url:L.reddit,mins:8,steps:["Open the Reddit search of r/srilanka for a common decision, such as choosing a bank account.","Read the top threads. What do people care about? What worries them? Which brands come up, and why?"],notice:"Communities reveal the push, pull, anxiety and habit forces behind real decisions."}],
 recap:["Customers hire products for jobs; the job reveals your real competitors.","Push, pull, anxiety and habit act on every switch; reduce anxiety and habit, not just add pull.","Interview about past behaviour, not opinions (The Mom Test).","Dunford's five parts: alternatives, unique attributes, value, target customers, category.","Voice-of-customer research gives you customers' exact words."],
 quiz:[["In the milkshake study, what job were morning commuters hiring the milkshake for?",["Making a long, boring drive more interesting and staying full","Celebrating a birthday","Losing weight"],0,"Its real competitors were bananas, bagels and doughnuts."],
  ["Which force describes worry about whether a new product will work?",["Anxiety","Push","Pull"],0,"Reduce it with guarantees, reviews and trials."],
  ["Which interview question follows The Mom Test?",["When did you last buy this, and what happened?","Would you buy my product?","Do you like my idea?"],0,"Ask about past behaviour."],
  ["How is NPS calculated?",["% promoters minus % detractors","Average score out of 10","Number of reviews"],0,"Promoters score 9–10; detractors 0–6."],
  ["What did Lucozade change in the 1980s?",["Its positioning, from recovery drink to sports energy drink","Its owner only","Its price only"],0,"Same product, new target customers and category."],
  ["Why are 3-star competitor reviews especially useful?",["They often explain what's missing","They're always fake","They're the most positive"],0,"Balanced reviews reveal gaps you can fill."]],
 terms:[["Jobs to be done","The progress a customer hires a product to make."],["Forces of progress","Push, pull, anxiety and habit acting on a switch."],["Switch interview","Reconstructing the timeline of one real purchase."],["NPS","Net Promoter Score: % promoters minus % detractors."],["Competitive alternatives","What customers would use if you didn't exist."],["Market category","The frame that sets customers' expectations."],["Voice of customer","Customers' own words about their needs and problems."]]},

{n:18,icon:"megaphone",title:"Advanced Meta Ads: automation, creative and scale",why:"Senior Meta buyers work with the algorithm, not against it.",
 intro:["Day 8 covered how Meta Ads are structured. Today explains how Meta's delivery system actually chooses ads, why that changed best practice, and how professionals feed it, scale it and measure it.",
  "Several facts come straight from Meta's own engineering publications, with the usual caution that platforms describe their systems favourably."],
 sections:[
  ["How Meta chooses which ad to show",[
   "When someone opens Facebook or Instagram, Meta must choose a few ads from millions of eligible ones in a fraction of a second. It does this in stages:",
   {s:["**Retrieval**: narrows tens of millions of candidate ads to a few thousand that might suit this person.","**Ranking**: detailed models predict how likely the person is to take the action each advertiser wants, and how good each ad is.","**Auction**: combines those predictions with each advertiser's bid (total value, Day 7) to pick the winner."]},
   {x:["Real world: Andromeda","In December 2024 Meta's engineers described **Andromeda**, a new retrieval system built on NVIDIA Grace Hopper hardware. Meta said it improved retrieval recall by 6% and ad quality by 8% on selected segments, and was designed to handle the growing number of ads created with automation and generative AI. Meta also reported that over a million advertisers had used its generative AI tools to create more than 15 million ads in a month."]},
   "The practical consequence: because the system matches individual ads to individual people, **creative variety** gives it more options to match. Different concepts reach different people."]],
  ["Consolidation and Advantage+",[
   "Old-style accounts had many small ad sets, each targeting a narrow audience. Today Meta generally recommends **consolidation**: fewer campaigns and ad sets with broader audiences and more budget each, so each ad set gets enough conversions to learn (Day 8's learning phase).",
   "**Advantage+** campaigns automate audience, placements and budget allocation. Meta reported that advertisers who switched on its AI-driven targeting saw a 22% increase in return on ad spend. Results vary by account, and many experienced buyers still keep some manual control: excluding existing customers, protecting brand safety, or separating campaigns that need different budgets.",
   {m:"Splitting a small budget across many audiences to “test” them. None of them gets enough data to learn, so the test only measures noise."}]],
  ["Creative diversification at scale",[
   "With automated targeting, the creative mix is the strategy. Professionals plan creative as a matrix:",
   {l:["**Angles**: price, quality, convenience, social proof, problem-solution, identity.","**Personas or situations**: different customers and the job each is hiring the product for (Day 17).","**Formats**: UGC video, founder video, static, carousel, demonstration, catalogue."]},
   "They produce several **genuinely different concepts**, not ten copies of one idea with different colours, and refresh them regularly. Meta's own tools can generate background variations, text variations and resized versions, which saves production time but doesn't replace the core idea."]],
  ["Value optimisation and better signals",[
   "Standard campaigns treat every purchase as equal. **Value optimisation** tells Meta to aim for the highest purchase value, not just the most purchases, which suits stores with very different order sizes.",
   {l:["Send **purchase value** with every purchase event, through both the Pixel and the Conversions API (Day 8).","Improve **Event Match Quality** by sending hashed customer details the customer has agreed to share.","For lead generation, send back which leads became **qualified** or **customers** from your CRM, so Meta optimises for quality rather than form fills."]},
   "Better signals are often the biggest single improvement an advanced buyer can make, because every automated decision depends on them."]],
  ["Scaling and diminishing returns",[
   "Scaling means spending more while keeping results acceptable. There are two broad ways:",
   {l:["**Vertical scaling**: raising the budget of what already works, typically in steps of about 20% every few days to avoid disrupting delivery.","**Horizontal scaling**: adding new creative concepts, audiences, products or countries."]},
   "Every channel shows **diminishing returns** (Day 14): the cheapest conversions are bought first, so each extra rupee buys a little less. The important number is the **marginal CPA**, the cost of the extra conversions, not the average. Try the model below.",
   {w:"marginal"}]],
  ["Measuring Meta properly",[
   "Meta's reported conversions use its attribution rules, so they include some people who would have bought anyway (Day 7). Advanced teams check Meta's numbers against independent evidence:",
   {l:["**Conversion lift studies**: Meta randomly holds back ads from a control group and measures the difference in conversions.","**A/B tests**: Meta's tool splits audiences cleanly to compare strategies.","**Comparing with GA4 and actual sales**, accepting that each source counts differently.","**Marketing mix modelling**, for example Meta's open-source **Robyn** (Day 24)."]}]]],
 live:[
  {t:"Read Meta's Andromeda announcement",url:L.andromeda,mins:12,steps:["Read the Engineering at Meta post from December 2024.","Find the three stages of ad delivery and where Andromeda sits.","Note what Meta says about the growth in the number of ads and creative from generative AI."],notice:"Understanding the machine explains why creative variety and consolidation became best practice."},
  {t:"Count a big advertiser's creative variety",url:L.adlib,mins:10,steps:["In Meta Ad Library, search for a large direct-to-consumer or app brand.","Look through 15–20 active ads. Tag each one by angle (price, quality, proof, problem) and format (video, static, carousel).","How many genuinely different concepts are running at the same time?"],notice:"Large advertisers run many distinct concepts at once to give the system options."},
  {t:"Open Meta's measurement tool",url:L.robyn,mins:8,steps:["Open the Robyn page on GitHub (Meta's open-source marketing mix modelling tool).","Read the introduction: what problem it says it solves and what data it needs."],notice:"Meta itself provides tools to measure marketing beyond its own attribution."}],
 recap:["Meta delivers ads in stages: retrieval, ranking, auction. Andromeda improved retrieval.","Consolidated structures and Advantage+ give the system enough data to learn.","Plan creative as angles × personas × formats; real variety beats copies.","Value optimisation and CRM feedback improve every automated decision.","Scale on marginal CPA and verify results with lift studies and MMM."],
 quiz:[["Which stage narrows millions of ads to a few thousand?",["Retrieval","Ranking","Billing"],0,"Andromeda works at this stage."],
  ["Why is creative variety important with automated targeting?",["Different concepts let the system match ads to different people","It lowers the platform fee","It is required by law"],0,"Each concept reaches a different audience."],
  ["What does value optimisation aim for?",["The highest purchase value","The most clicks","The lowest CPM"],0,"Useful when order sizes vary widely."],
  ["What is the usual step when raising budgets vertically?",["About 20% every few days","Doubling every hour","Ten times overnight"],0,"Gradual increases avoid disrupting delivery."],
  ["What does a conversion lift study do?",["Holds ads back from a random control group and measures the difference","Doubles reported conversions","Picks the best image"],0,"It measures incrementality."],
  ["What is marginal CPA?",["The cost of the extra conversions from additional spend","The average cost of all conversions","The cost of the first conversion"],0,"It rises as spend grows."]],
 terms:[["Retrieval","The stage that narrows millions of ads to a shortlist."],["Andromeda","Meta's ad retrieval system announced in December 2024."],["Consolidation","Using fewer, larger campaigns so each gets enough data."],["Value optimisation","Bidding for the highest purchase value."],["Vertical scaling","Increasing the budget of what already works."],["Horizontal scaling","Adding new creatives, audiences or markets."],["Conversion lift","An experiment measuring conversions caused by ads."]]},

{n:19,icon:"searchad",title:"Advanced Google Ads: bidding, data and automation",why:"Modern Google Ads success depends on the data you feed its automation.",
 intro:["Day 9 covered Google's campaign types and the basics of Search. Today explains what advanced practitioners actually control now that Google automates bidding, matching and much of the creative: conversion data quality, value signals, feed quality and structure.",
  "It also covers how to keep control and check incrementality inside a heavily automated system."],
 sections:[
  ["Smart Bidding in depth",[
   "Smart Bidding sets a separate bid for every single auction using signals a human couldn't process: device, location, time, browser, the exact search, the person's context and many more.",
   {l:["**Target CPA**: aims for an average cost per conversion.","**Target ROAS**: aims for an average return (revenue ÷ cost). Needs conversion values.","**Portfolio strategies**: one target shared across several campaigns.","**Seasonality adjustments**: tell the system about short, predictable spikes such as a big sale.","**Data exclusions**: tell it to ignore days when tracking was broken."]},
   "Smart Bidding learns from conversions, so it needs enough volume, accurate tracking and patience after changes. Large, sudden target changes reset its learning in a similar way to Meta's learning phase."]],
  ["Conversion quality: teaching Google what matters",[
   "The automation optimises for whatever you call a conversion. If a form fill from a fake email counts the same as a paying customer, Google will happily find more fake form fills.",
   {l:["**Primary vs secondary conversions**: only primary actions guide bidding; secondary ones are just reported.","**Conversion values and value rules**: give more valuable actions or customers higher values.","**Enhanced conversions**: securely send hashed first-party data (such as email) with conversions to improve matching.","**Offline conversion import**: upload which leads became qualified or became customers from your CRM, so Google bids for real business outcomes.","**Consent mode**: lets Google model conversions from users who declined cookies (Day 22)."]},
   {m:"Counting page views or button clicks as primary conversions to make the numbers look healthy. Bidding then optimises for actions that don't make money."}]],
  ["Performance Max in depth",[
   "Performance Max runs across all of Google from one campaign (Day 9). Advanced management focuses on the inputs:",
   {l:["**Asset groups** organised by theme or product line, each with its own headlines, images, videos and audience signals.","**Listing groups** controlling which products from the feed are included.","**Search themes**: hints about searches you want to appear on.","**Brand exclusions and negative keywords** to stop PMax claiming easy brand traffic.","**Reporting**: Google has added more insight over time, including search term categories and channel-level performance, so you can see where the money goes."]},
   "Because PMax can take credit for searches on your brand name (people who would have found you anyway, as eBay's research showed in Day 7), many advertisers exclude their brand and run a separate brand Search campaign."]],
  ["Search in the age of AI Max",[
   "Search is moving from exact keyword control towards meaning-based matching. **AI Max for Search** (which replaced Dynamic Search Ads from September 2026) can match ads to searches beyond your keyword list and rewrite ad text to fit each search.",
   "Advanced practitioners adapt by:",
   {l:["Combining broad or AI-driven matching with Smart Bidding and strong conversion data.","Mining the **search terms report** to find new themes and add negatives at scale.","Using **brand controls**, URL controls and term exclusions to keep traffic relevant.","Comparing the extra matches AI Max brings against their cost, using its own reporting."]},
   {x:["Real world: the trade-off","Google says AI Max with its full feature set brings about 7% more conversions or conversion value at a similar cost per result. Independent analyses in 2025 reported weaker results for some retail advertisers. The professional approach is to test it in your own account with clean measurement, not to accept or reject it on faith."]}]],
  ["Shopping feed optimisation",[
   "For e-commerce, the **product feed** is the ad. Google matches searches to products mainly through feed data, so improving the feed often beats bid changes.",
   {l:["**Titles**: put the most searched attributes first (brand, product type, key attributes like size, colour, model).","**Images**: clean, high quality, showing the product clearly.","**Product type and category**: accurate classification helps matching.","**GTINs** (barcodes): help Google identify the exact product.","**Custom labels**: tag products by margin, best-sellers or season so you can bid differently on each.","**Supplemental feeds**: add or fix data without changing the main source."]},
   "Margin-based custom labels are a classic advanced technique: high-margin products get more aggressive ROAS targets, low-margin products more conservative ones."]],
  ["YouTube and checking incrementality on Google",[
   "YouTube campaigns are judged by different measures from Search. Google offers **Brand Lift** studies (surveys comparing people who saw ads with similar people who didn't, measuring ad recall, awareness and consideration) and **conversion lift** studies for action-focused campaigns.",
   "For the whole account, advanced teams run **geo experiments** (switching spend on or off in matched regions, Day 24) and use **marketing mix modelling**; Google's open-source **Meridian** is built for this. These answer the question platform reports can't: what would have happened without the ads?"]]],
 live:[
  {t:"Judge real Shopping feeds",url:L.gsearch("buy wireless headphones"),mins:10,steps:["Search and look at the Shopping results (product images with prices).","Compare product titles: which put brand, model and key features first? Which are vague?","Pick the two clearest listings and explain why they'd match more searches."],notice:"Clear, attribute-rich titles help Google match products to searches."},
  {t:"Read the AI Max change",url:L.aimax,mins:10,steps:["Read the article about AI Max replacing Dynamic Search Ads.","Find what changed in September 2026, what controls advertisers have, and the performance claims and criticism."],notice:"Automation keeps expanding; controls and clean measurement keep it honest."},
  {t:"Read Google's Smart Bidding guidance",url:L.gsearch("Google Ads Help About Smart Bidding"),mins:8,steps:["Open Google Ads Help's “About Smart Bidding” page from the results.","Note the signals Google lists and its guidance on conversion volume and learning."],notice:"Official documentation is the reference professionals check before changing strategy."}],

{n:20,icon:"layers",title:"Programmatic, retail media and other platforms",why:"Beyond Meta and Google there's a large, complex and fast-growing ad ecosystem.",
 intro:["Meta and Google take a large share of digital ad budgets, but much of the rest is bought automatically across thousands of websites, apps, streaming services and retailers. Today explains how that ecosystem works, where money is wasted, and the fastest-growing area: retail media.",
  "It also covers TikTok, LinkedIn, connected TV and affiliates, so you know when each channel fits."],
 sections:[
  ["How programmatic advertising works",[
   "**Programmatic advertising** is buying ad space automatically through software, usually in real-time auctions that happen while a web page loads.",
   {s:["A person opens a news website. The site's **supply-side platform (SSP)** offers the ad space to buyers through an **ad exchange**.","Advertisers' **demand-side platforms (DSPs)**, such as Google's Display & Video 360, The Trade Desk or Amazon DSP, evaluate the impression using data about the context and audience.","They bid in a **real-time bidding (RTB)** auction, typically within about 100 milliseconds.","The winning ad loads on the page."]},
   "Besides open auctions, buyers use **private marketplaces** and **programmatic guaranteed** deals with chosen publishers, trading some scale for more control and quality."]],
  ["Waste, fraud and brand safety",[
   "The programmatic supply chain has many intermediaries, each taking a fee, and plenty of room for low-quality inventory.",
   {x:["Real world: the ANA transparency study","The US Association of National Advertisers studied programmatic spending from September 2022 to January 2023. It found that “made for advertising” (MFA) websites, low-quality sites built mainly to show ads, received 15% of spend and 21% of impressions. The ANA estimated marketers could save at least US$13 billion by improving their programmatic practices, largely by buying from fewer, higher-quality sites."]},
   {l:["**Ad fraud**: fake traffic from bots, or networks claiming credit for conversions they didn't cause (remember Uber, Day 3).","**Brand safety**: avoiding placements next to harmful content.","**Supply path optimisation**: buying through fewer, more direct routes.","**ads.txt**: a public file on each website listing which companies are authorised to sell its ad space, so buyers can avoid counterfeit inventory."]}]],
  ["Retail media",[
   "**Retail media** means ads sold by retailers on their own websites and apps (and increasingly elsewhere), using their data on what customers actually buy. It sits right at the point of purchase and can prove sales directly, because the retailer sees both the ad and the purchase (**closed-loop measurement**).",
   {x:["Real world: Amazon's advertising business","Amazon's advertising revenue passed US$68 billion in 2025, with US$21.3 billion in the fourth quarter alone, up 22% on the year before. The core is **sponsored products** (paid placements in Amazon search results), increasingly joined by video ads on Prime Video, which Amazon said reached 315 million ad-supported viewers in that quarter."]},
   "Other retailers have followed: supermarkets, marketplaces and delivery apps around the world now sell sponsored listings and use loyalty data for targeting. Marketplaces such as Daraz also offer sponsored product placements to sellers."]],
  ["TikTok, LinkedIn and other platforms",[
   {l:["**TikTok Ads**: in-feed video ads that look like native content. **Spark Ads** promote existing organic posts, including creators' posts with their permission. Strong for younger audiences and creative-led brands.","**LinkedIn Ads**: target by job title, function, seniority, company and industry. Costs per click are usually much higher than on Meta, but the targeting suits business-to-business products.","**Pinterest**: people planning purchases and projects (home, fashion, food, weddings).","**Snapchat and X**: specific audiences and formats; useful in some markets and categories."]},
   "Choose platforms by where your target customers are, what format your message needs, and whether you can measure results, not by trends.",
   {w:"channel"}]],
  ["Connected TV, audio and digital out-of-home",[
   {l:["**Connected TV (CTV)**: video ads on streaming apps watched on TV screens (YouTube on TV, Prime Video, other streaming services). Combines TV's impact with digital targeting and measurement.","**Digital audio**: ads on music streaming and podcasts, such as Spotify's free tier.","**Programmatic digital out-of-home (DOOH)**: digital billboards and screens bought through DSPs."]},
   "These channels mainly build reach and memory (brand building, Day 1), so they're judged with reach, frequency, brand lift and incrementality tests rather than last-click sales."]],
  ["Affiliate and partner marketing",[
   "**Affiliates** are partners paid a commission when they send a sale: comparison sites, coupon sites, bloggers and creators with discount codes.",
   {l:["Cost per acquisition pricing means you only pay for results, which feels safe.","But affiliates are credited on **last click**, so coupon sites can claim sales from people already about to buy who simply searched for a code.","Fraud risks include **cookie stuffing** (secretly setting affiliate cookies so the affiliate gets credit for later purchases)."]},
   "Good programs reward partners who bring genuinely new customers, monitor unusual patterns and check incrementality like any other channel."]]],
 live:[
  {t:"See who may sell a website's ad space",url:L.nytAds,mins:8,steps:["Open The New York Times' ads.txt file (a plain text list).","Each line names an ad system, an account ID and whether the relationship is DIRECT or RESELLER.","Try the same for another big news site by adding /ads.txt after its domain."],notice:"ads.txt lets anyone check which sellers a publisher authorises, cutting down counterfeit inventory."},
  {t:"Spot retail media in action",url:L.amazonSearch,mins:8,steps:["Open the Amazon search for wireless headphones.","Count the products labelled “Sponsored” on the first page, and note where they sit.","Compare with a Daraz search for the same product."],notice:"Retail media sits exactly where shoppers decide, which is why it has grown so fast."},
  {t:"Browse LinkedIn's Ad Library",url:L.liAdlib,mins:8,steps:["Open LinkedIn's Ad Library and search for a large software or professional services company.","Look at the formats and messages. How do they differ from consumer ads on Meta?"],notice:"B2B ads usually sell expertise and outcomes to professionals, with longer buying cycles."}],
 recap:["Programmatic buying runs real-time auctions through SSPs, exchanges and DSPs.","The ANA found MFA sites took 15% of spend and 21% of impressions; quality and fewer sites save money.","Retail media uses purchase data at the point of sale; Amazon's ad revenue passed US$68 billion in 2025.","Pick TikTok, LinkedIn, Pinterest and others by audience, format and measurability.","Affiliates are paid on last click, so check they bring new customers."],
 quiz:[["What does a DSP do?",["Lets advertisers bid on ad impressions automatically","Hosts websites","Designs creative"],0,"Demand-side platforms buy on behalf of advertisers."],
  ["What share of programmatic spend did the ANA find went to MFA sites?",["15%","1%","50%"],0,"They also took 21% of impressions."],
  ["What is ads.txt?",["A public list of companies authorised to sell a site's ad space","A type of text ad","A tracking cookie"],0,"It helps buyers avoid counterfeit inventory."],
  ["What makes retail media attractive?",["Purchase data and closed-loop measurement at the point of sale","It's always free","No competition"],0,"The retailer sees both the ad and the purchase."],
  ["Which platform targets by job title and company?",["LinkedIn","TikTok","Pinterest"],0,"Suited to business-to-business marketing."],
  ["What is cookie stuffing?",["Secretly setting affiliate cookies to steal credit","Adding more cookies to a website","A cooking video format"],0,"A form of affiliate fraud."]],
 terms:[["Programmatic advertising","Automated buying of ad space, often in real-time auctions."],["DSP","Demand-side platform used by advertisers to buy impressions."],["SSP","Supply-side platform used by publishers to sell impressions."],["MFA site","A “made for advertising” site built mainly to show ads."],["ads.txt","A file listing authorised sellers of a site's ad space."],["Retail media","Ads sold by retailers using their shopper data."],["CTV","Connected TV: streaming apps watched on TV screens."],["Affiliate marketing","Paying partners commission for sales they refer."]]},

{n:21,icon:"spark",title:"Creative strategy at scale and AI",why:"Producing the right ideas, in volume, consistently, is now a core marketing skill.",
 intro:["Days 6 and 18 showed that creative drives performance and that automated platforms reward variety. Today is about the system behind great creative: research, strategy, briefs, testing, learning, and how generative AI fits in without making every brand look the same.",
  "Examples include a famous campaign that used AI to prove the strength of a brand's distinctive assets."],
 sections:[
  ["Creative strategy, not just creative",[
   "Creative strategy connects research to execution. It answers: **what do we need people to think, feel and do, and what message and idea will get them there?**",
   {s:["**Research**: customer jobs, pains, objections and language (Day 17).","**Angles**: the different reasons to buy that matter to different people.","**Concepts**: a creative idea expressing one angle (for example “a customer's first-week story”).","**Executions**: specific ads in different formats and lengths.","**Learning**: what results teach you about angles and audiences, feeding the next round."]},
   "A **creative brief** captures this on one page: objective, audience, single-minded message, proof, mandatory elements, format and how success will be judged. Clear briefs save more time than any tool."]],
  ["The angle–persona–format matrix",[
   "Professional teams plan creative as a grid so they cover different motivations deliberately rather than by accident.",
   {c:"            Busy parent      Student          Small business owner\nPrice       Family saver     Budget hack      Cost per month\nSpeed       School-run fix   Last-minute      Time saved per week\nProof       Parent review    Creator demo     Case study numbers"},
   "Each cell becomes a concept tested in several formats. Over time the results show which angles and personas drive the cheapest results and where to produce more."]],
  ["Testing and creative analytics",[
   {l:["**Concept tests** compare big ideas; **iteration tests** improve a winner (new hooks, lengths, people).","**Tag every ad** by angle, persona, format, hook type and length. Then analyse results across tags, not just per ad: “problem-solution hooks beat discount hooks by 30% in cost per purchase” is a lesson you can reuse.","Be cautious with small numbers: a few purchases can make a poor ad look like a winner by chance (Day 11)."]},
   "The aim is a **learning system**: each round of creative makes the next round better, rather than starting from scratch every month."]],
  ["Generative AI in creative production",[
   "AI now helps at every step: summarising research, drafting copy variations, generating images and backgrounds, resizing for placements, creating voiceovers and editing video. Platforms build these tools in: Meta's Advantage+ creative features, Google's asset generation in Performance Max, and TikTok's creative tools.",
   {x:["Real world: scale of adoption","Meta reported that in one month over a million advertisers used its generative AI ad tools to create more than 15 million ads, and estimated that businesses using its image generation saw about 7% more conversions. Treat platform-reported figures as claims to test in your own account, not guarantees."]},
   {l:["**Risks**: sameness (everyone using the same tools gets similar ads), factual errors in generated text, copyright and likeness issues, and off-brand output.","**Disclosure**: platforms and laws increasingly require labelling of realistic AI-generated or altered content, especially in political and social-issue ads.","**Human judgment** stays essential for strategy, taste and final approval."]}]],
  ["Brand consistency at scale",[
   "Producing hundreds of variations can erode the brand unless the **distinctive assets** (Day 2) appear consistently: colours, logo, characters, sounds, typography and tone.",
   {x:["Real world: Heinz “A.I. Ketchup”","In 2022, Heinz and its agency Rethink asked an AI image generator to draw “ketchup” in various styles. The images it produced kept looking like Heinz bottles: the shape, label and colours. Heinz turned this into a campaign showing that even AI associates ketchup with Heinz, a vivid demonstration of how strong distinctive assets become after decades of consistent use."]},
   "Brand guidelines, templates and a review step keep large volumes of creative recognisable."]],
  ["Frameworks from the platforms",[
   "The platforms publish free creative guidance based on their data. Google's **ABCDs** for YouTube are widely used:",
   {l:["**Attract**: grab attention from the start.","**Brand**: show the brand early and often.","**Connect**: make people think or feel something.","**Direct**: ask them to take action."]},
   "TikTok's Creative Center and Meta's creative guidance make similar points for their platforms: native style, early hooks, sound on (TikTok) or sound off (many Meta placements), and clear branding."]]],
 live:[
  {t:"Watch Heinz A.I. Ketchup",url:L.ytHeinz,mins:6,steps:["Watch the short case film.","Note which brand elements the AI images reproduced."],notice:"Consistent distinctive assets become so strong that even AI reproduces them."},
  {t:"Tag top ads to find patterns",url:L.ttTop,mins:14,steps:["Open TikTok Creative Center's Top Ads for one industry.","For 6 ads, tag: angle, persona or situation, format, hook type, length.","Look across your tags. Which combinations appear most among top performers?"],notice:"Patterns across many ads teach more than any single winner."},
  {t:"Read Google's ABCDs",url:L.abcd,mins:8,steps:["Open Think with Google's ABCD guidance from the results.","Note the specific recommendations for the first 5 seconds and for branding."],notice:"Platforms share what works on their own data; it's free expertise."}],
 recap:["Creative strategy runs research → angles → concepts → executions → learning.","Plan an angle × persona × format matrix and brief each concept clearly.","Tag ads and analyse across tags to build reusable lessons.","Generative AI speeds production; strategy, taste and accuracy stay human.","Keep distinctive assets consistent, as Heinz's A.I. Ketchup showed."],
 quiz:[["What should a creative brief include?",["Objective, audience, single message, proof and success measure","Only the logo","A list of hashtags"],0,"A one-page brief keeps everyone aligned."],
  ["Why tag ads by angle and format?",["To learn which patterns work across many ads","To make files smaller","Platforms require it"],0,"Patterns are reusable lessons."],
  ["What did Heinz A.I. Ketchup demonstrate?",["AI drew Heinz-like bottles when asked for ketchup","AI can make ketchup","Heinz stopped advertising"],0,"Proof of strong distinctive assets."],
  ["What does the D in Google's ABCDs stand for?",["Direct","Design","Data"],0,"Ask viewers to take action."],
  ["What is a main risk of generative AI creative?",["Sameness and off-brand or inaccurate output","It's always illegal","It can't make images"],0,"Human review protects quality and accuracy."],
  ["What is an iteration test?",["Improving a winning ad with new hooks, lengths or people","Testing two unrelated big ideas","A website speed test"],0,"Concept tests come first; iterations refine winners."]],
 terms:[["Creative strategy","The plan linking research and message to creative execution."],["Creative brief","A one-page summary guiding a creative project."],["Angle","A specific reason to buy emphasised in an ad."],["Concept","A creative idea expressing one angle."],["Creative analytics","Analysing results across tagged ad attributes."],["ABCDs","Google's YouTube creative guidance: Attract, Brand, Connect, Direct."]]}
];
