const DAYS4=[
{n:22,icon:"code",title:"Advanced tracking and first-party data",why:"As browser tracking weakens, data infrastructure becomes a competitive advantage.",
 intro:["Day 10 explained cookies, pixels, Google Tag Manager and GA4. Today covers what professionals do now that browser-based tracking loses more data every year: server-side tagging, conversion APIs, consent modelling, first-party data strategy and privacy-safe data sharing.",
  "You'll look at real tracking requests travelling from a live website, using your browser's own developer tools."],
 sections:[
  ["Why browser tracking is breaking down",[
   "Traditional tracking runs in the visitor's browser: a tag fires and sends data to Google, Meta or TikTok. Several forces now block or shorten that data:",
   {l:["**Browser restrictions**: Safari's Intelligent Tracking Prevention limits cookies, including shortening the life of some first-party cookies set by scripts.","**Ad blockers and privacy extensions** stop known tracking scripts.","**App Tracking Transparency** (Day 7) on iPhones.","**Consent choices**: visitors who decline cookies under privacy laws.","**Short sessions and many devices**: one person on phone, laptop and work computer looks like three people."]},
   "The result is that platforms see fewer conversions than really happened, which hurts both reporting and automated bidding. Advanced tracking aims to recover accurate, consented data."]],
  ["Server-side tagging",[
   "With **server-side tagging**, the browser sends one stream of data to a server the business controls (for example a server-side Google Tag Manager container running on Google Cloud). That server then forwards cleaned data to GA4, Meta, Google Ads and others.",
   {c:"Browser-side:   browser → Google, Meta, TikTok (many scripts)\nServer-side:    browser → your server (one request)\n                your server → Google, Meta, TikTok"},
   {l:["**Benefits**: fewer scripts slow the page; more control over what each vendor receives; data can be enriched (for example with profit margin) or stripped of personal details before forwarding; requests come from your own domain.","**Costs and responsibilities**: hosting costs, technical setup and maintenance, and full responsibility for respecting consent and privacy law."]}]],
  ["Conversion APIs and enhanced conversions",[
   "Each big platform offers a server-to-server way to receive conversions: **Meta Conversions API**, **Google Ads enhanced conversions** (and offline imports), **TikTok Events API**. They typically accept **hashed** customer details (email, phone) to match conversions to users.",
   "**Hashing** turns an email address into a fixed-length code (usually with SHA-256). The platform hashes its own users' emails the same way and compares codes, so the raw address isn't sent. When the same conversion arrives from the browser and the server, a shared **event ID** lets the platform count it once (Day 8).",
   {m:"Sending personal data without the customer's consent, or sending data that isn't hashed where the platform requires hashing. Both can break privacy law and platform terms."}]],
  ["Consent mode and modelling",[
   "Google's **consent mode** adjusts tag behaviour to each visitor's choices. In **basic** mode, tags don't load until consent is given. In **advanced** mode, tags load but send cookieless pings without identifiers when consent is declined; Google then uses **modelling** to estimate the conversions and behaviour it can't observe directly.",
   "Modelling uses patterns from consenting users to fill gaps for non-consenting users, with eligibility thresholds based on data volume. It doesn't identify individuals, but it means reported numbers are partly estimates, which analysts should understand when reading reports."]],
  ["First-party data strategy",[
   "**First-party data** is information customers share directly with a business: purchases, account details, preferences, app activity. **Zero-party data** is information customers deliberately volunteer, such as quiz answers or preference centre choices.",
   {l:["**Value exchange**: people share data when they get something worthwhile: loyalty points, saved preferences, faster checkout, personalised recommendations.","**Customer data platforms (CDPs)** combine data from website, app, CRM, store and support into unified customer profiles that can feed email, ads and analytics.","**Identity resolution** links a person's different devices and emails into one profile where they've given permission."]},
   {x:["Real world: loyalty programs as data engines","Supermarket loyalty cards, coffee chain apps and airline frequent-flyer programs exchange rewards for a record of what each customer buys. That data powers personalised offers and, increasingly, retail media (Day 20), where brands pay to reach the retailer's customers based on real purchase history."]}]],
  ["Clean rooms and privacy-safe collaboration",[
   "A **data clean room** lets two parties (for example a brand and a platform or retailer) combine data for analysis without either side seeing the other's raw customer records. Only aggregated results come out.",
   {l:["**Google Ads Data Hub** and **Amazon Marketing Cloud** let advertisers analyse campaign data joined with their own data in privacy-safe environments.","Typical uses: measuring overlap between audiences, reach across channels, and conversions from ads to sales in a retailer's stores."]},
   "Behind all of this sit privacy laws: GDPR in Europe and, in Sri Lanka, the Personal Data Protection Act No. 9 of 2022. They require a lawful basis for processing (often consent), purpose limits, security, and respect for people's rights to access and delete their data."]]],
 live:[
  {t:"Watch GA4 data leave a real website",url:"https://www.daraz.lk/",mins:12,steps:["Open a large website on a computer (Daraz or any site that uses GA4).","Press F12, open the Network tab, then reload the page.","In the filter box type collect. Click a request to google-analytics.com/g/collect (if the site uses GA4) and look at its parameters: en= is the event name (such as page_view), tid= is the measurement ID.","Click around the site and watch new events appear."],notice:"This is exactly what a tag sends. Sites using server-side tagging may send to their own domain instead."},
  {t:"See Meta Pixel events on real stores",url:L.pixelHelper,mins:10,steps:["Install the free Meta Pixel Helper extension for Chrome from the result.","Visit a few online stores. Click the extension to see which Pixel events fire (PageView, ViewContent, AddToCart).","Note any warnings the extension shows."],notice:"Professionals use this to audit tracking on any website in seconds."},
  {t:"Read how consent mode works",url:L.consentDocs,mins:8,steps:["Open Google's consent mode overview from the results.","Find the difference between basic and advanced implementation and what modelling does."],notice:"Knowing which data is observed and which is modelled helps you read reports correctly."}],
 recap:["Browser restrictions, blockers, ATT and consent all reduce observed conversions.","Server-side tagging sends one stream to your server, which forwards cleaned data.","Conversion APIs receive hashed data server to server; event IDs prevent double counting.","Consent mode's modelling estimates what can't be observed; reports are partly estimates.","First-party data, CDPs and clean rooms are the privacy-safe future, within PDPA and GDPR."],
 quiz:[["What does server-side tagging change?",["The browser sends data to your server, which forwards it to vendors","Ads appear on servers","Tracking stops completely"],0,"One stream from the browser, controlled forwarding after."],
  ["Why is customer data hashed before sending to platforms?",["So raw emails aren't sent; platforms match hashed codes","To make it bigger","To translate it"],0,"Usually SHA-256 hashing."],
  ["In advanced consent mode, what happens when a visitor declines?",["Tags send cookieless pings and Google models the gaps","All tags are deleted","The visitor is blocked"],0,"Modelling estimates unobserved behaviour."],
  ["What is zero-party data?",["Information customers deliberately volunteer","Data with no value","Third-party cookies"],0,"For example preferences and quiz answers."],
  ["What does a data clean room allow?",["Joint analysis without either party seeing the other's raw records","Deleting all data","Free advertising"],0,"Only aggregated results come out."],
  ["Which Sri Lankan law governs personal data?",["Personal Data Protection Act No. 9 of 2022","There is none","Only GDPR"],0,"It requires lawful processing and respects individuals' rights."]],
 terms:[["Server-side tagging","Routing tracking through a server you control."],["Conversions API","Server-to-server conversion sending to a platform."],["Hashing","Turning data into an irreversible fixed-length code."],["Consent mode","Google's adjustment of tags to visitors' consent choices."],["First-party data","Data customers share directly with a business."],["CDP","Customer data platform unifying customer profiles."],["Data clean room","A privacy-safe environment for joint data analysis."]]},

{n:23,icon:"db",title:"Data analysis with SQL and BigQuery",why:"SQL lets you answer questions no dashboard was built for.",
 intro:["Dashboards answer the questions someone thought of in advance. SQL (Structured Query Language) lets you ask any question of the raw data. Many advanced marketing and analytics roles now expect at least basic SQL.",
  "Today teaches SQL from zero using real data: Google's public GA4 sample dataset from the Google Merchandise Store, which you can query free in the BigQuery sandbox (no credit card needed)."],
 sections:[
  ["Why marketers learn SQL",[
   "GA4's interface samples, aggregates and limits data. When GA4 exports raw events to **BigQuery** (Google's cloud data warehouse), every single event is available: you can join it with CRM, ad spend and product data, build custom attribution, analyse cohorts and feed dashboards.",
   "SQL is the language for asking questions of tables like these. It reads almost like English, and a handful of commands covers most marketing analysis."]],
  ["How the GA4 export is structured",[
   "In the export, **each row is one event**. Important columns include:",
   {l:["`event_date` and `event_timestamp`: when it happened.","`event_name`: page_view, add_to_cart, purchase and so on.","`user_pseudo_id`: an anonymous ID for the browser or device.","`traffic_source.source` / `traffic_source.medium`: how the user was first acquired.","`device.category`: desktop, mobile or tablet.","`ecommerce.purchase_revenue`: revenue on purchase events.","`event_params`: a **nested** list of extra details (such as page_location) that needs a special technique to read."]},
   "Google's public sample, `bigquery-public-data.ga4_obfuscated_sample_ecommerce`, contains obfuscated data from the Google Merchandise Store between November 2020 and January 2021. Each day is a separate table named `events_YYYYMMDD`; the wildcard `events_*` with `_TABLE_SUFFIX` selects a date range."]],
  ["SQL basics, step by step",[
   "Every query is built from the same clauses, always in this order:",
   {c:"SELECT   which columns or calculations to return\nFROM     which table\nWHERE    which rows to keep (filters)\nGROUP BY how to group rows for totals\nORDER BY how to sort the result\nLIMIT    how many rows to show"},
   "Here is a complete query that counts users by the source that first brought them, for January 2021. Read it line by line:",
   {c:"SELECT\n  traffic_source.source AS source,\n  COUNT(DISTINCT user_pseudo_id) AS users\nFROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`\nWHERE _TABLE_SUFFIX BETWEEN '20210101' AND '20210131'\nGROUP BY source\nORDER BY users DESC\nLIMIT 10;"},
   "`COUNT(DISTINCT user_pseudo_id)` counts each user once however many events they triggered. `AS` gives a column a readable name."]],
  ["Filtering and summing: revenue by device",[
   "Add a filter on `event_name` to look only at purchases, then sum the revenue:",
   {c:"SELECT\n  device.category AS device,\n  COUNT(*) AS purchases,\n  ROUND(SUM(ecommerce.purchase_revenue), 2) AS revenue\nFROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`\nWHERE event_name = 'purchase'\n  AND _TABLE_SUFFIX BETWEEN '20210101' AND '20210131'\nGROUP BY device\nORDER BY revenue DESC;"},
   "From these totals you can calculate average order value per device yourself (revenue ÷ purchases), exactly as on Day 3."]],
  ["Reading nested parameters and building a funnel",[
   "Details such as the page address live inside the nested `event_params` list. A small sub-query with `UNNEST` pulls out one value:",
   {c:"SELECT\n  (SELECT value.string_value FROM UNNEST(event_params)\n    WHERE key = 'page_location') AS page,\n  COUNT(*) AS views\nFROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_20210131`\nWHERE event_name = 'page_view'\nGROUP BY page\nORDER BY views DESC\nLIMIT 10;"},
   "And a funnel in one query, counting distinct users at each step:",
   {c:"SELECT\n  COUNT(DISTINCT IF(event_name = 'view_item', user_pseudo_id, NULL)) AS viewed,\n  COUNT(DISTINCT IF(event_name = 'add_to_cart', user_pseudo_id, NULL)) AS added,\n  COUNT(DISTINCT IF(event_name = 'begin_checkout', user_pseudo_id, NULL)) AS checkout,\n  COUNT(DISTINCT IF(event_name = 'purchase', user_pseudo_id, NULL)) AS purchased\nFROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`\nWHERE _TABLE_SUFFIX BETWEEN '20210101' AND '20210131';"},
   "Divide each step by the previous one to get conversion rates, then compare with the funnel exploration you built in GA4 on Day 11."]],
  ["From query to trustworthy insight",[
   {l:["**Check against the interface**: totals won't match GA4 exactly (the UI applies thresholds, modelling and different counting), but they should be in the same range. Big gaps mean a mistake.","**Control cost**: BigQuery charges by data scanned (the sandbox includes a free monthly allowance). Select only the columns you need and limit date ranges.","**Document queries** so others can reuse and check them.","**Visualise** results by connecting BigQuery to Looker Studio (Day 11)."]},
   {m:"Counting events when you mean users. `COUNT(*)` counts every row (event); `COUNT(DISTINCT user_pseudo_id)` counts users. Mixing them up can inflate numbers many times over."}]]],
 live:[
  {t:"Run your first query on real GA4 data",url:L.bq,mins:12,steps:["Open the BigQuery console and sign in with a Google account. If asked, create a project in the free sandbox (no card required).","Click Compose a new query (or the + tab) and paste the “users by source” query from section 3.","Click Run. Read the results: which sources brought the most users in January 2021?"],notice:"You've just queried millions of real events from Google's own store."},
  {t:"Revenue by device and AOV",url:L.bq,mins:10,steps:["Paste and run the revenue-by-device query from section 4.","Calculate the average order value for each device: revenue ÷ purchases.","Change the date range to December 2020 (20201201 to 20201231). How does the holiday season change things?"],notice:"Changing one filter and re-running is how analysts explore."},
  {t:"Build the funnel in SQL",url:L.bq,mins:10,steps:["Run the funnel query from section 5.","Work out each step's conversion rate.","Optional: look at the official schema documentation from the search results to find other columns you could add."],notice:"The same funnel you saw in GA4, rebuilt from raw events, with full control."}],
 recap:["SQL answers any question of raw data; GA4 exports every event to BigQuery.","Each row is one event; nested event_params need UNNEST.","Clauses always run SELECT, FROM, WHERE, GROUP BY, ORDER BY, LIMIT.","COUNT(DISTINCT user_pseudo_id) counts users; COUNT(*) counts events.","Check results against the interface, control cost and document queries."],
 quiz:[["In the GA4 BigQuery export, what does each row represent?",["One event","One user","One day"],0,"Users and sessions are built from events."],
  ["Which clause filters rows?",["WHERE","GROUP BY","ORDER BY"],0,"WHERE keeps only rows that match."],
  ["Which counts users rather than events?",["COUNT(DISTINCT user_pseudo_id)","COUNT(*)","SUM(event_name)"],0,"DISTINCT counts each user once."],
  ["What does UNNEST help you read?",["Nested event parameters such as page_location","Table names","Dates"],0,"event_params is a nested list."],
  ["What does _TABLE_SUFFIX do with events_*?",["Selects a range of daily tables","Sorts results","Counts users"],0,"Each day is a separate table."],
  ["How does BigQuery mainly charge for queries?",["By the amount of data scanned","By the number of users","By query length"],0,"Select only the columns you need."]],
 terms:[["SQL","Structured Query Language for asking questions of tables."],["BigQuery","Google's cloud data warehouse."],["Query","A request for data written in SQL."],["GROUP BY","Groups rows so totals can be calculated per group."],["UNNEST","Expands a nested list into rows so values can be read."],["user_pseudo_id","The GA4 export's anonymous user identifier."]]},

{n:24,icon:"target",title:"Measurement science: incrementality and marketing mix modelling",why:"Knowing what truly caused results is the most valuable skill in marketing.",
 intro:["Throughout this course you've met the gap between what dashboards report and what marketing actually causes: eBay's brand ads, Uber's fraud, Airbnb's traffic after cutting spend. Today explains the scientific methods professionals use to close that gap.",
  "It's the most conceptual day of Part 2, but also the one that most separates senior marketers from beginners."],
 sections:[
  ["Correlation is not causation",[
   "Ice cream sales and sunburn rise together, but ice cream doesn't cause sunburn; hot weather causes both. Marketing data is full of the same trap.",
   "People who see retargeting ads buy more than people who don't, but they were also the people who already visited the website, so they were more likely to buy anyway. This is **selection bias**: the ad was shown to people already on their way. Attribution reports can't separate the ad's effect from that existing intent.",
   {x:["Real world: three reminders","eBay's experiments found brand search ads produced no measurable short-term benefit (Day 7). Uber turned off about US$100 million of ads without losing installs (Day 3). Airbnb said it could keep 95% of traffic with no marketing (Day 1). In each case, reports had credited ads with sales that would have happened anyway."]}]],
  ["Randomised experiments",[
   "The gold standard is a **randomised controlled experiment**: randomly split people into a group that can see the ads and a **holdout** group that can't, then compare outcomes. Because the groups are random, any difference is caused by the ads.",
   {l:["**Platform lift studies**: Meta's conversion lift and Google's conversion lift and Brand Lift run these splits inside the platforms.","**Ghost or PSA ads**: the control group is shown a placeholder or charity ad, or a recorded “would have been shown” event, so both groups are comparable.","**Incremental ROAS (iROAS)**: incremental revenue ÷ ad spend. Often much lower than the ROAS a platform reports."]}]],
  ["Geo experiments",[
   "When person-level randomisation isn't possible (for example TV, outdoor or whole-channel tests), marketers randomise **regions** instead.",
   {s:["Choose **matched regions** with similar past sales patterns.","Change spending in the test regions (switch a channel on, off, or up) and leave the control regions unchanged.","Compare how test regions changed relative to how control regions changed over the same period: a **difference-in-differences** estimate."]},
   "Meta's open-source **GeoLift** and Google's tools help design and analyse these tests. Try the logic below with illustrative numbers.",
   {w:"geolift"}]],
  ["Marketing mix modelling explained",[
   "**Marketing mix modelling (MMM)** is a statistical model of how sales respond over time to spending in each channel, plus other factors such as price, seasonality, promotions and the economy. It uses aggregated weekly data, usually two to three years of it, so it needs no user-level tracking and isn't affected by cookie loss.",
   {l:["**Base sales**: sales that would happen with no marketing (brand strength, habit, distribution).","**Incremental sales**: sales the model attributes to each channel.","**Adstock**: the carry-over effect: an ad seen this week still influences sales next week.","**Saturation**: diminishing returns as spend in a channel rises (Day 18)."]},
   "Open-source tools have made MMM much more accessible: Meta's **Robyn** and Google's **Meridian**, which Google made generally available in January 2025. They still require good data, statistical knowledge and careful interpretation."]],
  ["Triangulation: using all three together",[
   "Professionals don't rely on one method. Each has strengths and blind spots:",
   {l:["**Attribution** (platform and GA4): fast and detailed, good for daily optimisation of ads and keywords, but biased towards last touches and tracked clicks.","**Experiments**: the most trustworthy for causal effect, but slow, costly and specific to one test.","**MMM**: covers all channels including offline, good for annual budget allocation, but needs lots of data and gives broad estimates."]},
   "A common approach: use MMM to set channel budgets, use experiments to **calibrate** the MMM and check key channels, and use attribution for day-to-day decisions within each channel."]],
  ["Reading results critically",[
   {l:["Every estimate has **uncertainty**. A result such as “iROAS 1.6, range 0.9 to 2.3” means the true value could be on either side of break-even.","**Short tests** miss long-term brand effects; incrementality tests often undervalue brand building.","**One test is one moment**: results change with season, creative and competition.","**Ask what decision the number supports**. Measurement is worth doing only if it changes where money goes."]},
   {m:"Treating platform-reported ROAS as profit. Always ask what the incremental ROAS is, and whether it beats break-even ROAS (Day 3)."}]]],
 live:[
  {t:"Explore Google's Meridian",url:L.meridian,mins:10,steps:["Open the Meridian documentation.","Read the overview: what questions it answers, what data it needs, and how it treats adstock and saturation."],notice:"MMM tools are free and open, but good results depend on good data and judgment."},
  {t:"See how a geo experiment is designed",url:L.geolift,mins:10,steps:["Open Meta's GeoLift page on GitHub.","Read the introduction and look at the example charts of test versus control markets."],notice:"Comparing regions over time can measure channels that can't be split person by person."},
  {t:"Re-read the eBay evidence with new eyes",url:L.ebay,mins:8,steps:["Re-read the eBay study abstract from Day 7.","Identify the method (randomised experiments), the result for brand and non-brand ads, and the decision it should change."],notice:"The experiment changed a decision worth millions; that's what measurement is for."}],
 recap:["Correlation isn't causation; attribution includes people who'd buy anyway.","Randomised holdouts measure true effect; iROAS is usually below reported ROAS.","Geo experiments compare matched regions using difference-in-differences.","MMM models sales from weekly spend with adstock and saturation; Robyn and Meridian are free.","Triangulate: MMM for budgets, experiments to calibrate, attribution for daily optimisation."],
 quiz:[["Why do retargeting ads often look better in reports than they are?",["They're shown to people already likely to buy","They're cheaper","Platforms hide them"],0,"Selection bias inflates their apparent effect."],
  ["What makes a randomised experiment trustworthy?",["Random groups mean differences are caused by the ads","It uses more data","It's run by agencies"],0,"Randomisation removes selection bias."],
  ["Test regions grew 17%, control regions 4%. Roughly what lift do the ads explain?",["About 13 percentage points","17%","4%"],0,"The difference-in-differences logic subtracts the control change."],
  ["What is adstock in MMM?",["The carry-over effect of advertising into later weeks","The price of an ad","A stock market index"],0,"Ads keep influencing sales after they run."],
  ["Which method is best for annual budget allocation across all channels?",["Marketing mix modelling","Last-click attribution","A single A/B test"],0,"MMM covers all channels including offline."],
  ["What is incremental ROAS?",["Incremental revenue ÷ ad spend","Total revenue ÷ ad spend","Clicks ÷ impressions"],0,"It counts only revenue the ads caused."]],
 terms:[["Incrementality","Results caused by marketing that wouldn't otherwise happen."],["Holdout group","A random group prevented from seeing ads."],["iROAS","Incremental revenue divided by ad spend."],["Geo experiment","A test that changes spend in some regions and not others."],["Difference-in-differences","Comparing the change in test regions with the change in controls."],["Adstock","Advertising's carry-over effect over time."],["Triangulation","Combining MMM, experiments and attribution."]]},

{n:25,icon:"flask",title:"Experimentation at scale and advanced CRO",why:"The best digital companies decide by testing, not by opinion.",
 intro:["Day 11 introduced A/B testing with Obama's 2008 sign-up page. Today shows how the world's most data-driven companies run thousands of experiments a year, the statistical traps that catch even experts, and how advanced conversion rate optimisation (CRO) research works.",
  "The main source is research by Ron Kohavi, who led experimentation at Microsoft, and Harvard professor Stefan Thomke."],
 sections:[
  ["Why experimentation wins",[
   {x:["Real world: one ignored idea worth US$100 million","Kohavi and Thomke described in Harvard Business Review (2017) how a Microsoft employee proposed a small change to how ad headlines were displayed in Bing search. It was judged low priority and sat for more than six months. When an engineer finally tested it, revenue rose 12%, worth more than US$100 million a year in the US alone, without hurting user experience metrics. It became the best revenue-generating idea in Bing's history."]},
   "The same article reported that Microsoft, Amazon, Booking.com, Facebook and Google **each run more than 10,000 online controlled experiments a year**, and that only about **10–20% of experiments at Google and Bing** produce positive results. Across Microsoft roughly a third of ideas helped, a third made no difference and a third made things worse.",
   "The lesson is humbling: most ideas, even experts' ideas, don't work as expected. Testing is how companies find the few that do and avoid launching the ones that hurt."]],
  ["Designing a good experiment",[
   {s:["**Hypothesis**: what you'll change, what you expect, and why (Day 11's template).","**Overall evaluation criterion (OEC)**: the primary metric that defines success, ideally tied to long-term value (for example revenue per visitor, not just clicks).","**Guardrail metrics**: things that must not get worse, such as page speed, refunds or unsubscribes.","**Randomisation unit**: usually users, so the same person always sees the same version.","**Sample size and duration**: set in advance from the baseline rate and the smallest effect worth detecting, covering whole weeks."]},
   {m:"Choosing a metric that's easy to move but doesn't matter, such as clicks on a banner. Tests then “win” while the business gains nothing."}]],
  ["Statistical traps",[
   {l:["**Peeking**: checking results daily and stopping when they look significant greatly increases false positives (Day 11).","**Multiple comparisons**: testing 20 metrics at 95% confidence will produce about one “significant” result by chance.","**Novelty and primacy effects**: users react to any change at first; effects can fade or grow over weeks.","**Twyman's law**: any figure that looks interesting or different is usually wrong. Check surprising results for bugs before celebrating.","**Sample ratio mismatch (SRM)**: if you planned a 50/50 split but got, say, 50,000 vs 48,600 users, something is broken (bots, redirects, tracking). The results can't be trusted until it's fixed."]},
   {w:"srm"}]],
  ["Beyond simple A/B tests",[
   {l:["**A/B/n**: more than two versions at once (needs more traffic).","**Multivariate tests**: several elements combined, as in Obama's 4 buttons × 6 images = 24 combinations.","**Multi-armed bandits**: algorithms that shift traffic towards better-performing versions during the test. They earn more during the test but give less clean learning, so they suit short-lived decisions like headlines for a sale.","**Personalisation**: showing different versions to different segments, which itself should be tested against a single best version."]}]],
  ["Advanced CRO research",[
   "Good test ideas come from research, not brainstorming alone.",
   {l:["**Analytics**: funnel drop-offs and segment differences (Days 11 and 23).","**Heuristic review**: experts assessing pages against principles such as clarity, relevance, anxiety and distraction (Day 4's LIFT ideas).","**Session recordings and heatmaps**: tools such as Microsoft Clarity show where people hesitate, rage-click or stop scrolling.","**On-site surveys**: “What's stopping you from completing your purchase today?”","**Usability testing**: watching real people try to complete tasks while thinking aloud."]},
   "Ideas are then ranked with frameworks such as **ICE** (impact, confidence, ease) or **PIE** (potential, importance, ease) and turned into a testing roadmap."]],
  ["Building an experimentation culture",[
   "At experiment-led companies, the question in meetings changes from “what do you think?” to “what did the test show?”.",
   {x:["Real world: Booking.com","Booking.com is widely cited as one of the most experiment-driven companies in the world. Its engineers have described a platform that lets employees across the company design and launch experiments themselves, with built-in safeguards and shared results, so that testing is part of everyday product and marketing work rather than a specialist activity."]},
   {l:["Make running a test easy and cheap.","Share all results, including failures, so everyone learns.","Protect test quality with automatic checks (such as SRM detection).","Reward learning, not just wins."]}]]],
 live:[
  {t:"Read the HBR article on online experiments",url:L.hbr,mins:14,steps:["Read “The Surprising Power of Online Experiments” by Kohavi and Thomke.","Find the Bing headline story, the experiment volumes and the success rates.","Note one practice you'd adopt in any marketing team."],notice:"Even top companies find most ideas don't work; that's why they test."},
  {t:"See how Booking.com democratised testing",url:L.booking,mins:8,steps:["Open the paper “Democratizing online controlled experiments at Booking.com” and read the abstract.","What did Booking.com build so that anyone could run trustworthy experiments?"],notice:"Culture and tooling together make experimentation routine."},
  {t:"Browse a library of real A/B test results",url:L.goodui,mins:8,steps:["Open GoodUI, which collects results from real A/B tests.","Browse a few tests: what was changed, and how big was the effect?","Notice how many changes produce small or uncertain effects."],notice:"Real effects are usually smaller than people expect, which is why sample size matters."}],
 recap:["Most ideas fail; experiments find the few that work (Bing: +12%, over US$100 million a year).","Define an overall evaluation criterion, guardrails, randomisation and sample size in advance.","Avoid peeking, multiple comparisons and novelty effects; check SRM.","Multivariate tests and bandits suit different goals.","Base test ideas on research and build a culture where testing is easy."],
 quiz:[["What happened when Bing finally tested the ad headline idea?",["Revenue rose 12%, over US$100 million a year in the US","Revenue fell","Nothing changed"],0,"It had sat unprioritised for more than six months."],
  ["Roughly what share of experiments at Google and Bing are positive?",["About 10–20%","About 90%","About 50%"],0,"Most ideas don't work as expected."],
  ["What is a guardrail metric?",["A metric that must not get worse during a test","The main success metric","The number of visitors"],0,"For example page speed or refunds."],
  ["A planned 50/50 test has 50,000 vs 48,600 users. What should you suspect?",["Sample ratio mismatch: something is broken","A great result","Normal noise, always"],0,"Fix the cause before trusting results."],
  ["What does Twyman's law say?",["Surprising results are usually wrong; check for errors","Bigger samples are worse","Always stop tests early"],0,"Investigate before celebrating."],
  ["When are multi-armed bandits most useful?",["Short-lived decisions where earning during the test matters","Learning precise long-term effects","Testing website speed"],0,"They trade clean learning for faster gains."]],
 terms:[["OEC","Overall evaluation criterion: the primary success metric."],["Guardrail metric","A metric that must not worsen during a test."],["Peeking","Checking results early and stopping when they look significant."],["SRM","Sample ratio mismatch: the split differs from what was planned."],["Twyman's law","Interesting-looking figures are usually wrong."],["Multi-armed bandit","An algorithm that shifts traffic to better versions during a test."],["Multivariate test","Testing combinations of several elements at once."]]},

{n:26,icon:"search",title:"Advanced SEO and AI search",why:"Search is changing fast as AI answers sit on top of results.",
 intro:["Day 13 covered the essentials of SEO. Today goes deeper: how Google's quality systems evolved, how large sites win at scale, technical SEO for big websites, and the new discipline of appearing in AI-generated answers from Google, ChatGPT, Perplexity and others.",
  "The examples are real sites that dominate search, and you'll test an AI search engine yourself."],
 sections:[
  ["How Google's quality systems evolved",[
   "Google changes its ranking systems thousands of times a year and announces larger **core updates** several times a year. Recent updates have focused on rewarding genuinely helpful, original content and penalising content made mainly to rank.",
   {x:["Real world: the March 2024 core update","In March 2024 Google released a major core update together with new spam policies, targeting abuses such as mass-produced low-value content, cheap content hosted on reputable sites to borrow their authority, and expired domains repurposed to rank. When it finished in April 2024, Google said users would see 45% less low-quality, unoriginal content in search results, more than the 40% it had expected."]},
   "The practical lesson: shortcuts that once worked, such as publishing many thin pages, can now damage a whole site. Durable SEO comes from content that people genuinely find useful."]],
  ["Topical authority and content at scale",[
   "Google tends to trust sites that cover a topic thoroughly and well. Building **topical authority** means:",
   {l:["Mapping every question your audience has about a topic (Day 13's intent types).","Creating **clusters**: a pillar page and detailed supporting pages, linked together.","**Refreshing** important pages as facts change, because content decays.","Pruning or improving weak pages instead of letting them drag down the site."]},
   "Big publishers and software companies organise content teams around topics, each owning a cluster, with editors, subject experts and SEO specialists working together."]],
  ["Programmatic SEO",[
   "**Programmatic SEO** creates many pages from a template plus a database, each answering a specific search. When every page is genuinely useful, it can capture enormous numbers of long-tail searches.",
   {x:["Real world: pages that answer exact searches","Wise has a currency converter page for currency pairs such as USD to LKR, each showing the live mid-market rate, charts and fees. Zapier has pages for combinations of apps (for example connecting Gmail with Google Sheets), each describing real automations. Travel sites have pages for things to do in each city. Every page matches a precise search intent with useful, data-driven content."]},
   {m:"Generating thousands of near-identical pages with no unique value. Google's spam policies now explicitly target mass-produced, unhelpful content, whether written by people or AI."}]],
  ["Technical SEO for large sites",[
   {l:["**Crawl budget**: on huge sites, Google won't crawl everything often. Prioritise important pages and avoid endless URL variations.","**Log file analysis**: server logs show which pages Googlebot actually visits and how often.","**JavaScript rendering**: content that only appears after scripts run may be indexed late or not at all; server-side rendering helps.","**Faceted navigation**: filters (size, colour, price) can create millions of duplicate URLs; control them with canonical tags and parameters.","**International SEO**: hreflang tags tell Google which language or country version to show.","**Site migrations**: changing domain or structure without careful redirects can lose much of a site's traffic."]}]],
  ["AI search and generative engine optimisation",[
   "Google's AI Overviews and AI Mode, ChatGPT search, Perplexity and other AI assistants now answer many questions directly, citing a handful of sources. Being one of those sources is becoming as important as ranking. This is often called **generative engine optimisation (GEO)** or AI search optimisation.",
   {l:["**Be retrievable**: AI search systems still find pages through search indexes, so classic SEO remains the foundation.","**Be extractable**: clear headings, direct answers near the top, lists, tables and up-to-date facts are easier to quote.","**Be mentioned**: AI answers lean heavily on what trusted third parties say (reviews, news, forums, Wikipedia, YouTube). Earned media (Day 1) matters more than ever.","**Be clear about your entity**: consistent names, descriptions and structured data help systems understand who you are."]},
   "Measurement is still developing. Professionals check referral traffic from AI tools in analytics (for example sessions from chatgpt.com or perplexity.ai) and regularly test the questions customers ask to see whether and how the brand is cited."]],
  ["Measuring and forecasting SEO",[
   {l:["**Search Console**: clicks, impressions, average position and click-through rate by query and page (Day 13).","**Rank tracking** for priority keywords, while remembering rankings vary by location and person.","**Share of voice**: your visibility across a set of important searches compared with competitors.","**Business outcomes**: organic sign-ups, sales and revenue in GA4, not only traffic."]},
   "SEO forecasts multiply search volume by expected click-through rate at a target position by conversion rate, with wide uncertainty. Because results take months and depend on competitors and Google's updates, good SEO teams present ranges and milestones rather than promises."]]],
 live:[
  {t:"Study a programmatic SEO page",url:L.wise,mins:10,steps:["Search for “wise usd to lkr” and open Wise's converter page.","List what makes it useful: live rate, chart, fee comparison, explanations.","Change the currency pair in the URL or on the page. How is the template reused?"],notice:"Programmatic pages work when each one genuinely answers a specific need."},
  {t:"See how an AI search engine cites sources",url:L.perplexity,mins:12,steps:["Open Perplexity (free, no account needed) or Google's AI Mode if available to you.","Ask a buying question, for example “What is the best mobile banking app in Sri Lanka?”.","Look at the cited sources. Are they brand websites, news, forums, reviews or videos? What would a brand need to do to be cited?"],notice:"AI answers lean on third-party mentions, so earned media and clear content both matter."},
  {t:"Read about the March 2024 update",url:L.gsc45,mins:8,steps:["Read the report on the March 2024 core update.","Note the dates, the 45% figure and what Google changed in its spam policies."],notice:"Google's direction is consistent: reward helpful, original content; punish shortcuts."}],
 recap:["Core updates reward helpful, original content; March 2024 cut low-quality content by 45% (per Google).","Topical authority: cover a topic fully, cluster pages, refresh and prune.","Programmatic SEO works only when every page is genuinely useful.","Large sites manage crawl budget, rendering, facets, hreflang and migrations.","For AI search: be retrievable, extractable, mentioned and clearly defined."],
 quiz:[["What did Google say the March 2024 update achieved?",["45% less low-quality, unoriginal content in results","Twice as many ads","Removal of all AI content"],0,"It expected 40% and reported 45%."],
  ["What is programmatic SEO?",["Creating many pages from a template and data, each answering a specific search","Buying search ads automatically","Writing one long page"],0,"Wise's currency pages are an example."],
  ["What do hreflang tags do?",["Tell Google which language or country version to show","Speed up pages","Add star ratings"],0,"Used for international sites."],
  ["What is crawl budget?",["How much of a site Google crawls in a period","The SEO team's budget","The cost of a backlink"],0,"Large sites must prioritise important pages."],
  ["Which helps a brand get cited in AI answers?",["Clear answers on its pages and mentions on trusted third-party sites","Hiding content","Keyword stuffing"],0,"AI systems lean heavily on trusted sources."],
  ["How can you see traffic from AI assistants in GA4?",["Look for referral sessions from domains like chatgpt.com or perplexity.ai","It's impossible","Only in Search Console"],0,"Referral sources reveal AI-driven visits."]],
 terms:[["Core update","A significant change to Google's ranking systems."],["Topical authority","Trust earned by covering a topic thoroughly."],["Programmatic SEO","Template-and-data pages targeting many specific searches."],["Crawl budget","How much of a site a search engine crawls in a period."],["hreflang","Tags indicating language or regional versions of a page."],["GEO","Generative engine optimisation: appearing in AI-generated answers."]]},

{n:27,icon:"mail",title:"Lifecycle, personalisation and marketing operations",why:"At scale, keeping and growing customers is run by systems, data and teams.",
 intro:["Day 12 covered email, CRM and automation basics. Today goes deeper into the economics of retention, how personalisation engines work at companies like Netflix and Spotify, predictive marketing, orchestration across channels, and the operations that hold a modern marketing stack together.",
  "It ends with business-to-business (B2B) practices: account-based marketing and revenue operations."],
 sections:[
  ["The economics of retention",[
   "For subscription businesses, lifetime value depends heavily on **churn**, the share of customers who leave each period. Average customer lifetime is roughly 1 ÷ churn.",
   {c:"Monthly churn 5%  → average lifetime ≈ 1 ÷ 0.05 = 20 months\nMonthly churn 2.5% → average lifetime ≈ 1 ÷ 0.025 = 40 months\n\nLTV ≈ monthly revenue per customer × gross margin ÷ monthly churn"},
   "Halving churn roughly doubles lifetime value, which lets a business afford to spend more on acquisition. That's why mature companies invest heavily in onboarding, engagement and win-back.",
   {w:"churn"}]],
  ["How personalisation engines work",[
   "**Recommendation systems** predict what each person is most likely to want next, using their own behaviour and patterns from similar people. Two common approaches are **collaborative filtering** (people who liked what you liked also liked this) and **content-based filtering** (items similar to ones you engaged with).",
   {x:["Real world: Netflix artwork","In 2017 Netflix's technology team described how it personalises not only which titles you see but which **artwork** is shown for each title. Someone who watches many romantic films might see a romantic scene from a film, while someone who watches comedies sees an image featuring a comedian from the same film. The goal is to show each member the image most likely to make that title relevant to them."]},
   {x:["Real world: Spotify Discover Weekly","Since 2015 Spotify has given every user a personalised playlist each Monday called Discover Weekly, built from their listening and the listening of people with similar taste. Personalisation turned into a weekly habit and a reason to keep coming back."]}]],
  ["Predictive marketing",[
   "Predictive models estimate what each customer is likely to do next, so marketing can act before it happens.",
   {l:["**Purchase propensity**: who is likely to buy soon (target with timely offers).","**Churn propensity**: who is likely to leave (target with retention offers or support).","**Predicted lifetime value**: who is likely to be most valuable (bid more to acquire similar people, Day 18's value optimisation).","**Next best action**: which message or offer to show each person."]},
   "GA4 itself offers predictive metrics, such as purchase probability, churn probability and predicted revenue, and lets you build audiences from them when a property has enough data. Larger companies build their own models from CRM and product data."]],
  ["Orchestrating the customer lifecycle",[
   "Customers now receive messages through email, app push notifications, SMS, WhatsApp, in-app messages and ads. **Journey orchestration** coordinates them so each person gets a sensible sequence, not five channels shouting at once.",
   {l:["**Frequency caps** across channels, not just within each one.","**Channel preference**: send through the channel each person engages with most.","**Suppression**: stop promotional messages when someone has a support problem or just bought.","**Protect the channel**: over-messaging trains people to ignore or unsubscribe, and many never return."]},

const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
function seeded(len,seed){const a=[...Array(len).keys()];let x=(seed*9301+49297)%233280;for(let i=len-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ncdf(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function blockText(b){if(typeof b==="string")return plain(b);if(b.s)return b.s.map((x,i)=>(i+1)+". "+plain(x)).join("\n");if(b.l)return b.l.map(x=>"- "+plain(x)).join("\n");if(b.c)return b.c;if(b.x)return "Real world, "+b.x[0]+": "+plain(b.x[1]);if(b.m)return "Common mistake: "+plain(b.m);return ""}

const LS="mkt-bootcamp-v3";

let dbRef=null,syncMode="browser",saveTimer=null,writing=false,pending=false;
function merge(a,b){
  const o=JSON.parse(JSON.stringify(a));
  for(const k of ["read","live","done","cards","next"]){o[k]=Object.assign({},a[k]||{});for(const [x,v] of Object.entries(b[k]||{}))if(v)o[k][x]=v}
  o.quiz={};for(const d of new Set([...Object.keys(a.quiz||{}),...Object.keys(b.quiz||{})]))o.quiz[d]=Object.assign({},(b.quiz||{})[d],(a.quiz||{})[d]);
  o.w=Object.assign({},b.w||{},a.w||{});o.notes=Object.assign({},b.notes||{},a.notes||{});
  o.activity=[...new Set([...(a.activity||[]),...(b.activity||[])])].sort();o.lang=a.lang||b.lang||"English";
  return o;
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!dbRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
async function flush(){if(!dbRef)return;if(writing){pending=true;return}writing=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)))}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked")){dbRef=null;syncMode="browser";updateSync()}}
  writing=false;if(pending){pending=false;flush()}}
function touch(){const k=ymd(new Date());if(!S.activity.includes(k)){S.activity.push(k);S.activity.sort()}}
async function initStore(){
  try{if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);if(!user||!db)return;
    const uid=await user.id();if(!uid)return;
    const ref=db.doc("data/users/"+uid+"/progress-v3");const snap=await ref.get();dbRef=ref;syncMode="account";
    if(snap.exists){S=merge(S,snap.data()||{});try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}route(false)}
    else if(Object.keys(S.read).length||Object.keys(S.done).length||Object.keys(S.quiz).length){flush()}
    updateSync();
  }catch(e){dbRef=null}
}

let sampleFn=null;
(async()=>{try{if(window.claude&&window.claude.use)sampleFn=await claude.use("sample")}catch(e){sampleFn=null}document.body.classList.toggle("has-ai",!!sampleFn)})();
const TEACHER="You are a patient, expert digital marketing teacher. Your student in Sri Lanka is taking a 28-day course, about 2 hours a day (Part 1 foundations, Days 1–14; Part 2 advanced, Days 15–28), and wants clear, detailed explanations with real examples rather than exercises. Use plain English and short sentences, explain every technical term the first time, use everyday analogies, and use money in LKR where helpful. Only use real-world company facts you are confident are accurate; if unsure, use a clearly labelled hypothetical instead of inventing facts or statistics. No markdown headings or bold; use '- ' for bullet points.";
function langLine(){return S.lang&&S.lang!=="English"?`\nWrite the whole answer in ${S.lang}, keeping marketing terms (like CTR, ROAS, GA4) in English with a short explanation.`:""}
function aiFail(e,out){const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sampleFn=null;document.body.classList.remove("has-ai");out.textContent="";toast("AI explanations are off for this page.");return}
  if(c==="cancelled")return;
  if(c==="rate_limited"){out.innerHTML='<span class="who">Teacher</span>Too many questions at once. Try again in a minute.';return}
  if(c==="refused"){out.innerHTML='<span class="who">Teacher</span>I can only help with this marketing course. Try rephrasing.';return}
  out.innerHTML='<span class="who">Teacher</span>'+esc((e&&e.text)||"")+(e&&e.text?"\n\n(Interrupted. Try again.)":"I couldn't answer just now. Try again.")}
async function askAI(prompt,out,btn){if(!sampleFn)return;if(btn)btn.disabled=true;out.innerHTML='<span class="who">Teacher</span>Thinking…';
  try{await sampleFn(prompt,{cache:false,onText:({text})=>{out.innerHTML='<span class="who">Teacher</span>'+esc(text)}})}catch(e){aiFail(e,out)}if(btn)btn.disabled=false}

function dayStats(n){const d=D(n);const lv=d.live.filter((_,i)=>S.live[n+"-"+i]).length;const q=S.quiz[n]||{};const qa=Object.keys(q).length;const qc=Object.entries(q).filter(([i,a])=>d.quiz[i]&&d.quiz[i][2]===a).length;
  return {read:!!S.read[n],lv,lt:d.live.length,qa,qc,qt:d.quiz.length,done:!!S.done[n]}}
function totals(){let done=0,qc=0,qa=0,lv=0,lt=0,read=0;for(const d of DAYS){const s=dayStats(d.n);done+=s.done?1:0;qc+=s.qc;qa+=s.qa;lv+=s.lv;lt+=s.lt;read+=s.read?1:0}return {done,qc,qa,lv,lt,read}}
function streak(){const set=new Set(S.activity);let d=new Date();if(!set.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function nextDay(){for(const d of DAYS)if(!S.done[d.n])return d.n;return DAYS.length}

function widgetHTML(n,kind){
  const key=n+"-"+kind,v=S.w[key]||{};
  if(SORTS[kind]){const L=SORTS[kind],right=L.items.filter((it,i)=>v[i]===it[1]).length,ans=Object.keys(v).filter(k=>/^\d+$/.test(k)).length;

  const T=TOOLS[kind],x=Object.assign({},T.d,v.x||{});

function funnelSVG(){

  const bands=PHASES.map((p,i)=>{const w1=W-i*step,w2=W-(i+1)*step,x1=(W-w1)/2,x2=(W-w2)/2,y=top+i*(bh+gap)+(p.part===2?10:0);return {p,i,y,pts:`${x1},${y} ${x1+w1},${y} ${x2+w2},${y+bh} ${x2},${y+bh}`,x:Math.min(x1,x2),w:Math.max(w1,w2)}});
  bands.forEach(b=>out+=`<clipPath id="fc${b.i}"><polygon points="${b.pts}"/></clipPath>`);out+="</defs>";
  bands.forEach(b=>{const dn=b.p.days.filter(n=>S.done[n]).length,frac=dn/b.p.days.length,c=`var(${b.p.c})`,sw=frac>0?3:0;

}

let deck=[],ci=0,flipped=false,cardMode="all";
function buildDeck(){const all=[];for(const d of DAYS)for(const t of d.terms)all.push({term:t[0],def:t[1],day:d.n});deck=cardMode==="learning"?all.filter(c=>!S.cards[c.term]):all;if(ci>=deck.length)ci=0}
function viewCards(){buildDeck();const known=Object.keys(S.cards).length,total=DAYS.reduce((a,d)=>a+d.terms.length,0);
  return `<div class="sec-head" style="margin-bottom:22px"><div><div class="eyebrow">Key terms from all 14 days</div><h2 style="font-size:clamp(26px,4vw,36px);margin-top:6px">Flashcards</h2></div><p class="mono">${known}/${total} known</p></div>
  <div class="cards-wrap"><div class="seg" role="group" aria-label="Which cards"><button aria-pressed="${cardMode==="all"}" data-mode="all">All cards</button><button aria-pressed="${cardMode==="learning"}" data-mode="learning">Still learning</button></div>
   ${deck.length?`<button class="fc" id="fc" aria-label="Flip card"><div class="in"><div class="face front"><span class="tagline">Day ${deck[ci].day} · term</span><b>${esc(deck[ci].term)}</b></div><div class="face back"><span class="tagline">Meaning</span><span>${esc(deck[ci].def)}</span></div></div></button>
   <p class="muted">Card ${ci+1} of ${deck.length} · tap the card or press Space to flip</p>
   <div class="fc-ctl"><button class="btn" id="fcPrev">← Back</button><button class="btn" id="fcAgain">Still learning</button><button class="btn primary" id="fcGot">I know this</button><button class="btn" id="fcShuffle">Shuffle</button></div>`
   :`<div class="box" style="text-align:center;max-width:460px"><p><b>You know every card.</b></p><p class="muted">Switch to “All cards” to review them again.</p></div>`}</div>`}
function bindCards(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{cardMode=b.dataset.mode;ci=0;flipped=false;render("cards")}));
  const fc=$("#fc");if(!fc)return;fc.addEventListener("click",()=>{flipped=!flipped;fc.classList.toggle("flip",flipped)});
  const go=k=>{ci=(ci+k+deck.length)%deck.length;flipped=false;render("cards")};
  $("#fcPrev").onclick=()=>go(-1);$("#fcAgain").onclick=()=>{delete S.cards[deck[ci].term];save();go(1)};
  $("#fcGot").onclick=()=>{S.cards[deck[ci].term]=1;touch();save();if(cardMode==="learning")render("cards");else go(1)};
  $("#fcShuffle").onclick=()=>{ci=Math.floor(Math.random()*deck.length);flipped=false;render("cards")};
}
document.addEventListener("keydown",e=>{if(currentView!=="cards"||e.target.matches("input,textarea,select"))return;const fc=$("#fc");if(!fc)return;
  if(e.key===" "&&e.target!==fc){e.preventDefault();fc.click()}if(e.key==="ArrowRight")$("#fcGot").click();if(e.key==="ArrowLeft")$("#fcPrev").click()});

  return `<div style="max-width:880px"><div class="eyebrow">The next two months · keep learning for free</div><h2 style="font-size:clamp(26px,4vw,38px);margin:8px 0 10px">After Day 28</h2>
  <p class="reading" style="font-size:16px;color:var(--ink-2)">With both parts complete, free certificates are the best next step: they go deeper into each platform and give employers proof. When you feel ready, practise on a real page or business; until then, keep studying real campaigns.</p>
  <div class="tbl" style="margin-top:18px"><table style="min-width:600px"><thead><tr><th>Done</th><th>When</th><th>Free courses and certificates</th><th>Focus</th></tr></thead><tbody>
  ${NEXT.map((w,i)=>`<tr><td><input type="checkbox" id="nw${i}" data-week="${i}" ${S.next[i]?"checked":""} aria-label="${w.w} done" style="width:20px;height:20px;accent-color:var(--good)"></td><td><b>${w.w}</b></td><td>${w.cert.map(([c,by,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(c)} ↗</a><br><span class="muted">${esc(by)}</span>`).join("<br>")}</td><td>${esc(w.focus)}</td></tr>`).join("")}
  </tbody></table></div>
  <section class="sec"><div class="sec-head"><h2>Keep watching real marketing</h2></div><ul class="reading" style="padding-left:20px;display:grid;gap:8px;font-size:16px">
   <li>Every week, open <a href="${L.adlib}" target="_blank" rel="noopener">Meta Ad Library</a> for 3 brands you admire and note what changed.</li>
   <li>Read case studies on <a href="${L.aotw}" target="_blank" rel="noopener">Ads of the World</a> and break down the single idea in each.</li>
   <li>Keep exploring the <a href="${L.gademo}" target="_blank" rel="noopener">GA4 demo account</a>: it's real data and the best free analytics practice there is.</li></ul></section></div>`}
function bindNext(){document.querySelectorAll("[data-week]").forEach(c=>c.addEventListener("change",()=>{if(c.checked)S.next[c.dataset.week]=true;else delete S.next[c.dataset.week];touch();save()}))}

/* ================= Timer ================= */
let TM=null;const TOTAL=BLOCKS.reduce((a,b)=>a+b[1],0)*60;
try{const t=JSON.parse(localStorage.getItem(LS+"-timer")||"null");if(t&&Date.now()-t.start<5*3600e3)TM=t}catch(e){}
function startTimer(n){TM={n,start:Date.now(),paused:0,pausedAt:null};saveTM();tick();toast("Session started: Review first")}
function saveTM(){try{TM?localStorage.setItem(LS+"-timer",JSON.stringify(TM)):localStorage.removeItem(LS+"-timer")}catch(e){}}
function tick(){const el=$("#timer");if(!TM){el.hidden=true;return}
  const now=TM.pausedAt||Date.now(),es=Math.max(0,(now-TM.start-TM.paused)/1000);let acc=0,bi=BLOCKS.length-1;
  for(let i=0;i<BLOCKS.length;i++){if(es<acc+BLOCKS[i][1]*60){bi=i;break}acc+=BLOCKS[i][1]*60}
  const over=es>=TOTAL,left=over?0:acc+BLOCKS[bi][1]*60-es;if(TM.lastB!==undefined&&TM.lastB!==bi&&!over)toast("Next: "+BLOCKS[bi][0]);TM.lastB=bi;el.hidden=false;
  el.innerHTML=`<div class="row"><div><div class="blk">${over?"Session done":esc(BLOCKS[bi][0])}</div><div class="hint">Day ${TM.n} · ${over?"Mark the day complete":esc(BLOCKS[bi][2])}</div></div><div class="clk">${pad(Math.floor(left/60))}:${pad(Math.floor(left%60))}</div></div>
   <div class="track">${BLOCKS.map((b,i)=>{let a=0;for(let j=0;j<i;j++)a+=BLOCKS[j][1]*60;const f=Math.min(1,Math.max(0,(es-a)/(b[1]*60)));return `<div style="flex:${b[1]}"><i style="width:${f*100}%"></i></div>`}).join("")}</div>
   <div class="row"><button id="tPause">${TM.pausedAt?"Resume":"Pause"}</button><a href="#day-${TM.n}" style="color:inherit;font-size:13px">Open Day ${TM.n}</a><button id="tStop">Stop</button></div>`;
  $("#tPause").onclick=()=>{if(TM.pausedAt){TM.paused+=Date.now()-TM.pausedAt;TM.pausedAt=null}else TM.pausedAt=Date.now();saveTM();tick()};
  $("#tStop").onclick=()=>{TM=null;saveTM();tick()};
}
setInterval(()=>{if(TM&&!TM.pausedAt)tick()},1000);

/* ================= Router ================= */
let currentView="home";
function render(v){
  if(bindDay.cleanup){bindDay.cleanup();bindDay.cleanup=null}
  const app=$("#app");currentView=v.startsWith("day-")?"day":v;
  if(v.startsWith("day-")){const n=Math.min(14,Math.max(1,parseInt(v.slice(4))||1));app.innerHTML=viewDay(n);bindDay(n)}
  else if(v==="cards"){app.innerHTML=viewCards();bindCards()}
  else if(v==="live"){app.innerHTML=viewLive()}
  else if(v==="next"){app.innerHTML=viewNext();bindNext()}
  else{app.innerHTML=viewHome();updateSync()}
  document.querySelectorAll("#nav a").forEach(a=>{const on=a.dataset.v===currentView||(currentView==="day"&&a.dataset.v==="continue"&&v==="day-"+nextDay());if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  updateChrome();
}
function route(scroll){let h=(location.hash||"#home").slice(1);if(h==="continue")h="day-"+nextDay();
  if(!(["home","cards","live","next"].includes(h)||/^day-\d+$/.test(h)))h="home";render(h);if(scroll)window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>route(true));
route(false);tick();initStore();
</script>
